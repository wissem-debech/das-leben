{"u":4,"ar":"الضمائر الشخصية في حالة الجرّ (Dativ)","de":"Personalpronomen im Dativ","x":"بعض الأفعال تأخذ Dativ دائماً: helfen، gefallen، gehören، danken، passen، schmecken. وكذلك عبارات مثل Wie geht es dir? احفظ الصيغ: mir، dir، ihm، ihr، uns، euch، ihnen/Ihnen.","tbl":[["","Akkusativ","Dativ"],["ich","mich","<b>mir</b>"],["du","dich","<b>dir</b>"],["er / es","ihn / es","<b>ihm</b>"],["sie","sie","<b>ihr</b>"],["wir","uns","<b>uns</b>"],["ihr","euch","<b>euch</b>"],["sie / Sie","sie / Sie","<b>ihnen / Ihnen</b>"]],"ex":[["Wie geht es <mark>Ihnen</mark>?","كيف حالك؟ (رسمي)"],["Das gefällt <mark>mir</mark> wirklich gut!","هذا يعجبني حقاً!"],["Kannst du <mark>mir</mark> helfen?","هل يمكنك مساعدتي؟"]],"err":["Kannst du mich helfen?","Kannst du mir helfen?"],"tip":"helfen يأخذ Dativ: Ich helfe <b>dir</b> (وليس dich).","qz":[["Der Pullover gefällt ___. (ich)",["mich","mir","mein"],1],["Ich helfe ___ beim Umzug. (er)",["ihn","ihm","ihr"],1],["Wie geht es ___? (du)",["dich","dir","du"],1]]},
{"u":5,"ar":"حروف الجرّ مع Dativ","de":"Präpositionen mit Dativ","x":"بعد <b>aus, bei, mit, nach, von, seit, zu</b> يأتي الاسم دائماً في حالة الجرّ (Dativ): der/das → <b>dem</b>، die → <b>der</b>، الجمع → <b>den</b> + n. وتُدمج بعضها مع الأداة: zum، zur، beim، vom.","rule":"<b>aus · bei · mit · nach · von · seit · zu</b> + Dativ<br>zu + dem = <b>zum</b> · zu + der = <b>zur</b> · bei + dem = <b>beim</b> · von + dem = <b>vom</b>","ex":[["Wir fahren <mark>mit dem</mark> Auto <mark>zu meiner</mark> Familie nach Bayern.","نسافر بالسيارة إلى عائلتي في بافاريا."],["Das machen wir <mark>seit vielen</mark> Jahren.","نفعل ذلك منذ سنوات كثيرة."],["Wir bleiben dann <mark>bei der</mark> Familie.","ثمّ نبقى عند العائلة."]],"err":["Ich arbeite seit drei Jahre hier.","Ich arbeite seit drei Jahren hier."],"tip":"جملة للحفظ: Von <b>aus, bei, mit</b> nach <b>von, seit, zu</b> kommst immer mit dem Dativ du.","qz":[["Ich fahre jeden Tag mit ___ Bus.",["den","dem","der"],1],["Er kommt gerade ___ Arbeit.",["von der","von die","vom"],0],["Ich gehe heute ___ Arzt.",["zu den","zum","zur"],1]]},
{"u":5,"ar":"الصفات بعد أداة التعريف","de":"Adjektive nach dem bestimmten Artikel","x":"بعد der / das / die تأخذ الصفة <b>-e</b> في المفرد (رفع، ونصب das/die). في النصب المذكّر (den) وفي الجمع تأخذ <b>-en</b>.","tbl":[["","Nominativ","Akkusativ"],["der","der neu<b>e</b> Computer","den neu<b>en</b> Computer"],["das","das neu<b>e</b> Büro","das neu<b>e</b> Büro"],["die","die neu<b>e</b> Chefin","die neu<b>e</b> Chefin"],["Plural","die neu<b>en</b> Büros","die neu<b>en</b> Büros"]],"ex":[["Ich mag <mark>den täglichen</mark> Kontakt mit Kunden.","أحبّ التواصل اليومي مع الزبائن."],["<mark>Das große</mark> Büro finde ich toll.","المكتب الكبير أجده رائعاً."],["<mark>Die neuen</mark> Kollegen sind nett.","الزملاء الجدد لطفاء."]],"err":["Ich finde den neue Computer gut.","Ich finde den neuen Computer gut."],"tip":"قاعدة سهلة: بعد der/das/die في المفرد ← -e، وبعد den وفي الجمع ← -en.","qz":[["Wie findest du ___ Chef? (neu)",["den neue","den neuen","der neue"],1],["___ Büro ist sehr hell. (groß)",["Das große","Das großes","Das großen"],0],["Ich kaufe ___ Schuhe. (rot)",["die rote","die roten","die rotes"],1]]},
{"u":5,"ar":"الصفات بعد ein و kein و mein","de":"Adjektive nach ein, kein und mein","x":"بعد ein / kein / mein … تُظهر الصفة جنس الاسم لأنّ الأداة ليس لها نهاية: ein neu<b>er</b> Computer، ein neu<b>es</b> Büro. في النصب المذكّر: einen neu<b>en</b>. في الجمع: keine/meine … <b>-en</b>.","tbl":[["","Nominativ","Akkusativ"],["der","(k)ein neu<b>er</b> Computer","(k)einen neu<b>en</b> Computer"],["das","(k)ein neu<b>es</b> Büro","(k)ein neu<b>es</b> Büro"],["die","(k)eine neu<b>e</b> Chefin","(k)eine neu<b>e</b> Chefin"],["Plural","keine neu<b>en</b> Büros","keine neu<b>en</b> Büros"]],"ex":[["Ich mag <mark>meine tolle</mark> Chefin.","أحبّ مديرتي الرائعة."],["Ich habe <mark>keine festen</mark> Arbeitszeiten.","ليس لديّ أوقات عمل ثابتة."],["Wir haben <mark>ein neues</mark> Büro.","لدينا مكتب جديد."]],"err":["Ich habe einen neuer Job.","Ich habe einen neuen Job."],"tip":"كل أدوات الملكية (mein, dein, unser …) و kein تعمل مثل ein.","qz":[["Das ist ein ___ Handy. (neu)",["neue","neues","neuen"],1],["Ich suche einen ___ Job. (gut)",["guter","guten","gutes"],1],["Mein ___ Kollege heißt Tom. (neu)",["neue","neuer","neuen"],1]]},
{"u":5,"ar":"الأسماء المنتهية بـ -ung","de":"Nomen mit -ung","x":"من كثير من الأفعال نصنع اسماً بإضافة <b>-ung</b> إلى الجذر. هذه الأسماء أداتها دائماً <b>die</b>، وجمعها <b>-ungen</b>.","tbl":[["ausbilden","<b>die</b> Ausbildung"],["(sich) bewegen","<b>die</b> Bewegung"],["(sich) verändern","<b>die</b> Veränderung"],["wohnen","<b>die</b> Wohnung"],["planen","<b>die</b> Planung"]],"ex":[["Sie macht eine <mark>Ausbildung</mark> als Köchin.","هي تقوم بتكوين مهني لتصبح طبّاخة."],["Die <mark>Planung</mark> dauert lange.","التخطيط يستغرق وقتاً طويلاً."],["Wir suchen eine neue <mark>Wohnung</mark>.","نبحث عن شقة جديدة."]],"err":["der Wohnung","die Wohnung"],"tip":"-ung = دائماً die. في الاسم المنتهي بـ -ung تجد غالباً فعلاً.","qz":[["Welcher Artikel? ___ Zeitung",["der","die","das"],1],["Aus „erfahren“ wird …",["das Erfahren","die Erfahrung","der Erfahrung"],1],["Welcher Plural ist richtig?",["die Wohnungs","die Wohnungen","die Wohnunge"],1]]},
{"u":6,"ar":"الماضي البسيط: الأفعال المنتظمة","de":"Präteritum: regelmäßige Verben","x":"الـ Präteritum زمن ماضٍ نستعمله خاصة في <b>النصوص المكتوبة</b> (قصص، سِيَر، أخبار). في الكلام نستعمل غالباً Perfekt. الأفعال المنتظمة: الجذر + <b>te</b> + النهاية. ich و er/es/sie لهما نفس الصيغة بدون نهاية إضافية.","rule":"Stamm + <b>te</b> + Endung · Stamm auf -t/-d: + <b>ete</b>","tbl":[["","leben","arbeiten"],["ich","leb<b>te</b>","arbeit<b>ete</b>"],["du","leb<b>test</b>","arbeit<b>etest</b>"],["er/es/sie","leb<b>te</b>","arbeit<b>ete</b>"],["wir","leb<b>ten</b>","arbeit<b>eten</b>"],["ihr","leb<b>tet</b>","arbeit<b>etet</b>"],["sie/Sie","leb<b>ten</b>","arbeit<b>eten</b>"]],"ex":[["1806 <mark>heiratete</mark> Goethe Christiane Vulpius.","عام 1806 تزوّج غوته كريستيانه فولبيوس."],["Er <mark>lebte</mark> lange in Weimar.","عاش طويلاً في فايمار."],["Sie <mark>studierten</mark> in Leipzig.","درسوا في لايبزيغ."]],"err":["Er lebtet in Weimar.","Er lebte in Weimar."],"tip":"إذا انتهى الجذر بـ t أو d نضيف e: arbeit<b>e</b>te، red<b>e</b>te. صيغة du/ihr نادرة في الماضي البسيط.","qz":[["Goethe ___ in Italien. (reisen)",["reiste","reistet","reisten"],0],["Wir ___ viel. (lachen)",["lachte","lachten","lachtet"],1],["Sie ___ als Lehrerin. (arbeiten)",["arbeitete","arbeitte","arbeitet"],0]]},
{"u":6,"ar":"الجملة الفرعية مع als","de":"Nebensätze mit als","x":"<b>als</b> = «عندما» لحدث <b>واحد</b> أو فترة واحدة في الماضي. الفعل في آخر الجملة الفرعية. إذا بدأنا بها، يأتي فعل الجملة الرئيسية مباشرة بعد الفاصلة (الموقع 2).","rule":"<b>Als</b> + … + Verb<b>,</b> <b>Verb</b> + Subjekt … (Nebensatz auf Position 1)","ex":[["Goethe war erst 16 Jahre alt, <mark>als</mark> er in Leipzig Jura <mark>studierte</mark>.","كان غوته في السادسة عشرة فقط عندما درس الحقوق في لايبزيغ."],["<mark>Als</mark> Goethe in Italien <mark>war</mark>, <mark>malte</mark> er viele Bilder.","عندما كان غوته في إيطاليا، رسم لوحات كثيرة."],["<mark>Als</mark> ich klein <mark>war</mark>, <mark>wohnten</mark> wir in Tunis.","عندما كنت صغيراً، كنّا نسكن في تونس."]],"err":["Als ich klein war, ich wohnte in Sfax.","Als ich klein war, wohnte ich in Sfax."],"tip":"als = مرّة واحدة في الماضي. wenn = في الحاضر/المستقبل أو «كلّما».","qz":[["___ ich 18 war, habe ich den Führerschein gemacht.",["Wenn","Als","Wann"],1],["Als er in Berlin wohnte, ___ er viele Freunde.",["er hatte","hatte","hat er hatte"],1],["Als sie nach Wien kam, ___ sie kein Deutsch.",["sprach","sprechen","spricht"],0]]},
{"u":7,"ar":"صيغة التفضيل قبل الاسم: der größte","de":"Superlativ vor Nomen: der größte","x":"قبل الاسم نستعمل الأداة + صفة + <b>(e)st</b> + نهاية الصفة: der größ<b>te</b> Hund، die schnell<b>sten</b> Tiere. نفس الشواذ: der beste، die meisten، der höchste.","tbl":[["","am …","vor dem Nomen"],["groß","am größten","der/das/die größ<b>te</b>"],["jung","am jüngsten","der/das/die jüng<b>ste</b>"],["alt","am ältesten","der/das/die ält<b>este</b>"],["gut","am besten","der/das/die be<b>ste</b>"],["viel","am meisten","die mei<b>sten</b>"],["hoch","am höchsten","der/das/die höch<b>ste</b>"]],"ex":[["Die Wolga ist <mark>der längste</mark> Fluss Europas.","الفولغا هو أطول نهر في أوروبا."],["Die Donau fließt durch <mark>die meisten</mark> Länder.","الدانوب يمرّ بأكبر عدد من البلدان."],["Das sind <mark>die schnellsten</mark> Tiere.","هذه أسرع الحيوانات."]],"err":["Das ist der am größten Hund.","Das ist der größte Hund."],"tip":"بعد الفعل: am größten. قبل الاسم: der größte Hund.","qz":[["Der Gepard ist ___ Tier der Welt. (schnell)",["das schnellste","das am schnellsten","das schneller"],0],["Das ist ___ Kind in der Familie. (jung)",["der jüngste","das jüngste","das jüngsten"],1],["Wer hat ___ Haustiere? (viel)",["die meisten","die mehr","die vielsten"],0]]},
{"u":7,"ar":"الصفات في حالة الجرّ (Dativ)","de":"Adjektive im Dativ","x":"الخبر الجيّد: بعد أداة في الـ Dativ (dem, der, einem, einer, meinem, den …) تأخذ الصفة <b>دائماً -en</b>، مهما كان الجنس أو العدد.","rule":"Artikel im Dativ + Adjektiv + <b>-en</b> (immer!)","ex":[["Das ist ein Hund mit <mark>einem weißen</mark> Schwanz.","هذا كلب بذيل أبيض."],["Die Kuh mit <mark>dem braunen</mark> Fell heißt Lisa.","البقرة ذات الفرو البنّي اسمها ليزا."],["Das sind Schweine mit <mark>schwarzen</mark> Ohren.","هذه خنازير بآذان سوداء."]],"err":["Ich wohne mit einer netten Freundin und einem kleine Hund.","Ich wohne mit einer netten Freundin und einem kleinen Hund."],"tip":"بعد mit و bei و von و zu … + أداة ← الصفة تنتهي بـ -en.","qz":[["Die Katze mit ___ Fell ist süß. (dem, schwarz)",["dem schwarze","dem schwarzen","dem schwarzem"],1],["Ich spreche mit ___ Nachbarin. (der, neu)",["der neue","der neuen","der neuer"],1],["Er wohnt in einem ___ Haus. (alt)",["alten","altes","alte"],0]]},
{"u":7,"ar":"أسئلة W غير المباشرة","de":"Indirekte W-Fragen","x":"عندما نبدأ بـ Weißt du, … أو Können Sie mir sagen, … تبقى أداة السؤال (wo, wie, wann, warum …) لكنّ الفعل يذهب إلى <b>آخر الجملة</b>. هذا أكثر تهذيباً.","rule":"Können Sie mir sagen / Weißt du, + <b>W-Wort</b> + … + <b>Verb am Ende</b>?","ex":[["Können Sie mir sagen, <mark>wie</mark> spät es <mark>ist</mark>?","هل يمكنك أن تقول لي كم الساعة؟"],["Weißt du, <mark>wo</mark> mein Schlüssel <mark>ist</mark>?","هل تعرف أين مفتاحي؟"],["Ich frage mich, <mark>wie</mark> lange das noch <mark>dauert</mark>.","أتساءل كم سيستمرّ هذا بعد."]],"err":["Wissen Sie, wann kommt der Zug?","Wissen Sie, wann der Zug kommt?"],"tip":"مع أداة سؤال لا نستعمل ob: Weißt du, <b>wo</b> …? / Weißt du, <b>ob</b> …? (للنعم/لا).","qz":[["Wo wohnt sie? → Weißt du, ___?",["wo sie wohnt","wo wohnt sie","ob sie wohnt"],0],["Können Sie mir sagen, wann der Kurs ___?",["beginnt","beginnen","beginnt er"],0],["Ich weiß nicht, ___ er heißt.",["wie","ob","dass"],0]]},
{"u":7,"ar":"الفعل werden","de":"Das Verb werden","x":"<b>werden</b> = «يصبح». نستعمله للمهنة في المستقبل، وللعمر (Sie wird 30)، وللتغيّر (Es wird kalt). وهو شاذ: du <b>wirst</b>، er <b>wird</b>. وسنستعمله لاحقاً لصنع المبني للمجهول (Passiv).","tbl":[["","Präsens"],["ich","werde"],["du","<b>wirst</b>"],["er/es/sie","<b>wird</b>"],["wir","werden"],["ihr","werdet"],["sie/Sie","werden"]],"ex":[["Mein Bruder möchte Automechaniker <mark>werden</mark>.","أخي يريد أن يصبح ميكانيكي سيارات."],["Unsere Katze <mark>wird</mark> morgen zehn Jahre alt.","قطّتنا ستبلغ غداً عشر سنوات."],["Es <mark>wird</mark> kalt.","الجوّ يبرد."]],"err":["Du werdest Tierärztin.","Du wirst Tierärztin."],"tip":"مع المهنة لا نضع أداة: Er wird <b>Lehrer</b>.","qz":[["Was ___ du später? – Ingenieurin.",["wirst","werdest","wird"],0],["Im Herbst ___ es früh dunkel.",["wirdt","wird","werdet"],1],["Meine Oma ___ nächste Woche 80.",["werdet","wird","wirst"],1]]},
{"u":8,"ar":"الجمل الموصولة في حالة الرفع","de":"Relativsätze im Nominativ","x":"الجملة الموصولة تصف اسماً بدقّة. تبدأ بضمير موصول (der / das / die) حسب <b>جنس الاسم</b> الموصوف وعدده، والفعل في آخرها. في الرفع يكون الضمير الموصول هو الفاعل.","tbl":[["","Relativpronomen (Nom.)"],["der","ein Kuchen, <b>der</b> aus Dresden kommt"],["das","ein Brot, <b>das</b> aus der Schweiz kommt"],["die","eine Torte, <b>die</b> aus Linz kommt"],["Plural","Kuchen, <b>die</b> aus Aachen kommen"]],"ex":[["Der Christstollen ist ein Kuchen, <mark>der</mark> aus Dresden <mark>kommt</mark>.","الشتولن هو كعكة تأتي من درسدن."],["Die Linzer Torte ist eine Torte, <mark>die</mark> aus Österreich <mark>kommt</mark>.","تورتة لينز هي تورتة تأتي من النمسا."],["Printen sind kleine Kuchen, <mark>die</mark> aus Aachen <mark>kommen</mark>.","البرينتن كعكات صغيرة تأتي من آخن."]],"err":["Das ist ein Mann, der wohnt neben mir.","Das ist ein Mann, der neben mir wohnt."],"tip":"الضمير الموصول = نفس الأداة: der Kuchen → <b>der</b>، das Brot → <b>das</b>، die Torte → <b>die</b>.","qz":[["Das ist ein Gericht, ___ aus Tunesien kommt.",["der","das","die"],1],["Ich habe eine Freundin, ___ in Wien wohnt.",["der","die","das"],1],["Das sind Leute, die gern ___.",["kochen","kocht","kochen sie"],0]]},
{"u":8,"ar":"الجمل الموصولة في حالة النصب","de":"Relativsätze im Akkusativ","x":"إذا كان الاسم الموصوف <b>مفعولاً به</b> داخل الجملة الموصولة، نستعمل ضمير النصب. الفرق الوحيد عن الرفع في المذكّر: der → <b>den</b>. das و die لا يتغيّران.","tbl":[["","Relativpronomen (Akk.)"],["der","ein Kuchen, <b>den</b> man überall isst"],["das","ein Brot, <b>das</b> man aus Birnen macht"],["die","eine Torte, <b>die</b> man mit Nüssen macht"],["Plural","Kuchen, <b>die</b> man im Winter isst"]],"ex":[["Der Stollen ist ein Kuchen, <mark>den</mark> man in ganz Deutschland <mark>isst</mark>.","الشتولن كعكة يأكلها الناس في كل ألمانيا."],["Das ist ein Brot, <mark>das</mark> man aus Birnen <mark>macht</mark>.","هذا خبز يُصنع من الإجاص."],["Der Film, <mark>den</mark> ich gestern gesehen habe, war toll.","الفيلم الذي شاهدته أمس كان رائعاً."]],"err":["Das ist der Kuchen, der ich gebacken habe.","Das ist der Kuchen, den ich gebacken habe."],"tip":"اسأل: هل الاسم فاعل (يفعل) أم مفعول (يُفعل به)؟ المذكّر المفعول ← den.","qz":[["Der Pullover, ___ ich gekauft habe, ist zu klein.",["der","den","dem"],1],["Die Stadt, ___ ich am liebsten mag, ist Graz.",["die","der","den"],0],["Das Buch, ___ du mir geschenkt hast, ist spannend.",["den","das","die"],1]]},
{"u":9,"ar":"الأفعال المساعدة في الماضي البسيط","de":"Modalverben im Präteritum","x":"مع الأفعال المساعدة نستعمل الـ Präteritum حتى في الكلام اليومي (وليس Perfekt). القاعدة: <b>بدون Umlaut</b> + <b>-te</b>: können → konnte، müssen → musste، dürfen → durfte. ich و er نفس الصيغة.","tbl":[["","können","müssen","wollen","dürfen","sollen"],["ich","konnte","musste","wollte","durfte","sollte"],["du","konntest","musstest","wolltest","durftest","solltest"],["er/es/sie","konnte","musste","wollte","durfte","sollte"],["wir","konnten","mussten","wollten","durften","sollten"],["ihr","konntet","musstet","wolltet","durftet","solltet"],["sie/Sie","konnten","mussten","wollten","durften","sollten"]],"ex":[["Gestern <mark>konnte</mark> ich nicht kommen, ich <mark>musste</mark> arbeiten.","أمس لم أستطع المجيء، كان عليّ أن أعمل."],["Als Kind <mark>wollte</mark> ich Pilotin werden.","عندما كنت طفلة أردت أن أصبح طيّارة."],["Früher <mark>durften</mark> wir nicht lange fernsehen.","في الماضي لم يكن يُسمح لنا بمشاهدة التلفاز طويلاً."]],"err":["Ich könnte gestern nicht kommen.","Ich konnte gestern nicht kommen."],"tip":"انتبه: könnte (بالـ Umlaut) معناها «يمكن أن / لو» وليست الماضي. الماضي = konnte. و mögen → mochte.","qz":[["Letzte Woche ___ wir viel arbeiten.",["mussten","müssten","musstet"],0],["Warum ___ du nicht zur Party kommen?",["wolltest","wolltet","willst"],0],["Als Kind ___ ich nicht allein in die Stadt.",["durfte","dürfte","darfte"],0]]},
{"u":9,"ar":"أدوات الملكية في حالة الجرّ","de":"Possessivartikel im Dativ","x":"أدوات الملكية (mein, dein, sein, ihr, unser, euer, Ihr) و ein و kein لها نفس النهايات. في الـ Dativ: مذكّر/محايد <b>-em</b>، مؤنّث <b>-er</b>، جمع <b>-en</b> ونضيف n للاسم في الجمع.","tbl":[["","der / das","die","Plural"],["Nominativ","mein Beruf / Büro","meine Kollegin","meine Kollegen"],["Akkusativ","meinen Beruf / mein Büro","meine Kollegin","meine Kollegen"],["Dativ","mein<b>em</b> Beruf / Büro","mein<b>er</b> Kollegin","mein<b>en</b> Kollegen"]],"ex":[["In <mark>unserem</mark> Büro ist es sehr laut.","في مكتبنا الضجيج كبير جداً."],["Ich telefoniere oft mit <mark>meiner</mark> Mutter.","أتّصل كثيراً بأمّي."],["Er spielt mit <mark>seinen</mark> Kinder<mark>n</mark>.","هو يلعب مع أولاده."]],"err":["Ich wohne bei meine Eltern.","Ich wohne bei meinen Eltern."],"tip":"Dativ جمع = -en + n في الاسم: mit meinen Freunde<b>n</b>.","qz":[["Ich fahre mit ___ Fahrrad. (mein)",["meinem","meinen","meiner"],0],["Sie spricht mit ___ Chefin. (ihr)",["ihrem","ihrer","ihre"],1],["Wir helfen ___ Nachbarn. (unser, Plural)",["unserem","unseren","unsere"],1]]},
{"u":10,"ar":"الأفعال مع حروف الجرّ","de":"Verben mit Präpositionen","x":"كثير من الأفعال تأتي مع حرف جرّ ثابت، وغالباً لا يشبه حرف الجرّ في العربية أو الإنجليزية. احفظ دائماً: <b>الفعل + حرف الجرّ + الحالة</b> (Akkusativ أو Dativ).","tbl":[["warten <b>auf</b> + A","ينتظر"],["denken <b>an</b> + A","يفكّر في"],["sprechen / reden <b>über</b> + A","يتحدّث عن"],["Angst haben <b>vor</b> + D","يخاف من"],["teilnehmen <b>an</b> + D","يشارك في"],["anfangen <b>mit</b> + D","يبدأ بـ"],["erzählen <b>von</b> + D","يحكي عن"]],"ex":[["Ich <mark>warte auf</mark> den Bus.","أنتظر الحافلة."],["Ich <mark>denke</mark> oft <mark>an</mark> meine Familie.","أفكّر كثيراً في عائلتي."],["Wir <mark>nehmen an</mark> der Feier <mark>teil</mark>.","نشارك في الحفل."]],"err":["Ich warte für den Bus.","Ich warte auf den Bus."],"tip":"اكتب في دفترك: warten auf + A، Angst haben vor + D … واحفظها كوحدة واحدة.","qz":[["Hast du Angst ___ Hunden?",["vor","von","an"],0],["Die Menschen reden ___ dich.",["über","von","mit"],0],["Ich fange morgen ___ dem Kurs an.",["mit","an","auf"],0]]},
{"u":10,"ar":"الأسئلة مع worauf و worüber …","de":"Fragen mit worauf, worüber, woran, womit","x":"لنسأل عن <b>شيء</b> مع فعل له حرف جرّ نستعمل <b>wo + حرف الجرّ</b>. إذا بدأ حرف الجرّ بحرف علّة نضيف r: wo<b>r</b>auf، wo<b>r</b>über، wo<b>r</b>an. للسؤال عن <b>شخص</b>: حرف الجرّ + wen/wem: Auf wen wartest du?","rule":"wo + Präposition (vor Vokal: <b>wor</b>-): worauf, worüber, woran · aber: womit, wovon, wozu","ex":[["<mark>Worauf</mark> freut sich Jana am meisten? – <mark>Auf</mark> den Sommer.","بماذا تفرح يانا أكثر؟ – بالصيف."],["<mark>Worüber</mark> ärgerst du dich? – <mark>Über</mark> die teuren Tickets.","ممّ تغضب؟ – من التذاكر الغالية."],["<mark>Woran</mark> denkst du gerade? – <mark>An</mark> den Urlaub.","في ماذا تفكّر الآن؟ – في العطلة."]],"err":["Auf was wartest du?","Worauf wartest du?"],"tip":"شيء ← wo(r)+حرف الجرّ. شخص ← حرف الجرّ + wen/wem.","qz":[["___ interessierst du dich? – Für Musik.",["Wofür","Worauf","Woran"],0],["___ fährst du zum Festival? – Mit dem Bus.",["Womit","Wovon","Worum"],0],["___ ärgerst du dich? – Über den Lärm.",["Worüber","Woran","Wofür"],0]]},
{"u":10,"ar":"الماضي البسيط: الأفعال الشاذة","de":"Präteritum: unregelmäßige Verben","x":"الأفعال الشاذة تغيّر حرف العلّة في <b>كل</b> الضمائر ولا تأخذ ‎-te. ich و er/es/sie <b>بدون نهاية</b>: ich schrieb، er schrieb، wir schrieben.","tbl":[["","Präsens","Präteritum","Perfekt"],["schreiben","sie schreibt","sie <b>schrieb</b>","sie hat geschrieben"],["sprechen","sie spricht","sie <b>sprach</b>","sie hat gesprochen"],["lesen","sie liest","sie <b>las</b>","sie hat gelesen"],["fahren","sie fährt","sie <b>fuhr</b>","sie ist gefahren"],["gehen","sie geht","sie <b>ging</b>","sie ist gegangen"],["kommen","sie kommt","sie <b>kam</b>","sie ist gekommen"]],"ex":[["Goethe <mark>schrieb</mark> viele Gedichte.","كتب غوته قصائد كثيرة."],["Im Sommer <mark>fuhren</mark> wir zum Festival.","في الصيف ذهبنا إلى المهرجان."],["Am Abend <mark>kamen</mark> 20 000 Leute.","في المساء جاء 20000 شخص."]],"err":["Er schriebte einen Brief.","Er schrieb einen Brief."],"tip":"احفظ الأفعال الشاذة كسلسلة: lesen – las – gelesen. إذا كان التصريف الثالث ينتهي بـ ‎-en فالفعل غالباً شاذ: gegeben → gab.","qz":[["Gestern ___ ich einen langen Brief. (schreiben)",["schrieb","schreibte","schriebte"],0],["Wir ___ um 8 Uhr nach Hause. (gehen)",["gingen","gehten","gangen"],0],["Er ___ das Buch in zwei Tagen. (lesen)",["las","lieste","lest"],0]]},
{"u":11,"ar":"الجمل الشرطية مع wenn … (dann)","de":"Sätze mit wenn … (dann)","x":"<b>wenn</b> = «إذا / عندما» للشرط. الفعل يذهب إلى آخر جملة wenn. إذا بدأنا بها، يأتي فعل الجملة الرئيسية مباشرة بعد الفاصلة، ويمكن أن نضيف <b>dann</b>.","rule":"<b>Wenn</b> + … + Verb<b>,</b> (dann) <b>Verb</b> + Subjekt …","ex":[["Ich verkaufe Kleidung im Internet, <mark>wenn</mark> sie mir nicht mehr <mark>passt</mark>.","أبيع الملابس على الإنترنت عندما لا تعود تناسبني."],["<mark>Wenn</mark> ich Geld sparen <mark>möchte</mark>, (dann) <mark>gehe</mark> ich auf den Flohmarkt.","إذا أردت أن أوفّر المال، أذهب إلى سوق الأشياء المستعملة."],["<mark>Wenn</mark> es <mark>regnet</mark>, <mark>nehme</mark> ich einen Schirm mit.","إذا أمطرت، آخذ معي مظلّة."]],"err":["Wenn es regnet, ich bleibe zu Hause.","Wenn es regnet, bleibe ich zu Hause."],"tip":"بعد الفاصلة: فعل ثم فاعل: …, <b>bleibe ich</b> zu Hause.","qz":[["Wenn du Zeit hast, ___ ins Kino.",["gehen wir","wir gehen","wir dann gehen"],0],["Ich fahre mit dem Rad, wenn das Wetter schön ___.",["ist","sein","ist es"],0],["___ ich müde bin, trinke ich Kaffee.",["Wenn","Als","Wann"],0]]},
{"u":11,"ar":"warum – weil و wann – wenn","de":"warum – weil, wann – wenn","x":"لا تخلط: <b>wann?</b> سؤال عن الزمن (متى؟)، أمّا <b>wenn</b> فأداة ربط (إذا/عندما). <b>warum?</b> سؤال عن السبب، وجوابه <b>weil</b>.","tbl":[["warum?","weil","سبب"],["wann?","wenn","شرط / زمن"]],"ex":[["<mark>Warum</mark> kommst du nicht? – <mark>Weil</mark> es regnet.","لماذا لا تأتي؟ – لأنّها تمطر."],["<mark>Wann</mark> kommst du nach Hause? – <mark>Wenn</mark> der Regen aufhört.","متى تعود إلى البيت؟ – عندما يتوقّف المطر."],["Ich bin froh, <mark>wenn</mark> der Winter vorbei ist.","أكون سعيداً عندما ينتهي الشتاء."]],"err":["Wann es regnet, bleibe ich zu Hause.","Wenn es regnet, bleibe ich zu Hause."],"tip":"wann = في السؤال فقط. wenn = في الجملة الفرعية.","qz":[["Warum bist du so müde? – ___ ich schlecht geschlafen habe.",["Wenn","Weil","Wann"],1],["Wann rufst du an? – ___ ich zu Hause bin.",["Weil","Wenn","Wann"],1],["___ beginnt der Film? – Um 20 Uhr.",["Wenn","Wann","Weil"],1]]},
{"u":11,"ar":"الجملة الفرعية مع damit","de":"Nebensätze mit damit","x":"<b>damit</b> = «لكي / حتّى» وتعبّر عن الهدف. الفعل يذهب إلى آخر الجملة. نستعمل damit خاصّة عندما يكون الفاعل في الجملتين <b>مختلفاً</b>.","rule":"Hauptsatz<b>,</b> <b>damit</b> + Subjekt + … + <b>Verb am Ende</b>","ex":[["Wir brauchen den Garten, <mark>damit</mark> wir aktiv <mark>bleiben</mark>.","نحتاج الحديقة لكي نبقى نشيطين."],["Wir sind im Verein, <mark>damit</mark> wir andere Leute <mark>kennenlernen</mark>.","نحن في الجمعية لكي نتعرّف على أناس آخرين."],["Ich erkläre es dir noch einmal, <mark>damit</mark> du es <mark>verstehst</mark>.","سأشرحه لك مرّة أخرى لكي تفهمه."]],"err":["Ich lerne viel, damit ich bestehe die Prüfung.","Ich lerne viel, damit ich die Prüfung bestehe."],"tip":"فاعل مختلف ← damit. نفس الفاعل ← يمكن um … zu أيضاً (الوحدة 12).","qz":[["Sprich bitte langsam, ___ ich dich verstehe.",["damit","weil","dass"],0],["Wir trennen den Müll, damit die Umwelt sauber ___.",["bleibt","bleiben","bleibt sie"],0],["Ich gebe dir den Schlüssel, damit du ins Haus ___.",["kannst","kommen kannst","kannst kommen"],1]]},
{"u":11,"ar":"الصفات المنتهية بـ -bar","de":"Adjektive mit -bar","x":"جذر الفعل + <b>-bar</b> = «يمكن أن يُفعل»: essbar = يمكن أكله. هذه الكلمات صفات وتُكتب بحرف صغير.","tbl":[["essen → essbar","يُؤكل"],["trinken → trinkbar","صالح للشرب"],["waschen → waschbar","قابل للغسل"],["bezahlen → bezahlbar","بسعر معقول"],["brauchen → brauchbar","صالح للاستعمال"]],"ex":[["Sind die Kräuter <mark>essbar</mark>? – Ja, die kann man essen.","هل الأعشاب صالحة للأكل؟ – نعم، يمكن أكلها."],["Die Miete ist <mark>bezahlbar</mark>.","الإيجار معقول (يمكن دفعه)."],["Vorsicht, das Wasser ist nicht <mark>trinkbar</mark>.","انتبه، الماء غير صالح للشرب."]],"err":["Die Bluse ist waschenbar.","Die Bluse ist waschbar."],"tip":"-bar = man kann + Verb: waschbar = man kann es waschen.","qz":[["Das kann man lesen. = Das ist ___.",["lesbar","lesenbar","gelesen"],0],["Die Wohnung ist nicht zu teuer. Sie ist ___.",["bezahlbar","bezahlt","zahlenbar"],0],["Was bedeutet „machbar“?",["Man kann es machen.","Man muss es machen.","Man hat es gemacht."],0]]},
{"u":12,"ar":"um … zu + المصدر","de":"um … zu + Infinitiv","x":"<b>um … zu</b> = «من أجل / لكي» عندما يكون <b>الفاعل نفسه</b> في الجملتين. لا يوجد فاعل بعد um، والمصدر مع zu في الآخر. في الأفعال المنفصلة تدخل zu في الوسط: an<b>zu</b>rufen.","rule":"Hauptsatz<b>,</b> <b>um</b> + … + <b>zu</b> + Infinitiv · trennbar: auf<b>zu</b>hängen","ex":[["Wozu brauchst du die Leiter? – <mark>Um</mark> die Decke <mark>zu streichen</mark>.","لماذا تحتاج السلّم؟ – لكي أطلي السقف."],["Ich brauche die Bohrmaschine, <mark>um</mark> das Bild <mark>aufzuhängen</mark>.","أحتاج المثقاب لكي أعلّق اللوحة."],["Ich brauche kein Auto, <mark>um</mark> in die Stadt <mark>zu fahren</mark>.","لا أحتاج سيارة للذهاب إلى المدينة."]],"err":["Ich lerne Deutsch, um ich in Wien arbeiten kann.","Ich lerne Deutsch, um in Wien zu arbeiten."],"tip":"damit و um … zu لهما نفس المعنى. مع um … zu لا نكتب فاعلاً ثانياً.","qz":[["Ich spare Geld, um ein Auto ___.",["zu kaufen","kaufen","kaufe"],0],["Er braucht die Schere, um das Paket ___.",["aufzumachen","zu aufmachen","aufmachen zu"],0],["Wir sind im Verein, ___ andere Leute kennenzulernen.",["um","damit","weil"],0]]},
{"u":12,"ar":"المبني للمجهول في المضارع","de":"Passiv im Präsens","x":"في المبني للمجهول (Passiv) يهمّنا <b>الفعل</b> نفسه، لا من يفعله. نصنعه بـ <b>werden</b> (wird / werden) + <b>Partizip II</b> في آخر الجملة. يُستعمل كثيراً في التعليمات والوصفات.","rule":"<b>werden</b> (Position 2) + … + <b>Partizip II</b> (am Ende)","ex":[["Kai schließt das Ladekabel an. → Das Ladekabel <mark>wird angeschlossen</mark>.","كاي يوصل كابل الشحن. ← يتمّ توصيل كابل الشحن."],["Zuerst <mark>wird</mark> der Akku <mark>aufgeladen</mark>.","أوّلاً تُشحن البطارية."],["Dann <mark>werden</mark> die Tasten <mark>gedrückt</mark>.","ثمّ تُضغط الأزرار."]],"err":["Das Handy ist repariert. (Vorgang)","Das Handy wird repariert."],"tip":"Aktiv: الشخص مهمّ. Passiv: الفعل مهمّ. «man + فعل» ≈ Passiv.","qz":[["Hier ___ Fahrräder repariert.",["werden","wird","werdet"],0],["Das Paket wird morgen ___.",["geschickt","schicken","schickt"],0],["Man öffnet das Gerät. → Das Gerät ___.",["wird geöffnet","ist öffnen","wird öffnen"],0]]},
{"u":13,"ar":"حروف الجرّ مع Akkusativ","de":"Präpositionen mit Akkusativ","x":"بعد <b>durch</b> (عبر)، <b>ohne</b> (بدون)، <b>gegen</b> (ضدّ / نحو)، <b>für</b> (لـ)، <b>um</b> (حول / الساعة) يأتي الاسم دائماً في حالة النصب: der → <b>den</b>.","rule":"<b>durch · ohne · gegen · für · um</b> + Akkusativ","ex":[["Wir laufen <mark>durch den</mark> Wald.","نمشي عبر الغابة."],["<mark>Ohne</mark> gute Schuhe soll man nicht in den Bergen wandern.","بدون حذاء جيّد لا ينبغي المشي في الجبال."],["Danach wandern wir <mark>um den</mark> See.","بعد ذلك نمشي حول البحيرة."]],"err":["Ich gehe ohne dem Schirm.","Ich gehe ohne den Schirm."],"tip":"تتغيّر الأداة فقط مع المذكّر: für <b>den</b> Bruder، لكن für die Schwester، für das Kind.","qz":[["Das Geschenk ist für ___ Bruder.",["meinen","meinem","mein"],0],["Das Auto ist gegen ___ Baum gefahren.",["einen","einem","ein"],0],["Wir fahren durch ___ Stadt.",["die","der","den"],0]]},
{"u":13,"ar":"تركيب اسم + فعل: das Bergwandern","de":"Verb-Nomen-Komposita: das Bergwandern","x":"نجمع اسماً + فعلاً في كلمة واحدة تُكتب بحرف كبير، والأداة <b>das</b> لأنّ الكلمة الأخيرة فعل: Berg + wandern = das Bergwandern.","tbl":[["in den Bergen wandern","<b>das</b> Bergwandern"],["auf dem Land leben","<b>das</b> Landleben"],["Brot backen","<b>das</b> Brotbacken"],["Rad fahren","<b>das</b> Radfahren"]],"ex":[["Ich wandere gern in den Bergen. <mark>Das Bergwandern</mark> ist gesund.","أحبّ المشي في الجبال. المشي في الجبال مفيد للصحة."],["<mark>Das Landleben</mark> ist ruhiger als <mark>das Stadtleben</mark>.","الحياة في الريف أهدأ من الحياة في المدينة."],["<mark>Das Brotbacken</mark> macht mir Spaß.","خبز الخبز يمتعني."]],"err":["Die Bergwandern ist gesund.","Das Bergwandern ist gesund."],"tip":"مثل das Grillen (الوحدة 3): الفعل كاسم = das.","qz":[["Ich fahre gern Ski. ___ macht Spaß.",["Das Skifahren","Die Skifahren","Das skifahren"],0],["Welcher Artikel? ___ Kuchenbacken",["der","die","das"],2],["Wie schreibt man es?",["das Musikhören","das musikhören","das Musik hören"],0]]},
{"u":14,"ar":"الأفعال مع Dativ و Akkusativ","de":"Verben mit Dativ und Akkusativ","x":"أفعال مثل <b>schenken، geben، zeigen، bringen، leihen، schicken، erklären، wünschen</b> تأخذ شخصاً في الـ Dativ (لِمَن؟) وشيئاً في الـ Akkusativ (ماذا؟). الترتيب العادي: <b>Dativ قبل Akkusativ</b>.","tbl":[["","Dativ (wem?)","Akkusativ (was?)"],["Kai schenkt","seiner Freundin","ein Handy."],["Ich zeige","dem neuen Kollegen","seinen Arbeitsplatz."],["Carola gibt","mir","ihren Autoschlüssel."],["Kannst du","uns","eine Pizza mitbringen?"]],"ex":[["Markus schenkt <mark>seiner Mutter</mark> oft <mark>Blumen</mark>.","ماركوس يُهدي أمّه زهوراً كثيراً."],["Mein Vater zeigt <mark>ihnen</mark> <mark>sein neues Handy</mark>.","أبي يُريهم هاتفه الجديد."],["Bring <mark>deinem Vater</mark> <mark>die Zeitung</mark> mit!","أحضِر لأبيك الجريدة!"]],"err":["Ich schenke ein Buch meiner Schwester.","Ich schenke meiner Schwester ein Buch."],"tip":"الشخص (Dativ) أوّلاً ثمّ الشيء (Akkusativ): Ich gebe <b>dir</b> <b>das Buch</b>.","qz":[["Wem schenkst du die Blumen? – ___",["Meiner Mutter.","Meine Mutter.","Mein Mutter."],0],["Kannst du ___ die Regel erklären?",["mich","mir","ich"],1],["Wo steht der Dativ normalerweise?",["vor dem Akkusativ","nach dem Akkusativ","am Satzende"],0]]},
{"u":14,"ar":"حالة الإضافة (Genitiv): des و der","de":"Genitiv: des und der","x":"الـ Genitiv يُظهر الملكية أو العلاقة بين اسمين («فكرة الكاتب»). مذكّر ومحايد: <b>des</b> + الاسم ينتهي بـ <b>-s</b> أو ‎-es. مؤنّث وجمع: <b>der</b>. في الكلام اليومي نقول غالباً von + Dativ.","tbl":[["","Nominativ","Genitiv"],["der","der Autor","die Idee <b>des</b> Autor<b>s</b>"],["das","das Handy","der Preis <b>des</b> Handy<b>s</b>"],["die","die Rose","der Name <b>der</b> Rose"],["Plural","die Frauen","35 % <b>der</b> Frauen"]],"ex":[["Das ist die Idee <mark>des Autors</mark>.","هذه فكرة الكاتب."],["Wie hoch ist der Preis <mark>des Handys</mark>?","كم سعر الهاتف؟"],["Ein Drittel <mark>der Deutschen</mark> lebt allein.","ثلث الألمان يعيشون وحدهم."]],"err":["Das ist das Auto der Vater.","Das ist das Auto des Vaters."],"tip":"des + ‎-s للمذكّر والمحايد: des Vater<b>s</b>، des Kind<b>es</b>.","qz":[["Das ist der Name ___ Hundes.",["des","der","dem"],0],["Die Farbe ___ Tasche gefällt mir.",["des","der","die"],1],["Die Hälfte ___ Kinder spielt Fußball.",["der","des","den"],0]]},
{"u":15,"ar":"الجمل الموصولة مع حرف جرّ + Dativ","de":"Relativsätze mit Präposition + Dativ","x":"إذا كان في الجملة الموصولة حرف جرّ مثل in أو mit، يأتي حرف الجرّ <b>قبل</b> الضمير الموصول. بعد in/mit (Dativ): مذكّر ومحايد <b>dem</b>، مؤنّث <b>der</b>، جمع <b>denen</b> (وليس den!).","tbl":[["","in / mit + Dativ"],["der Hofladen","ein Laden, <b>in dem</b> man Gemüse kaufen kann"],["das Dorf","ein Dorf, <b>in dem</b> es keine Schule gibt"],["die Schwester","Hanna, <b>mit der</b> sie oft telefoniert"],["Plural","Häuser, <b>in denen</b> man Brot backen kann"]],"ex":[["Wir fahren in ein Dorf, <mark>in dem</mark> 582 Leute <mark>leben</mark>.","نذهب إلى قرية يعيش فيها 582 شخصاً."],["Das ist der Traktor, <mark>mit dem</mark> er auf dem Feld <mark>arbeitet</mark>.","هذا هو الجرّار الذي يعمل به في الحقل."],["Lisa und Tom haben zwei Autos, <mark>mit denen</mark> sie in die Stadt fahren.","ليزا وتوم لديهما سيارتان يذهبان بهما إلى المدينة."]],"err":["Das ist die Freundin, mit die ich oft telefoniere.","Das ist die Freundin, mit der ich oft telefoniere."],"tip":"الضمير الموصول في Dativ الجمع = <b>denen</b>.","qz":[["Das ist das Haus, in ___ ich geboren bin.",["dem","der","den"],0],["Die Kollegin, mit ___ ich arbeite, ist sehr nett.",["der","dem","die"],0],["Das sind die Freunde, mit ___ ich Urlaub mache.",["denen","den","dem"],0]]},
{"u":15,"ar":"المبني للمجهول في الماضي","de":"Passiv im Präteritum","x":"لنقول إنّ شيئاً <b>تمّ</b> في الماضي نستعمل <b>wurde / wurden</b> + Partizip II في آخر الجملة. وwurde هي أيضاً ماضي werden: Sie wurde 80 = بلغت الثمانين.","tbl":[["","werden (Präteritum)"],["ich","wurde"],["du","wurdest"],["er/es/sie","wurde"],["wir","wurden"],["ihr","wurdet"],["sie/Sie","wurden"]],"ex":[["Das Handy <mark>wurde eingeschaltet</mark>.","تمّ تشغيل الهاتف."],["Der Akku <mark>wurde aufgeladen</mark>.","تمّ شحن البطارية."],["Die Häuser <mark>wurden</mark> 1850 <mark>gebaut</mark>.","بُنيت المنازل عام 1850."]],"err":["Das Haus wird 1900 gebaut.","Das Haus wurde 1900 gebaut."],"tip":"Präsens: wird gebaut. Präteritum: <b>wurde</b> gebaut.","qz":[["Die Schule ___ 1960 gebaut.",["wurde","wurden","wird"],0],["Die Fenster ___ gestern repariert.",["wurde","wurden","wurdet"],1],["Meine Oma ___ letzte Woche 80.",["wurde","wird","wurden"],0]]},
{"u":16,"ar":"ربط الجمل بـ denn","de":"Sätze verbinden mit denn","x":"<b>denn</b> تعني «لأنّ / إذ» مثل weil، لكنّها لا تغيّر ترتيب الجملة: بعد denn يأتي الفاعل ثمّ الفعل في <b>الموقع الثاني</b> كجملة عادية. قبل denn فاصلة.","rule":"Hauptsatz<b>,</b> <b>denn</b> + Subjekt + <b>Verb (Position 2)</b> …","ex":[["Erin mag ihren Job, <mark>denn</mark> das Gehalt <mark>ist</mark> gut.","إيرين تحبّ عملها، لأنّ الراتب جيّد."],["Matteo mag seinen Job nicht, <mark>denn</mark> er <mark>langweilt</mark> sich oft.","ماتيو لا يحبّ عمله، لأنّه يشعر بالملل كثيراً."],["Ich bleibe zu Hause, <mark>denn</mark> ich <mark>bin</mark> krank.","أبقى في البيت، لأنّني مريض."]],"err":["Ich bleibe zu Hause, denn ich krank bin.","Ich bleibe zu Hause, denn ich bin krank."],"tip":"weil ← الفعل في الآخر. denn ← الترتيب العادي: denn ich <b>bin</b> krank.","qz":[["Ich lerne Deutsch, denn ich ___ in Graz studieren.",["möchte","studieren möchte","möchte ich"],0],["Er kommt nicht, denn ___.",["er hat keine Zeit","er keine Zeit hat","hat er keine Zeit"],0],["Welcher Satz ist richtig?",["…, denn das Wetter ist schön.","…, denn ist das Wetter schön.","…, denn das Wetter schön ist."],0]]},
{"u":16,"ar":"nicht nur …, sondern auch …","de":"nicht nur …, sondern auch …","x":"نستعمل <b>nicht nur …, sondern auch …</b> = «ليس فقط …، بل أيضاً …» لنؤكّد معلومة ثانية. قبل sondern auch نضع فاصلة دائماً.","rule":"<b>nicht nur</b> A<b>,</b> <b>sondern auch</b> B","ex":[["Ich habe <mark>nicht nur</mark> ein Motorrad, <mark>sondern auch</mark> ein Auto.","لديّ ليس فقط دراجة نارية، بل أيضاً سيارة."],["Sie kauft <mark>nicht nur</mark> Lebensmittel, <mark>sondern auch</mark> Getränke ein.","هي لا تشتري المواد الغذائية فقط، بل المشروبات أيضاً."],["Sie hat <mark>nicht nur</mark> Germanistik studiert, <mark>sondern auch</mark> Mathematik.","لم تدرس الأدب الألماني فقط، بل الرياضيات أيضاً."]],"err":["Er spricht nicht nur Deutsch, aber auch Arabisch.","Er spricht nicht nur Deutsch, sondern auch Arabisch."],"tip":"لا تقل aber auch، بل <b>sondern auch</b>.","qz":[["Sie spielt nicht nur Gitarre, ___ auch Klavier.",["aber","sondern","oder"],1],["Wo steht das Komma?",["nicht nur Tee, sondern auch Kaffee","nicht nur, Tee sondern auch Kaffee","nicht nur Tee sondern, auch Kaffee"],0],["Glück ist nicht nur Geld, ___.",["sondern auch Gesundheit","aber Gesundheit","sondern Gesundheit auch"],0]]}
];
const UNIT_TR2={"en":{"1":"Class reunion","2":"Life on the move","3":"Living together","4":"Have you got signal?","5":"How we work today","6":"What are you reading?","7":"Living with animals","8":"Global and regional","9":"Everyday life","10":"Festival summer","11":"Nature and the environment","12":"Repairing and DIY","13":"Summit climbers","14":"Friends for life","15":"Country life","16":"Happiness and life dreams"},"fr":{"1":"Retrouvailles de classe","2":"Vivre mobile","3":"Habiter et vivre ensemble","4":"Tu as du réseau ?","5":"Comment on travaille aujourd'hui","6":"Qu'est-ce que tu lis en ce moment ?","7":"Vivre avec des animaux","8":"Global et régional","9":"La vie quotidienne","10":"L'été des festivals","11":"Nature et environnement","12":"Réparer et faire soi-même","13":"À l'assaut des sommets","14":"Amis pour la vie","15":"La vie à la campagne","16":"Bonheur et rêves de vie"}};
const TRK2={"en":{"Nebensätze mit dass":{"t":"Clauses with dass","x":"<b>dass</b> means “that”. Use it after verbs like hören, glauben, hoffen and wissen to pass on news or give an opinion. In the dass clause the conjugated verb goes to the <b>end</b>, and there is always a comma before dass.","ex":["I've heard that you're working in Hamburg now.","I hope that you're coming to the class reunion.","I'm glad that you came."],"tip":"In the Perfekt the auxiliary goes last: …, dass er geheiratet <b>hat</b>."},"Reflexivpronomen im Akkusativ":{"t":"Reflexive pronouns (accusative)","x":"Some verbs need a pronoun that refers back to the subject: sich freuen, sich treffen, sich anmelden. The forms are the normal accusative pronouns, except for er/es/sie and sie/Sie, which take <b>sich</b>.","ex":["Patrick is looking forward to the class reunion.","Shall we meet in Gotha?","Mascha gets dressed. – Her mother dresses her."],"tip":"Er zieht <b>sich</b> an = he dresses himself. Er zieht <b>ihn</b> an = he dresses someone else."},"Genitiv-s bei Namen":{"t":"Genitive -s with names","x":"To say “Patrick's friend”, add <b>s</b> to the name and put it before the noun: Patricks Freund. No article and no apostrophe. It means the same as der Freund von Patrick.","ex":["Katta and Basti are Patrick's friends.","Is that Lotte's scooter?","I don't have Manu's mobile number."],"tip":"If the name ends in s, x or z, just add an apostrophe: Max<b>’</b> Bruder."},"Partikeln noch und schon":{"t":"The particles noch and schon","x":"<b>schon</b> means “already / ever” and is linked to time. <b>noch</b> means “still” or “another / again”. The negative answer to schon is <b>noch nicht</b>, and the opposite of noch is <b>nicht mehr</b>.","ex":["Have you ever been to Germany? – No, not yet.","I have another question.","Where's Benni? – He's still at the office."],"tip":"Always learn these words in sentences, not on their own.","col":["have you ever …?","not yet","often (already)","once more","another …","no longer"]},"Nebensätze mit weil":{"t":"Clauses with weil","x":"<b>weil</b> means “because” and answers the question <b>warum?</b>. The conjugated verb goes to the end, and there is a comma before weil.","ex":["Sascha prefers to go by car because the bus journey takes longer.","Noah goes by bus because it's cheaper.","Why are you learning German? – Because I'd like to work in Austria."],"tip":"With a modal verb, the modal goes last: …, weil ich arbeiten <b>möchte</b>."},"Superlativ mit am":{"t":"The superlative with am","x":"To say “(the) fastest / best” after a verb, use <b>am + adjective + sten</b>: am schnellsten. Many short adjectives take an umlaut (groß → am größten), and after d / t / s / ß / z add an e: am ältesten. Some forms are irregular and must be learned.","ex":["Carina likes cycling best.","Going by bike is the most practical.","The train is fast, but the plane is the fastest."],"tip":"Learn the irregular ones: gern – lieber – am liebsten · gut – besser – am besten · viel – mehr – am meisten."},"Komposita: Nomen + Adjektiv":{"t":"Compounds: noun + adjective","x":"In German you can join a noun and an adjective into one word. The last word decides the type, so the new word is an <b>adjective</b> and is written in lower case: fahrradfreundlich = bike-friendly.","ex":["Münster is a bike-friendly city.","The bicycle is environmentally friendly.","The old town is pedestrian-friendly."],"tip":"If the last part is an adjective, the whole compound is an adjective → lower case."},"Adjektive ohne Artikel (Nom./Akk.)":{"t":"Adjectives without an article (nom./acc.)","x":"When there is no article before the noun (common in adverts), the adjective takes the article's ending: der → <b>-er</b>, das → <b>-es</b>, die → <b>-e</b>. In the masculine accusative: den → <b>-en</b>.","ex":["Nice flat seeks new tenants.","For sale: nice car.","We're looking for a quiet neighbour."],"tip":"Compare with the article: d<b>er</b> → groß<b>er</b>, d<b>as</b> → groß<b>es</b>, d<b>en</b> → groß<b>en</b>."},"Nomen aus Verben: das Grillen":{"t":"Nouns from verbs: das Grillen","x":"You can make a noun from any verb by taking the infinitive and writing it with a capital letter. The article is always <b>das</b>. This is common in rules and signs (house rules).","ex":["Barbecuing on the balcony is not allowed.","Playing in the stairwell is not allowed.","Leaving bicycles in the cellar is allowed."],"tip":"Infinitive as a noun = <b>das</b> + capital letter: das Lesen, das Kochen."},"Reflexive Verben mit Präposition":{"t":"Reflexive verbs with a preposition","x":"Many reflexive verbs go with a fixed preposition. Learn the verb + pronoun + preposition together. With these verbs, the noun after the preposition is in the <b>accusative</b>.","ex":["We're looking forward to the weekend.","I get annoyed with my neighbours.","She is interested in literature."],"tip":"freuen <b>auf</b> = something in the future, freuen <b>über</b> = something that has happened or is here now.","col":["to look forward to","to be happy about","to be annoyed about","to be interested in","to remember","to find out about"]},"Modalverb dürfen":{"t":"The modal verb dürfen","x":"<b>dürfen</b> = “may / be allowed to”. <b>nicht dürfen</b> = “must not”. As with other modals, ich and er have no ending, and the second verb goes to the end in the infinitive.","ex":["You can't park here. It's not allowed!","Where can you smoke here?","Sorry, I'm not allowed to eat that."],"tip":"nicht dürfen = forbidden, but nicht müssen = not necessary."},"Wozu? – Zum …":{"t":"Wozu? – Zum …","x":"Ask about purpose with <b>Wozu?</b> (what for?) and answer with <b>zum</b> + a verb used as a noun (capital letter): zum Telefonieren = for phoning. zum = zu + dem, because a noun from a verb takes das.","ex":["What do you have a mobile for? – For phoning.","I use the tablet for reading.","I mostly need my phone for writing messages."],"tip":"zum + verb as a noun: zum Kochen, zum Spielen, zum Fotografieren."},"Indirekte Fragen mit ob":{"t":"Indirect questions with ob","x":"To turn a yes/no question into an indirect question, use <b>ob</b> (= whether / if). The verb then goes to the end. It sounds more polite: Können Sie mir sagen, ob …?","ex":["Do you know if we're having a test on Monday?","Can you tell me whether the course is on on Friday?","I wonder whether you really have time for a pet."],"tip":"ob = whether (yes/no question), dass = that (a statement)."},"Personalpronomen im Dativ":{"t":"Personal pronouns in the dative","x":"Some verbs always take the dative: helfen, gefallen, gehören, danken, passen, schmecken. So do phrases like Wie geht es dir? Learn the forms: mir, dir, ihm, ihr, uns, euch, ihnen/Ihnen.","ex":["How are you? (formal)","I really like that!","Can you help me?"],"tip":"helfen takes the dative: Ich helfe <b>dir</b> (not dich)."},"Präpositionen mit Dativ":{"t":"Prepositions with the dative","x":"After <b>aus, bei, mit, nach, von, seit, zu</b> the noun is always in the dative: der/das → <b>dem</b>, die → <b>der</b>, plural → <b>den</b> + n. Some merge with the article: zum, zur, beim, vom.","ex":["We drive to my family in Bavaria.","We've been doing that for many years.","Then we stay with the family."],"tip":"Rhyme to remember: Von <b>aus, bei, mit</b> nach <b>von, seit, zu</b> kommst immer mit dem Dativ du."},"Adjektive nach dem bestimmten Artikel":{"t":"Adjectives after the definite article","x":"After der / das / die the adjective takes <b>-e</b> in the singular (nominative, and accusative das/die). In the masculine accusative (den) and in the plural it takes <b>-en</b>.","ex":["I like the daily contact with customers.","I think the big office is great.","The new colleagues are nice."],"tip":"Easy rule: after der/das/die in the singular → -e; after den and in the plural → -en."},"Adjektive nach ein, kein und mein":{"t":"Adjectives after ein, kein and mein","x":"After ein / kein / mein … the adjective shows the gender, because the article has no ending: ein neu<b>er</b> Computer, ein neu<b>es</b> Büro. Masculine accusative: einen neu<b>en</b>. Plural: keine/meine … <b>-en</b>.","ex":["I like my great boss.","I don't have fixed working hours.","We've got a new office."],"tip":"All possessives (mein, dein, unser …) and kein work like ein."},"Nomen mit -ung":{"t":"Nouns ending in -ung","x":"From many verbs you can make a noun by adding <b>-ung</b> to the stem. These nouns always take <b>die</b>, and the plural is <b>-ungen</b>.","ex":["She is training to be a cook.","The planning takes a long time.","We're looking for a new flat."],"tip":"-ung = always die. Inside an -ung noun you can usually find a verb."},"Präteritum: regelmäßige Verben":{"t":"Simple past: regular verbs","x":"The Präteritum is a past tense used mainly in <b>written texts</b> (stories, biographies, news). In speech we usually use the Perfekt. Regular verbs: stem + <b>te</b> + ending. ich and er/es/sie have the same form with no extra ending.","ex":["In 1806 Goethe married Christiane Vulpius.","He lived in Weimar for a long time.","They studied in Leipzig."],"tip":"If the stem ends in t or d, add e: arbeit<b>e</b>te, red<b>e</b>te. The du/ihr forms are rare in the Präteritum."},"Nebensätze mit als":{"t":"Clauses with als","x":"<b>als</b> = “when” for <b>one</b> event or period in the past. The verb goes to the end of the als clause. If the sentence starts with it, the main-clause verb comes straight after the comma (position 2).","ex":["Goethe was only 16 when he studied law in Leipzig.","When Goethe was in Italy, he painted many pictures.","When I was little, we lived in Tunis."],"tip":"als = once in the past. wenn = present/future or “whenever”."},"Superlativ vor Nomen: der größte":{"t":"Superlative before a noun: der größte","x":"Before a noun, use the article + adjective + <b>(e)st</b> + the adjective ending: der größ<b>te</b> Hund, die schnell<b>sten</b> Tiere. The same irregular forms apply: der beste, die meisten, der höchste.","ex":["The Volga is the longest river in Europe.","The Danube flows through the most countries.","These are the fastest animals."],"tip":"After a verb: am größten. Before a noun: der größte Hund."},"Adjektive im Dativ":{"t":"Adjectives in the dative","x":"Good news: after an article in the dative (dem, der, einem, einer, meinem, den …) the adjective <b>always ends in -en</b>, whatever the gender or number.","ex":["That's a dog with a white tail.","The cow with the brown coat is called Lisa.","These are pigs with black ears."],"tip":"After mit, bei, von, zu … + article → the adjective ends in -en."},"Indirekte W-Fragen":{"t":"Indirect W-questions","x":"When you start with Weißt du, … or Können Sie mir sagen, …, keep the question word (wo, wie, wann, warum …) but move the verb to the <b>end</b>. It sounds more polite.","ex":["Can you tell me what time it is?","Do you know where my key is?","I wonder how much longer this will take."],"tip":"With a question word, don't use ob: Weißt du, <b>wo</b> …? / Weißt du, <b>ob</b> …? (for yes/no)."},"Das Verb werden":{"t":"The verb werden","x":"<b>werden</b> = “to become”. Use it for a future job, for age (Sie wird 30) and for change (Es wird kalt). It is irregular: du <b>wirst</b>, er <b>wird</b>. Later you'll also use it to form the passive.","ex":["My brother wants to become a car mechanic.","Our cat turns ten tomorrow.","It's getting cold."],"tip":"No article with a job: Er wird <b>Lehrer</b>."},"Relativsätze im Nominativ":{"t":"Relative clauses in the nominative","x":"A relative clause describes a noun more precisely. It starts with a relative pronoun (der / das / die) matching the <b>gender and number</b> of the noun, and the verb goes to the end. In the nominative, the relative pronoun is the subject.","ex":["Christstollen is a cake that comes from Dresden.","The Linzer Torte is a cake that comes from Austria.","Printen are small cakes that come from Aachen."],"tip":"The relative pronoun = the article: der Kuchen → <b>der</b>, das Brot → <b>das</b>, die Torte → <b>die</b>."},"Relativsätze im Akkusativ":{"t":"Relative clauses in the accusative","x":"If the noun is the <b>object</b> inside the relative clause, use the accusative pronoun. The only difference from the nominative is in the masculine: der → <b>den</b>. das and die don't change.","ex":["Stollen is a cake that people eat all over Germany.","This is a bread that is made from pears.","The film I saw yesterday was great."],"tip":"Ask: is the noun doing the action (subject) or receiving it (object)? Masculine object → den."},"Modalverben im Präteritum":{"t":"Modal verbs in the simple past","x":"With modal verbs we use the Präteritum even in everyday speech (not the Perfekt). Rule: <b>no umlaut</b> + <b>-te</b>: können → konnte, müssen → musste, dürfen → durfte. ich and er have the same form.","ex":["I couldn't come yesterday, I had to work.","As a child I wanted to be a pilot.","We weren't allowed to watch TV for long in the past."],"tip":"Careful: könnte (with umlaut) means “could / would be able to”, not the past. Past = konnte. And mögen → mochte."},"Possessivartikel im Dativ":{"t":"Possessive articles in the dative","x":"Possessive articles (mein, dein, sein, ihr, unser, euer, Ihr), ein and kein all have the same endings. In the dative: masculine/neuter <b>-em</b>, feminine <b>-er</b>, plural <b>-en</b>, and the plural noun adds an n.","ex":["It's very noisy in our office.","I often phone my mother.","He plays with his children."],"tip":"Dative plural = -en + n on the noun: mit meinen Freunde<b>n</b>."},"Verben mit Präpositionen":{"t":"Verbs with prepositions","x":"Many verbs go with a fixed preposition, and it is often not the one you would expect from English. Always learn: <b>verb + preposition + case</b> (accusative or dative).","ex":["I'm waiting for the bus.","I often think of my family.","We're taking part in the celebration."],"tip":"Write them down as one unit: warten auf + A, Angst haben vor + D …","col":["to wait for","to think of","to talk about","to be afraid of","to take part in","to start with","to tell about"]},"Fragen mit worauf, worüber, woran, womit":{"t":"Questions with worauf, worüber, woran, womit","x":"To ask about a <b>thing</b> with a prepositional verb, use <b>wo + preposition</b>. If the preposition starts with a vowel, add r: wo<b>r</b>auf, wo<b>r</b>über, wo<b>r</b>an. To ask about a <b>person</b>, use preposition + wen/wem: Auf wen wartest du?","ex":["What is Jana looking forward to most? – The summer.","What are you annoyed about? – The expensive tickets.","What are you thinking about right now? – The holiday."],"tip":"Thing → wo(r) + preposition. Person → preposition + wen/wem."},"Präteritum: unregelmäßige Verben":{"t":"Simple past: irregular verbs","x":"Irregular verbs change their vowel for <b>all</b> persons and don't take -te. ich and er/es/sie have <b>no ending</b>: ich schrieb, er schrieb, wir schrieben.","ex":["Goethe wrote many poems.","In the summer we went to the festival.","In the evening 20,000 people came."],"tip":"Learn irregular verbs as a series: lesen – las – gelesen. If the participle ends in -en, the verb is usually irregular: gegeben → gab."},"Sätze mit wenn … (dann)":{"t":"Sentences with wenn … (dann)","x":"<b>wenn</b> = “if / when” for a condition. The verb goes to the end of the wenn clause. If you start with it, the main-clause verb comes right after the comma, and you can add <b>dann</b>.","ex":["I sell clothes online when they don't fit me any more.","If I want to save money, (then) I go to the flea market.","If it rains, I take an umbrella."],"tip":"After the comma: verb, then subject: …, <b>bleibe ich</b> zu Hause."},"warum – weil, wann – wenn":{"t":"warum – weil, wann – wenn","x":"Don't mix them up: <b>wann?</b> is a question about time (when?), while <b>wenn</b> is a conjunction (if/when). <b>warum?</b> asks for a reason, and the answer is <b>weil</b>.","ex":["Why aren't you coming? – Because it's raining.","When are you coming home? – When the rain stops.","I'm glad when the winter is over."],"tip":"wann = only in questions. wenn = in a subordinate clause.","col":["reason","condition / time"]},"Nebensätze mit damit":{"t":"Clauses with damit","x":"<b>damit</b> = “so that” and expresses a purpose. The verb goes to the end. Use damit especially when the two clauses have <b>different</b> subjects.","ex":["We need the garden so that we stay active.","We're in the club so that we get to know other people.","I'll explain it again so that you understand it."],"tip":"Different subject → damit. Same subject → um … zu is also possible (unit 12)."},"Adjektive mit -bar":{"t":"Adjectives ending in -bar","x":"Verb stem + <b>-bar</b> = “can be …-ed”: essbar = edible. These words are adjectives and are written in lower case.","ex":["Are the herbs edible? – Yes, you can eat them.","The rent is affordable.","Careful, the water isn't drinkable."],"tip":"-bar = man kann + verb: waschbar = man kann es waschen.","col":["edible","drinkable","washable","affordable","usable"]},"um … zu + Infinitiv":{"t":"um … zu + infinitive","x":"<b>um … zu</b> = “in order to” when the <b>same subject</b> does both actions. There is no subject after um, and zu + infinitive goes at the end. With separable verbs, zu goes in the middle: an<b>zu</b>rufen.","ex":["What do you need the ladder for? – To paint the ceiling.","I need the drill to hang up the picture.","I don't need a car to get into town."],"tip":"damit and um … zu mean the same. With um … zu there is no second subject."},"Passiv im Präsens":{"t":"The passive (present)","x":"In the passive the <b>action</b> matters, not who does it. Form it with <b>werden</b> (wird / werden) + the <b>Partizip II</b> at the end. It is common in instructions and recipes.","ex":["Kai connects the charging cable. → The charging cable is connected.","First the battery is charged.","Then the keys are pressed."],"tip":"Active: the person matters. Passive: the action matters. “man + verb” ≈ passive."},"Präpositionen mit Akkusativ":{"t":"Prepositions with the accusative","x":"After <b>durch</b> (through), <b>ohne</b> (without), <b>gegen</b> (against / around), <b>für</b> (for) and <b>um</b> (around / at + time) the noun is always in the accusative: der → <b>den</b>.","ex":["We walk through the forest.","You shouldn't hike in the mountains without good shoes.","Afterwards we hike around the lake."],"tip":"Only the masculine changes: für <b>den</b> Bruder, but für die Schwester, für das Kind."},"Verb-Nomen-Komposita: das Bergwandern":{"t":"Verb-noun compounds: das Bergwandern","x":"Join a noun + a verb into one word with a capital letter. The article is <b>das</b>, because the last part is a verb: Berg + wandern = das Bergwandern.","ex":["I like hiking in the mountains. Mountain hiking is healthy.","Country life is quieter than city life.","I enjoy baking bread."],"tip":"Like das Grillen (unit 3): a verb used as a noun = das."},"Verben mit Dativ und Akkusativ":{"t":"Verbs with dative and accusative","x":"Verbs like <b>schenken, geben, zeigen, bringen, leihen, schicken, erklären, wünschen</b> take a person in the dative (to whom?) and a thing in the accusative (what?). Normal order: <b>dative before accusative</b>.","ex":["Markus often gives his mother flowers.","My father shows them his new phone.","Bring the newspaper for your father!"],"tip":"Person (dative) first, then the thing (accusative): Ich gebe <b>dir</b> <b>das Buch</b>."},"Genitiv: des und der":{"t":"The genitive: des and der","x":"The genitive shows possession or a link between two nouns (“the author's idea”). Masculine and neuter: <b>des</b> + the noun ends in <b>-s</b> or -es. Feminine and plural: <b>der</b>. In everyday speech people often say von + dative.","ex":["That is the author's idea.","How much does the phone cost?","A third of Germans live alone."],"tip":"des + -s for masculine and neuter: des Vater<b>s</b>, des Kind<b>es</b>."},"Relativsätze mit Präposition + Dativ":{"t":"Relative clauses with preposition + dative","x":"If the relative clause has a preposition like in or mit, the preposition comes <b>before</b> the relative pronoun. After in/mit (dative): masculine and neuter <b>dem</b>, feminine <b>der</b>, plural <b>denen</b> (not den!).","ex":["We're going to a village where 582 people live.","That's the tractor he works with in the field.","Lisa and Tom have two cars that they drive into town."],"tip":"The dative plural relative pronoun = <b>denen</b>."},"Passiv im Präteritum":{"t":"The passive (simple past)","x":"To say that something <b>was done</b> in the past, use <b>wurde / wurden</b> + Partizip II at the end. wurde is also the past of werden: Sie wurde 80 = she turned 80.","ex":["The phone was switched on.","The battery was charged.","The houses were built in 1850."],"tip":"Present: wird gebaut. Simple past: <b>wurde</b> gebaut."},"Sätze verbinden mit denn":{"t":"Linking sentences with denn","x":"<b>denn</b> means “because / as”, like weil, but it doesn't change the word order: after denn comes the subject, then the verb in <b>position 2</b>, as in a normal sentence. There is a comma before denn.","ex":["Erin likes her job because the pay is good.","Matteo doesn't like his job, as he is often bored.","I'm staying at home because I'm ill."],"tip":"weil → verb at the end. denn → normal word order: denn ich <b>bin</b> krank."},"nicht nur …, sondern auch …":{"t":"nicht nur …, sondern auch …","x":"Use <b>nicht nur …, sondern auch …</b> = “not only …, but also …” to stress a second piece of information. There is always a comma before sondern auch.","ex":["I have not only a motorbike but also a car.","She buys not only food but also drinks.","She studied not only German but also maths."],"tip":"Don't say aber auch – say <b>sondern auch</b>."}},"fr":{"Nebensätze mit dass":{"t":"Les subordonnées avec dass","x":"<b>dass</b> signifie « que ». On l'emploie après des verbes comme hören, glauben, hoffen ou wissen pour transmettre une information ou donner son avis. Dans la subordonnée, le verbe conjugué va <b>à la fin</b>, et il y a toujours une virgule avant dass.","ex":["J'ai entendu dire que tu travailles maintenant à Hambourg.","J'espère que tu viendras aux retrouvailles de la classe.","Je suis content que tu sois venu."],"tip":"Au Perfekt, l'auxiliaire se place en dernier : …, dass er geheiratet <b>hat</b>."},"Reflexivpronomen im Akkusativ":{"t":"Les pronoms réfléchis à l'accusatif","x":"Certains verbes ont besoin d'un pronom qui renvoie au sujet : sich freuen, sich treffen, sich anmelden. Les formes sont celles des pronoms à l'accusatif, sauf pour er/es/sie et sie/Sie, qui prennent <b>sich</b>.","ex":["Patrick se réjouit des retrouvailles de la classe.","On se retrouve à Gotha ?","Mascha s'habille. – Sa mère l'habille."],"tip":"Er zieht <b>sich</b> an = il s'habille. Er zieht <b>ihn</b> an = il habille quelqu'un d'autre."},"Genitiv-s bei Namen":{"t":"Le génitif en -s avec les noms propres","x":"Pour dire « l'ami de Patrick », on ajoute <b>s</b> au prénom et on le place devant le nom : Patricks Freund. Pas d'article ni d'apostrophe. C'est la même chose que der Freund von Patrick.","ex":["Katta et Basti sont les amis de Patrick.","C'est le scooter de Lotte ?","Je n'ai pas le numéro de portable de Manu."],"tip":"Si le prénom se termine par s, x ou z, on met seulement une apostrophe : Max<b>’</b> Bruder."},"Partikeln noch und schon":{"t":"Les particules noch et schon","x":"<b>schon</b> signifie « déjà » et se rapporte au temps. <b>noch</b> signifie « encore / toujours » ou « un(e) autre ». La réponse négative à schon est <b>noch nicht</b>, et le contraire de noch est <b>nicht mehr</b>.","ex":["Tu es déjà allé en Allemagne ? – Non, pas encore.","J'ai encore une question.","Où est Benni ? – Il est encore au bureau."],"tip":"Apprenez toujours ces mots dans des phrases, pas seuls.","col":["tu as déjà … ?","pas encore","déjà souvent","encore une fois","encore un(e) …","ne … plus"]},"Nebensätze mit weil":{"t":"Les subordonnées avec weil","x":"<b>weil</b> signifie « parce que » et répond à la question <b>warum?</b>. Le verbe conjugué va à la fin, et il y a une virgule avant weil.","ex":["Sascha préfère prendre la voiture parce que le trajet en bus dure plus longtemps.","Noah prend le bus parce que c'est moins cher.","Pourquoi apprends-tu l'allemand ? – Parce que je voudrais travailler en Autriche."],"tip":"Avec un verbe de modalité, c'est lui qui va en dernier : …, weil ich arbeiten <b>möchte</b>."},"Superlativ mit am":{"t":"Le superlatif avec am","x":"Pour dire « le plus vite / le mieux » après un verbe, on utilise <b>am + adjectif + sten</b> : am schnellsten. Beaucoup d'adjectifs courts prennent un Umlaut (groß → am größten), et après d / t / s / ß / z on ajoute un e : am ältesten. Certaines formes sont irrégulières.","ex":["Carina préfère par-dessus tout prendre le vélo.","À vélo, c'est le plus pratique.","Le train est rapide, mais l'avion est le plus rapide."],"tip":"Retenez les irréguliers : gern – lieber – am liebsten · gut – besser – am besten · viel – mehr – am meisten."},"Komposita: Nomen + Adjektiv":{"t":"Les mots composés : nom + adjectif","x":"En allemand, on peut réunir un nom et un adjectif en un seul mot. C'est le dernier élément qui compte : le nouveau mot est un <b>adjectif</b> et s'écrit en minuscule : fahrradfreundlich = adapté aux vélos.","ex":["Münster est une ville adaptée aux vélos.","Le vélo est écologique.","La vieille ville est agréable pour les piétons."],"tip":"Si le dernier élément est un adjectif, tout le mot composé est un adjectif → minuscule."},"Adjektive ohne Artikel (Nom./Akk.)":{"t":"Les adjectifs sans article (nom./acc.)","x":"Quand il n'y a pas d'article devant le nom (fréquent dans les annonces), l'adjectif prend la terminaison de l'article : der → <b>-er</b>, das → <b>-es</b>, die → <b>-e</b>. Au masculin accusatif : den → <b>-en</b>.","ex":["Bel appartement cherche nouveaux locataires.","Vends belle voiture.","Nous cherchons un voisin calme."],"tip":"Comparez avec l'article : d<b>er</b> → groß<b>er</b>, d<b>as</b> → groß<b>es</b>, d<b>en</b> → groß<b>en</b>."},"Nomen aus Verben: das Grillen":{"t":"Des noms à partir de verbes : das Grillen","x":"On peut faire un nom avec n'importe quel verbe : on prend l'infinitif et on l'écrit avec une majuscule. L'article est toujours <b>das</b>. C'est fréquent dans les règlements et les panneaux.","ex":["Il est interdit de faire des grillades sur le balcon.","Il est interdit de jouer dans la cage d'escalier.","Il est permis de laisser les vélos à la cave."],"tip":"Infinitif employé comme nom = <b>das</b> + majuscule : das Lesen, das Kochen."},"Reflexive Verben mit Präposition":{"t":"Les verbes pronominaux avec préposition","x":"Beaucoup de verbes pronominaux s'emploient avec une préposition fixe. Apprenez ensemble le verbe, le pronom et la préposition. Avec ces verbes, le nom après la préposition est à l'<b>accusatif</b>.","ex":["Nous attendons le week-end avec impatience.","Je m'énerve contre mes voisins.","Elle s'intéresse à la littérature."],"tip":"freuen <b>auf</b> = quelque chose à venir, freuen <b>über</b> = quelque chose qui est arrivé ou qui est là.","col":["se réjouir de (à venir)","se réjouir de (déjà là)","s'énerver contre","s'intéresser à","se souvenir de","s'informer sur"]},"Modalverb dürfen":{"t":"Le verbe de modalité dürfen","x":"<b>dürfen</b> = « avoir le droit de ». <b>nicht dürfen</b> = « ne pas avoir le droit ». Comme les autres verbes de modalité : pas de terminaison avec ich et er, et le deuxième verbe va à la fin à l'infinitif.","ex":["Vous ne pouvez pas vous garer ici. C'est interdit !","Où est-ce qu'on peut fumer ici ?","Désolé, je n'ai pas le droit de manger ça."],"tip":"nicht dürfen = interdit, mais nicht müssen = pas nécessaire."},"Wozu? – Zum …":{"t":"Wozu ? – Zum …","x":"On demande le but avec <b>Wozu?</b> (à quoi bon / pour quoi faire ?) et on répond avec <b>zum</b> + un verbe employé comme nom (majuscule) : zum Telefonieren = pour téléphoner. zum = zu + dem, car un nom formé d'un verbe prend das.","ex":["Tu as un portable pour quoi faire ? – Pour téléphoner.","J'utilise la tablette pour lire.","J'utilise surtout mon portable pour écrire des messages."],"tip":"zum + verbe employé comme nom : zum Kochen, zum Spielen, zum Fotografieren."},"Indirekte Fragen mit ob":{"t":"L'interrogation indirecte avec ob","x":"Pour transformer une question fermée (oui/non) en question indirecte, on utilise <b>ob</b> (= si). Le verbe va alors à la fin. C'est plus poli : Können Sie mir sagen, ob …?","ex":["Tu sais si on a un test lundi ?","Pouvez-vous me dire si le cours a lieu vendredi ?","Je me demande si tu as vraiment le temps pour un animal."],"tip":"ob = si (question oui/non), dass = que (affirmation)."},"Personalpronomen im Dativ":{"t":"Les pronoms personnels au datif","x":"Certains verbes prennent toujours le datif : helfen, gefallen, gehören, danken, passen, schmecken. De même pour des expressions comme Wie geht es dir? Retenez les formes : mir, dir, ihm, ihr, uns, euch, ihnen/Ihnen.","ex":["Comment allez-vous ?","Ça me plaît vraiment beaucoup !","Tu peux m'aider ?"],"tip":"helfen prend le datif : Ich helfe <b>dir</b> (pas dich)."},"Präpositionen mit Dativ":{"t":"Les prépositions suivies du datif","x":"Après <b>aus, bei, mit, nach, von, seit, zu</b>, le nom est toujours au datif : der/das → <b>dem</b>, die → <b>der</b>, pluriel → <b>den</b> + n. Certaines se contractent avec l'article : zum, zur, beim, vom.","ex":["Nous allons en voiture chez ma famille en Bavière.","Nous faisons cela depuis de nombreuses années.","Ensuite, nous restons chez la famille."],"tip":"Petite phrase à retenir : Von <b>aus, bei, mit</b> nach <b>von, seit, zu</b> kommst immer mit dem Dativ du."},"Adjektive nach dem bestimmten Artikel":{"t":"Les adjectifs après l'article défini","x":"Après der / das / die, l'adjectif prend <b>-e</b> au singulier (nominatif, et accusatif das/die). À l'accusatif masculin (den) et au pluriel, il prend <b>-en</b>.","ex":["J'aime le contact quotidien avec les clients.","Je trouve le grand bureau génial.","Les nouveaux collègues sont sympas."],"tip":"Règle simple : après der/das/die au singulier → -e ; après den et au pluriel → -en."},"Adjektive nach ein, kein und mein":{"t":"Les adjectifs après ein, kein et mein","x":"Après ein / kein / mein …, c'est l'adjectif qui montre le genre, car l'article n'a pas de terminaison : ein neu<b>er</b> Computer, ein neu<b>es</b> Büro. Accusatif masculin : einen neu<b>en</b>. Pluriel : keine/meine … <b>-en</b>.","ex":["J'aime ma super cheffe.","Je n'ai pas d'horaires fixes.","Nous avons un nouveau bureau."],"tip":"Tous les possessifs (mein, dein, unser …) et kein fonctionnent comme ein."},"Nomen mit -ung":{"t":"Les noms en -ung","x":"À partir de nombreux verbes, on forme un nom en ajoutant <b>-ung</b> au radical. Ces noms prennent toujours <b>die</b>, et le pluriel est en <b>-ungen</b>.","ex":["Elle fait une formation de cuisinière.","La planification prend beaucoup de temps.","Nous cherchons un nouvel appartement."],"tip":"-ung = toujours die. Dans un nom en -ung, on trouve en général un verbe."},"Präteritum: regelmäßige Verben":{"t":"Le prétérit : verbes réguliers","x":"Le Präteritum est un temps du passé utilisé surtout à l'<b>écrit</b> (récits, biographies, actualités). À l'oral, on utilise en général le Perfekt. Verbes réguliers : radical + <b>te</b> + terminaison. ich et er/es/sie ont la même forme, sans terminaison en plus.","ex":["En 1806, Goethe épousa Christiane Vulpius.","Il vécut longtemps à Weimar.","Ils étudièrent à Leipzig."],"tip":"Si le radical se termine par t ou d, on ajoute e : arbeit<b>e</b>te, red<b>e</b>te. Les formes du/ihr sont rares au Präteritum."},"Nebensätze mit als":{"t":"Les subordonnées avec als","x":"<b>als</b> = « quand / lorsque » pour un événement <b>unique</b> ou une période du passé. Le verbe va à la fin de la subordonnée. Si la phrase commence par elle, le verbe de la principale vient juste après la virgule (position 2).","ex":["Goethe n'avait que 16 ans quand il étudia le droit à Leipzig.","Quand Goethe était en Italie, il peignit de nombreux tableaux.","Quand j'étais petit, nous habitions à Tunis."],"tip":"als = une seule fois dans le passé. wenn = présent/futur ou « chaque fois que »."},"Superlativ vor Nomen: der größte":{"t":"Le superlatif devant un nom : der größte","x":"Devant un nom, on utilise l'article + adjectif + <b>(e)st</b> + la terminaison de l'adjectif : der größ<b>te</b> Hund, die schnell<b>sten</b> Tiere. Mêmes formes irrégulières : der beste, die meisten, der höchste.","ex":["La Volga est le plus long fleuve d'Europe.","Le Danube traverse le plus grand nombre de pays.","Ce sont les animaux les plus rapides."],"tip":"Après un verbe : am größten. Devant un nom : der größte Hund."},"Adjektive im Dativ":{"t":"Les adjectifs au datif","x":"Bonne nouvelle : après un article au datif (dem, der, einem, einer, meinem, den …), l'adjectif se termine <b>toujours par -en</b>, quel que soit le genre ou le nombre.","ex":["C'est un chien à la queue blanche.","La vache au pelage brun s'appelle Lisa.","Ce sont des cochons aux oreilles noires."],"tip":"Après mit, bei, von, zu … + article → l'adjectif se termine par -en."},"Indirekte W-Fragen":{"t":"L'interrogation indirecte partielle","x":"Quand on commence par Weißt du, … ou Können Sie mir sagen, …, on garde le mot interrogatif (wo, wie, wann, warum …) mais le verbe va <b>à la fin</b>. C'est plus poli.","ex":["Pouvez-vous me dire quelle heure il est ?","Tu sais où est ma clé ?","Je me demande combien de temps ça va encore durer."],"tip":"Avec un mot interrogatif, pas de ob : Weißt du, <b>wo</b> …? / Weißt du, <b>ob</b> …? (question oui/non)."},"Das Verb werden":{"t":"Le verbe werden","x":"<b>werden</b> = « devenir ». On l'utilise pour un futur métier, pour l'âge (Sie wird 30) et pour un changement (Es wird kalt). Il est irrégulier : du <b>wirst</b>, er <b>wird</b>. Plus tard, il servira aussi à former le passif.","ex":["Mon frère veut devenir mécanicien automobile.","Notre chat aura dix ans demain.","Il commence à faire froid."],"tip":"Pas d'article avec un métier : Er wird <b>Lehrer</b>."},"Relativsätze im Nominativ":{"t":"Les relatives au nominatif","x":"La relative décrit un nom plus précisément. Elle commence par un pronom relatif (der / das / die) qui s'accorde en <b>genre et en nombre</b> avec le nom, et le verbe va à la fin. Au nominatif, le pronom relatif est le sujet.","ex":["Le Christstollen est un gâteau qui vient de Dresde.","La Linzer Torte est une tarte qui vient d'Autriche.","Les Printen sont de petits gâteaux qui viennent d'Aix-la-Chapelle."],"tip":"Le pronom relatif = l'article : der Kuchen → <b>der</b>, das Brot → <b>das</b>, die Torte → <b>die</b>."},"Relativsätze im Akkusativ":{"t":"Les relatives à l'accusatif","x":"Si le nom est le <b>complément d'objet</b> dans la relative, on utilise le pronom à l'accusatif. La seule différence avec le nominatif est au masculin : der → <b>den</b>. das et die ne changent pas.","ex":["Le Stollen est un gâteau qu'on mange dans toute l'Allemagne.","C'est un pain qu'on fait avec des poires.","Le film que j'ai vu hier était génial."],"tip":"Demandez-vous : le nom fait-il l'action (sujet) ou la subit-il (objet) ? Masculin objet → den."},"Modalverben im Präteritum":{"t":"Les verbes de modalité au prétérit","x":"Avec les verbes de modalité, on utilise le Präteritum même à l'oral (pas le Perfekt). Règle : <b>pas d'Umlaut</b> + <b>-te</b> : können → konnte, müssen → musste, dürfen → durfte. ich et er ont la même forme.","ex":["Hier, je n'ai pas pu venir, je devais travailler.","Enfant, je voulais devenir pilote.","Avant, nous n'avions pas le droit de regarder la télé longtemps."],"tip":"Attention : könnte (avec Umlaut) signifie « pourrait », ce n'est pas le passé. Passé = konnte. Et mögen → mochte."},"Possessivartikel im Dativ":{"t":"Les déterminants possessifs au datif","x":"Les possessifs (mein, dein, sein, ihr, unser, euer, Ihr), ein et kein ont les mêmes terminaisons. Au datif : masculin/neutre <b>-em</b>, féminin <b>-er</b>, pluriel <b>-en</b>, et le nom au pluriel prend un n.","ex":["Dans notre bureau, c'est très bruyant.","Je téléphone souvent à ma mère.","Il joue avec ses enfants."],"tip":"Datif pluriel = -en + n au nom : mit meinen Freunde<b>n</b>."},"Verben mit Präpositionen":{"t":"Les verbes à préposition","x":"Beaucoup de verbes s'emploient avec une préposition fixe, souvent différente de celle du français. Apprenez toujours : <b>verbe + préposition + cas</b> (accusatif ou datif).","ex":["J'attends le bus.","Je pense souvent à ma famille.","Nous participons à la fête."],"tip":"Notez-les comme un bloc : warten auf + A, Angst haben vor + D …","col":["attendre","penser à","parler de","avoir peur de","participer à","commencer par","raconter, parler de"]},"Fragen mit worauf, worüber, woran, womit":{"t":"Les questions avec worauf, worüber, woran, womit","x":"Pour poser une question sur une <b>chose</b> avec un verbe à préposition, on utilise <b>wo + préposition</b>. Si la préposition commence par une voyelle, on ajoute r : wo<b>r</b>auf, wo<b>r</b>über, wo<b>r</b>an. Pour une <b>personne</b> : préposition + wen/wem : Auf wen wartest du?","ex":["Qu'est-ce que Jana attend le plus ? – L'été.","Qu'est-ce qui t'énerve ? – Les billets chers.","À quoi penses-tu en ce moment ? – Aux vacances."],"tip":"Chose → wo(r) + préposition. Personne → préposition + wen/wem."},"Präteritum: unregelmäßige Verben":{"t":"Le prétérit : verbes irréguliers","x":"Les verbes irréguliers changent de voyelle à <b>toutes</b> les personnes et ne prennent pas -te. ich et er/es/sie n'ont <b>pas de terminaison</b> : ich schrieb, er schrieb, wir schrieben.","ex":["Goethe écrivit de nombreux poèmes.","En été, nous sommes allés au festival.","Le soir, 20 000 personnes vinrent."],"tip":"Apprenez les verbes irréguliers en série : lesen – las – gelesen. Si le participe se termine en -en, le verbe est en général irrégulier : gegeben → gab."},"Sätze mit wenn … (dann)":{"t":"Les phrases avec wenn … (dann)","x":"<b>wenn</b> = « si / quand » pour une condition. Le verbe va à la fin de la subordonnée. Si on commence par elle, le verbe de la principale suit directement la virgule, et on peut ajouter <b>dann</b>.","ex":["Je vends des vêtements sur Internet quand ils ne me vont plus.","Si je veux économiser, (alors) je vais au marché aux puces.","S'il pleut, je prends un parapluie."],"tip":"Après la virgule : verbe puis sujet : …, <b>bleibe ich</b> zu Hause."},"warum – weil, wann – wenn":{"t":"warum – weil, wann – wenn","x":"Ne les confondez pas : <b>wann?</b> est une question sur le moment (quand ?), alors que <b>wenn</b> est une conjonction (si/quand). <b>warum?</b> demande la raison, et on répond avec <b>weil</b>.","ex":["Pourquoi tu ne viens pas ? – Parce qu'il pleut.","Quand rentres-tu ? – Quand la pluie s'arrêtera.","Je suis content quand l'hiver est fini."],"tip":"wann = seulement dans les questions. wenn = dans une subordonnée.","col":["raison","condition / moment"]},"Nebensätze mit damit":{"t":"Les subordonnées avec damit","x":"<b>damit</b> = « pour que / afin que » et exprime un but. Le verbe va à la fin. On l'utilise surtout quand les deux propositions ont des sujets <b>différents</b>.","ex":["Nous avons besoin du jardin pour rester actifs.","Nous sommes dans l'association pour rencontrer d'autres personnes.","Je te le réexplique pour que tu le comprennes."],"tip":"Sujet différent → damit. Même sujet → um … zu est aussi possible (unité 12)."},"Adjektive mit -bar":{"t":"Les adjectifs en -bar","x":"Radical du verbe + <b>-bar</b> = « qui peut être … » : essbar = comestible. Ce sont des adjectifs, écrits en minuscule.","ex":["Les herbes sont comestibles ? – Oui, on peut les manger.","Le loyer est abordable.","Attention, l'eau n'est pas potable."],"tip":"-bar = man kann + verbe : waschbar = man kann es waschen.","col":["comestible","potable","lavable","abordable","utilisable"]},"um … zu + Infinitiv":{"t":"um … zu + infinitif","x":"<b>um … zu</b> = « pour / afin de » quand c'est le <b>même sujet</b> qui fait les deux actions. Pas de sujet après um, et zu + infinitif se place à la fin. Avec un verbe séparable, zu se met au milieu : an<b>zu</b>rufen.","ex":["Pourquoi as-tu besoin de l'échelle ? – Pour peindre le plafond.","J'ai besoin de la perceuse pour accrocher le tableau.","Je n'ai pas besoin de voiture pour aller en ville."],"tip":"damit et um … zu ont le même sens. Avec um … zu, pas de deuxième sujet."},"Passiv im Präsens":{"t":"Le passif au présent","x":"Au passif, c'est l'<b>action</b> qui compte, pas la personne qui la fait. On le forme avec <b>werden</b> (wird / werden) + le <b>participe II</b> à la fin. Il est fréquent dans les modes d'emploi et les recettes.","ex":["Kai branche le câble de charge. → Le câble de charge est branché.","D'abord, la batterie est chargée.","Ensuite, on appuie sur les touches."],"tip":"Actif : la personne compte. Passif : l'action compte. « man + verbe » ≈ passif."},"Präpositionen mit Akkusativ":{"t":"Les prépositions suivies de l'accusatif","x":"Après <b>durch</b> (à travers), <b>ohne</b> (sans), <b>gegen</b> (contre / vers), <b>für</b> (pour) et <b>um</b> (autour de / à + heure), le nom est toujours à l'accusatif : der → <b>den</b>.","ex":["Nous marchons à travers la forêt.","Il ne faut pas randonner en montagne sans bonnes chaussures.","Ensuite, nous faisons le tour du lac."],"tip":"Seul le masculin change : für <b>den</b> Bruder, mais für die Schwester, für das Kind."},"Verb-Nomen-Komposita: das Bergwandern":{"t":"Les composés nom + verbe : das Bergwandern","x":"On réunit un nom + un verbe en un seul mot avec une majuscule. L'article est <b>das</b>, car le dernier élément est un verbe : Berg + wandern = das Bergwandern.","ex":["J'aime randonner en montagne. La randonnée en montagne, c'est bon pour la santé.","La vie à la campagne est plus calme que la vie en ville.","Faire du pain me plaît."],"tip":"Comme das
