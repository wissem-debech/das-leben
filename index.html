<style>
/* Layout: one reading column; sticky unit rail; topics grouped under Das Leben A1 units; Plateau tests between unit blocks */
:root{
  --paper:#f3f4f1; --surface:#ffffff; --ink:#18233a; --muted:#5d6577; --line:#dcdfe3;
  --accent:#1f4fa3; --accent-soft:#e3eaf7; --ochre:#b7811a; --ochre-soft:#f6ecd6;
  --ok:#2e7d4f; --ok-soft:#e1f1e7; --bad:#b23a3a; --bad-soft:#f7e3e3;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-de:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --surface:#192030; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2a3346;
  --accent:#7ea6ec; --accent-soft:#1f2c47; --ochre:#e0b25a; --ochre-soft:#3a2f18;
  --ok:#6cc792; --ok-soft:#173326; --bad:#ec8a8a; --bad-soft:#3d1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --surface:#192030; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2a3346;
  --accent:#7ea6ec; --accent-soft:#1f2c47; --ochre:#e0b25a; --ochre-soft:#3a2f18;
  --ok:#6cc792; --ok-soft:#173326; --bad:#ec8a8a; --bad-soft:#3d1d1d; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto}
header.top{padding-block:26px 12px;display:grid;gap:8px}
h1{font-family:var(--f-display);font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.25;margin:0;text-wrap:balance}
h1 .de{font-family:var(--f-de);font-weight:600;color:var(--accent);font-size:.62em;display:block;direction:ltr;text-align:right}
.lede{color:var(--muted);margin:0;max-width:60ch}
.toprow{display:flex;justify-content:flex-end;align-items:center}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:none;color:var(--muted);padding:4px 13px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.wrap[dir="ltr"] .row .t span,.wrap[dir="ltr"] h1 .de{text-align:left}
td.tx{font-family:var(--f-body);white-space:normal}
.stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-de);font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:3px 10px;cursor:pointer;text-decoration:none;direction:ltr;font-variant-numeric:tabular-nums}
.chip.full{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chip.pl{border-color:var(--ochre);color:var(--ochre)}
.search{width:100%;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.list{display:grid;gap:8px;margin-top:18px}
.unit{display:grid;gap:2px;margin:18px 0 4px}
.unit:first-child{margin-top:0}
.unit .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .n{font-family:var(--f-de);font-weight:600;color:var(--paper);background:var(--ink);border-radius:6px;padding:0 8px;font-size:.85rem;direction:ltr}
.unit .ttl{font-family:var(--f-display);font-size:1.15rem}
.unit .de{font-family:var(--f-de);color:var(--muted);font-size:.9rem;direction:ltr}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.topic.done{border-inline-start:4px solid var(--ok)}
summary.row{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.row .t{flex:1;min-width:0;display:grid}
.row .t strong{font-weight:600}
.row .t span{font-family:var(--f-de);direction:ltr;text-align:right;color:var(--accent);font-size:.9rem}
.check{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--surface);font-size:.7rem}
.topic.done .check{background:var(--ok);border-color:var(--ok)}
.chev{flex:none;width:20px;height:20px;transition:transform .2s;color:var(--muted)}
.topic[open] .chev{transform:rotate(180deg)}
.body{padding:0 14px 16px;display:grid;gap:12px}
.body p{margin:0}
.h{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:-6px}
.rule{background:var(--ochre-soft);border-radius:8px;padding:8px 12px;font-family:var(--f-de);direction:ltr;text-align:left;font-weight:600}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-family:var(--f-de);direction:ltr;min-width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
th{background:var(--accent-soft);font-weight:600}
td.ar{font-family:var(--f-body);direction:rtl;text-align:right;white-space:normal}
.ex{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ex li{border-inline-start:3px solid var(--accent);padding-inline-start:10px;display:grid}
.de-t{font-family:var(--f-de);direction:ltr;text-align:left;font-size:1.02rem}
.de-t mark{background:none;color:var(--accent);font-weight:600}
.ex .ar{color:var(--muted);font-size:.9rem}
.err{display:grid;gap:4px;border-radius:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
.err .w,.err .r{display:flex;gap:8px;align-items:baseline}
.err .w .de-t{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.err .sym{flex:none;font-weight:700;width:1em;text-align:center}
.err .w .sym{color:var(--bad)} .err .r .sym{color:var(--ok)}
.tip{font-size:.92rem;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.tip b{color:var(--accent)}
.quiz{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:14px}
.qi{display:grid;gap:6px}
.qi .q{font-family:var(--f-de);direction:ltr;text-align:left;font-size:1.02rem}
.qi .q .num{color:var(--ochre);font-weight:600;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.opt{font-family:var(--f-de);font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qscore{font-size:.88rem;font-weight:600}
.mark{justify-self:start;font:inherit;font-size:.88rem;border:1px solid var(--ok);color:var(--ok);background:none;border-radius:8px;padding:4px 12px;cursor:pointer}
.topic.done .mark{background:var(--ok);color:var(--surface)}
.plateau{margin:14px 0 6px;border:1.5px dashed var(--ochre);border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:var(--ochre-soft)}
.plateau .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.plateau strong{font-family:var(--f-de);direction:ltr}
.plateau .sub{font-size:.88rem;color:var(--muted)}
.btn{font:inherit;font-size:.9rem;background:var(--ochre);color:var(--surface);border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ochre);border:1px solid var(--ochre)}
.pq{display:grid;gap:10px;background:var(--surface);border-radius:10px;padding:12px}
.pq .meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pq .src{font-size:.8rem;color:var(--muted)}
.result{text-align:center;display:grid;gap:6px;justify-items:center}
.result .big{font-family:var(--f-de);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.final{border-color:var(--accent);background:var(--accent-soft)}
.final .btn{background:var(--accent)}
.final .btn.ghost{background:none;color:var(--accent);border-color:var(--accent)}
footer{color:var(--muted);font-size:.82rem;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Article colours: der blue, die red, das green ---------- */
:root{--der:#1d5bc8;--die:#c4303c;--das:#1d7f47;--der-soft:#e4ecfb;--die-soft:#fbe6e8;--das-soft:#e0f2e7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--der:#86b2ff;--die:#ff8f98;--das:#74d6a0;--der-soft:#1c2b48;--die-soft:#401f25;--das-soft:#16352a}}
:root[data-theme="dark"]{--der:#86b2ff;--die:#ff8f98;--das:#74d6a0;--der-soft:#1c2b48;--die-soft:#401f25;--das-soft:#16352a}
.a-der{color:var(--der)}.a-die{color:var(--die)}.a-das{color:var(--das)}
.de,.de-inf,.de-h,.qbig.de{font-family:var(--f-de)}
.de,.de-inf,.de-h{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
body.noscroll{overflow:hidden}

/* ---------- Header ---------- */
.toprow{justify-content:space-between;gap:10px}
.backbtn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.home-h{margin:6px 0 0}
.de-h.big{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.sech{display:flex;gap:12px;align-items:center}
.sech>span:last-child{display:grid;line-height:1.15}
.sech .de-h{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:600}
.sech .loc-h{font-family:var(--f-body);font-size:.95rem;font-weight:500;color:var(--muted)}
.secico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.secico svg{width:26px;height:26px}

/* ---------- Home ---------- */
.homeq{font-family:var(--f-display);font-size:1.25rem;margin:22px 0 12px}
.homeq.small{font-size:1.05rem;margin-top:28px}
.hcards{display:grid;gap:12px}
.hcard{font:inherit;color:var(--ink);text-align:start;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.hcard:hover{border-color:var(--accent)}
.hcard:active{transform:scale(.99)}
.hc-ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.hc-ico svg{width:28px;height:28px}
.hc-grammatik .hc-ico{background:var(--accent-soft);color:var(--accent)}
.hc-verben .hc-ico{background:var(--ochre-soft);color:var(--ochre)}
.hc-wortschatz .hc-ico{background:var(--das-soft);color:var(--das)}
.hc-txt{flex:1;min-width:0;display:grid;gap:2px}
.hc-de{font-family:var(--f-de);font-size:1.3rem;font-weight:600;direction:ltr;unicode-bidi:isolate;justify-self:start}
.hc-loc{font-weight:600;font-size:.95rem}
.hc-d{color:var(--muted);font-size:.88rem;line-height:1.5}
.hc-prog{display:flex;align-items:center;gap:10px;margin-top:6px}
.hc-prog .prog{flex:1;min-width:60px}
.hc-n{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hc-go{flex:none;font-size:1.6rem;color:var(--muted)}
.quick{display:grid;gap:8px}
.qbtn{font:inherit;color:var(--ink);text-align:start;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.qbtn:hover:not(:disabled){border-color:var(--accent)}
.qbtn:disabled{cursor:default;color:var(--muted);font-size:.88rem}
.arts3{flex:none;display:inline-flex;gap:5px;font-family:var(--f-de);font-weight:600;font-size:.9rem;direction:ltr}
.arts3.de{color:var(--ochre)}
.arts3.warn{width:26px;height:26px;border-radius:50%;justify-content:center;align-items:center;background:var(--die-soft);color:var(--die)}
.arts3.mini{font-size:.82rem}

/* ---------- Section panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.hint{margin:0;font-size:.9rem;color:var(--muted)}
.hint.small{font-size:.84rem}
.irr-demo{font-family:var(--f-de);color:var(--die);font-weight:600;background:var(--die-soft);border-radius:5px;padding:0 6px;direction:ltr;display:inline-block}
.panel .btn{justify-self:start}
.actrow{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-de);font-weight:600}
.legend .lg-t{font-family:var(--f-body);font-weight:400;font-size:.84rem;color:var(--muted)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.tg{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tg input{width:18px;height:18px;accent-color:var(--accent)}
.unit-sub{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ucount{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.uact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.btn.sm{font-size:.84rem;padding:5px 12px}
.btn.ghost:disabled{opacity:.5;cursor:default}

/* ---------- Word list ---------- */
.words{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.word{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;border-inline-start-width:4px}
.word.w-der{border-inline-start-color:var(--der)}.word.w-die{border-inline-start-color:var(--die)}.word.w-das{border-inline-start-color:var(--das)}
.word .art{flex:none;min-width:42px;text-align:center;font-family:var(--f-de);font-weight:600;font-size:.92rem;border-radius:6px;padding:1px 6px;direction:ltr}
.word .art.a-der{background:var(--der-soft)}.word .art.a-die{background:var(--die-soft)}.word .art.a-das{background:var(--das-soft)}
.word .wd{flex:1;min-width:0;display:grid;direction:ltr;text-align:left}
.word .w{font-family:var(--f-de);font-weight:600;font-size:1.05rem}
.word .pl{font-family:var(--f-de);font-size:.8rem;color:var(--muted)}
.word .mn{flex:0 1 40%;min-width:0;font-size:.9rem;color:var(--muted);text-align:end}
.word .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.word.mastered .dot{background:var(--ok)}
.hide-art .word:not(.rev) .art{color:transparent;background:var(--line);position:relative}
.hide-art .word:not(.rev) .art::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.hide-art .word:not(.rev) .w{color:var(--ink)}
.hide-art .word:not(.rev){border-inline-start-color:var(--line)}
.hide-tr .word:not(.rev) .mn{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.spk{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.spk svg{width:16px;height:16px}

/* ---------- Verb cards ---------- */
.verb .de-inf{font-size:1.1rem;font-weight:600;direction:ltr;text-align:start}
.verb .row .t .mn{font-family:var(--f-body);color:var(--muted);font-size:.88rem;direction:inherit;text-align:start}
.wrap[dir="ltr"] .verb .row .t .mn{text-align:left}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.tag{font-size:.7rem;border-radius:5px;padding:1px 6px;white-space:nowrap}
.t-sein{background:var(--ochre-soft);color:var(--ochre)}
.t-sep{background:var(--accent-soft);color:var(--accent)}
.t-irr{background:var(--die-soft);color:var(--die)}
.vhead{display:flex;align-items:center;gap:10px}
.vline{font-size:.95rem;color:var(--muted)}
.conj{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.ct{min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px;align-content:start}
.ct h4{margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:.95rem}
.ct h4 small{font-weight:400;color:var(--muted);font-size:.78rem}
.ctab{border-collapse:collapse;width:100%;font-family:var(--f-de);direction:ltr;font-size:.92rem}
.ctab th{background:none;color:var(--muted);font-weight:400;text-align:left;padding:2px 8px 2px 0;border:0;white-space:nowrap;width:1%}
.ctab td{border:0;padding:2px 0;white-space:normal}
.ctab td.irr,.ctab b.irr{color:var(--die);font-weight:600}
.ctab b{font-weight:600}
.noimp{margin:0;font-size:.86rem;color:var(--muted)}

/* ---------- Practice overlay ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-in{max-width:560px;margin:0 auto;display:grid;gap:14px;padding-block:12px 32px;font-family:var(--f-body)}
.ov-head{display:flex;align-items:center;gap:10px}
.ov-x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer}
.ov-title{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;direction:ltr}
.ov-prog{height:6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 16px;display:grid;gap:10px;text-align:center;justify-items:center}
.qask{font-size:.88rem;color:var(--muted)}
.qbig{font-size:clamp(1.7rem,8vw,2.4rem);font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.qbig.loc{font-family:var(--f-display);font-weight:600;font-size:clamp(1.5rem,7vw,2.1rem)}
.qline{font-size:clamp(1.4rem,6vw,1.9rem);font-weight:600}

{"u":4,"ar":"الحب والتفضيل: mögen و gern","de":"mögen und gern","x":"mögen + اسم: أحب شيئاً. gern + فعل: أحب فعل شيء. gern تأتي بعد الفعل.","tbl":[["ich","mag"],["du","magst"],["er/sie","mag"],["wir","mögen"],["ihr","mögt"],["sie/Sie","mögen"]],"ex":[["Ich <mark>mag</mark> Pizza.","أحب البيتزا."],["Ich koche <mark>gern</mark>.","أحب الطبخ."],["Er isst <mark>nicht gern</mark> Gemüse.","لا يحب أكل الخضار."]],"err":["Ich gern esse Fisch.","Ich esse gern Fisch."],"tip":"gern → lieber → am liebsten: Ich trinke <b>lieber</b> Tee.","qz":[["Isst du ___ Fisch?",["mag","gern","möchte"],1],["___ du Schokolade?",["Magst","Mag","Mögt"],0],["Ich trinke Tee ___ als Kaffee.",["gerner","lieber","mehr"],1]]},
{"u":4,"ar":"الأفعال التي يتغيّر حرفها","de":"Verben mit Vokalwechsel","x":"بعض الأفعال تغيّر حرف العلة مع du و er/sie/es فقط.","tbl":[["e → i","essen: du isst, er isst · nehmen: du nimmst, er nimmt"],["e → ie","lesen: du liest, er liest · sehen: du siehst"],["a → ä","fahren: du fährst · schlafen: er schläft"]],"ex":[["Was <mark>nimmst</mark> du?","ماذا تأخذ؟"],["Sie <mark>isst</mark> gern Couscous.","تحب أكل الكسكسي."]],"err":["Er esst Brot.","Er isst Brot."],"tip":"wir و ihr و sie يبقون بلا تغيير: wir nehmen, ihr esst.","qz":[["Er ___ ein Stück Kuchen. (nehmen)",["nehmt","nimmt","nehmen"],1],["Du ___ ein Buch. (lesen)",["lest","liest","lesst"],1],["Er ___ nach Hause. (fahren)",["fahrt","fährt","fähren"],1]]},
{"u":5,"ar":"الوقت والمواعيد","de":"Uhrzeit und Zeitangaben","x":"am مع الأيام وأجزاء اليوم، um مع الساعة، von … bis للمدة، im مع الشهور والفصول.","tbl":[["am","am Montag, am Abend"],["um","um 8 Uhr"],["von … bis","von 9 bis 17 Uhr"],["im","im Mai, im Sommer"]],"ex":[["Es ist <mark>halb</mark> acht. (7:30)","الساعة السابعة والنصف."],["Es ist <mark>Viertel nach</mark> drei. (3:15)","الثالثة والربع."],["Es ist <mark>Viertel vor</mark> zehn. (9:45)","العاشرة إلا ربعاً."]],"err":["Ich komme um Montag.","Ich komme am Montag."],"tip":"halb acht = 7:30 وليس 8:30، لأن المعنى «نصف ساعة قبل الثامنة».","qz":[["Ich arbeite ___ Montag ___ Freitag.",["am / um","von / bis","um / bis"],1],["Der Film beginnt ___ 20 Uhr.",["am","um","im"],1],["7:30 = ?",["halb acht","halb sieben","sieben halb"],0]]},
{"u":5,"ar":"الأفعال المنفصلة","de":"Trennbare Verben","x":"بعض الأفعال لها بادئة تنفصل وتذهب إلى آخر الجملة: an, auf, aus, ein, mit, zu, fern…","rule":"anrufen → Ich rufe dich morgen an.","ex":[["Ich <mark>stehe</mark> um 7 Uhr <mark>auf</mark>.","أستيقظ في السابعة."],["Wann <mark>kaufst</mark> du <mark>ein</mark>?","متى تتسوّق؟"],["Wir <mark>sehen</mark> abends <mark>fern</mark>.","نشاهد التلفاز مساءً."]],"err":["Ich anrufe meine Mutter.","Ich rufe meine Mutter an."],"tip":"البادئات be-, ver-, er-, ent-, ge- لا تنفصل أبداً: verstehen → ich verstehe.","qz":[["Ich ___ am Samstag ___. (einkaufen)",["einkaufe / –","kaufe / ein","kaufe / einkaufen"],1],["Der Zug ___ um 9 Uhr ___. (ankommen)",["ankommt / –","kommt / an","an / kommt"],1],["Ich ___ das Wort nicht. (verstehen)",["stehe … ver","verstehe","ver stehe"],1]]},
{"u":5,"ar":"السؤال عن الزمن: wann و wie lange و wie oft","de":"wann? wie lange? wie oft?","x":"wann للسؤال عن وقت حدوث شيء. wie lange للسؤال عن المدة. wie oft لعدد المرات.","ex":[["<mark>Wann</mark> hast du Zeit? – Am Freitag.","متى لديك وقت؟ يوم الجمعة."],["<mark>Wie lange</mark> dauert der Film? – Zwei Stunden.","كم يستغرق الفيلم؟ ساعتين."],["<mark>Wie oft</mark> gehst du ins Kino?","كم مرة تذهب إلى السينما؟"]],"err":["Wann lange dauert der Kurs?","Wie lange dauert der Kurs?"],"tip":"جواب wann فيه am/um، وجواب wie lange فيه مدة (Stunden, Tage).","qz":[["___ dauert der Kurs? – Drei Monate.",["Wann","Wie lange","Wie viel"],1],["___ beginnt die Party? – Um acht.",["Wie lange","Wann","Wo"],1],["___ gehst du schwimmen? – Zweimal pro Woche.",["Wann","Wie oft","Wie lange"],1]]},
{"u":6,"ar":"ضمائر الملكية (كاملة)","de":"Possessivartikel","x":"mein, dein, sein (له)، ihr (لها)، unser, euer, ihr/Ihr. كلها تأخذ نهايات ein.","tbl":[["ich","mein"],["du","dein"],["er / es","sein"],["sie","ihr"],["wir","unser"],["ihr","euer"],["sie / Sie","ihr / Ihr"]],"ex":[["Das ist <mark>unsere</mark> Stadt.","هذه مدينتنا."],["Anna und <mark>ihr</mark> Bruder","آنا وأخوها"],["Ist das <mark>Ihr</mark> Auto?","هل هذه سيارة حضرتك؟"]],"err":["Maria und sein Mann","Maria und ihr Mann"],"tip":"sein لصاحب مذكر، و ihr لصاحبة مؤنثة. Ihr بحرف كبير = لحضرتك.","qz":[["Tarek besucht ___ Oma.",["ihre","seine","seinen"],1],["Wir lieben ___ Stadt.",["unser","unsere","unseren"],1],["Frau Weber, ist das ___ Tasche?",["Ihre","ihre","deine"],0]]},
{"u":6,"ar":"الماضي: war","de":"Präteritum von sein","x":"للحديث عن الماضي نستعمل مع sein صيغة Präteritum: war (كان)، حتى في الكلام اليومي.","tbl":[["","sein"],["ich","war"],["du","warst"],["er/sie/es","war"],["wir","waren"],["ihr","wart"],["sie/Sie","waren"]],"ex":[["Gestern <mark>war</mark> ich im Museum.","أمس كنت في المتحف."],["<mark>Warst</mark> du schon in Berlin?","هل زرت برلين من قبل؟"]],"err":["Gestern ich war im Kino.","Gestern war ich im Kino."],"tip":"مع ich و er/sie لا نهاية: ich war, er war. وانتبه: ihr wart.","qz":[["Wo ___ du gestern?",["warst","war","wart"],0],["Wir ___ in Wien.",["war","waren","wart"],1],["___ ihr schon in Innsbruck?",["Wart","Waren","Warst"],0]]},
{"u":6,"ar":"mit و zu مع Dativ","de":"mit und zu + Dativ","x":"بعد mit (بـ، مع) و zu (إلى) يأتي الاسم دائماً في Dativ: der و das تصبحان dem، و die تصبح der.","tbl":[["","maskulin","neutral","feminin"],["mit","mit dem Bus","mit dem Fahrrad","mit der U-Bahn"],["zu","zum Bahnhof","zum Museum","zur Haltestelle"]],"rule":"zu dem = zum · zu der = zur","ex":[["Ich fahre <mark>mit dem</mark> Bus.","أذهب بالحافلة."],["Wie komme ich <mark>zum</mark> Hauptbahnhof?","كيف أصل إلى المحطة الرئيسية؟"],["Sie gehen hier links <mark>zur</mark> Haltestelle.","تمشي هنا يساراً إلى المحطة."]],"err":["Ich fahre mit die U-Bahn.","Ich fahre mit der U-Bahn."],"tip":"zu Fuß = مشياً على الأقدام (بدون أداة).","qz":[["Ich fahre mit ___ Fahrrad.",["das","dem","der"],1],["Wie komme ich ___ Universität?",["zum","zur","zu die"],1],["Wir fahren mit ___ U-Bahn.",["dem","der","die"],1]]},
{"u":6,"ar":"ظروف التكرار","de":"Häufigkeitsadverbien","x":"للتعبير عن عدد المرات، من الأكثر إلى الأقل.","rule":"immer › meistens › oft › manchmal › selten › nie","ex":[["Ich spiele <mark>oft</mark> Fußball.","ألعب كرة القدم كثيراً."],["Er geht <mark>nie</mark> ins Theater.","لا يذهب أبداً إلى المسرح."]],"err":["Oft ich lese.","Oft lese ich."],"tip":"يمكن وضعها أول الجملة، وعندها يأتي الفعل بعدها: <b>Manchmal lese</b> ich abends.","qz":[["Ich trinke ___ Kaffee, nur einmal im Monat.",["oft","selten","immer"],1],["Er ist ___ pünktlich, jeden Tag!",["nie","immer","selten"],1],["Manchmal ___ ins Kino.",["ich gehe","gehe ich","gehen ich"],1]]},
{"u":7,"ar":"الأعداد الترتيبية","de":"Ordnungszahlen","x":"للطوابق والتواريخ: من 1 إلى 19 نضيف ‎-te، ومن 20 فما فوق ‎-ste. شاذّة: erste, dritte, siebte.","tbl":[["1.","der erste"],["2.","der zweite"],["3.","der dritte"],["4.","der vierte"],["7.","der siebte"],["20.","der zwanzigste"]],"ex":[["Das Büro ist in der <mark>dritten</mark> Etage.","المكتب في الطابق الثالث."],["Heute ist der <mark>erste</mark> April.","اليوم هو الأول من أبريل."]],"err":["der dreite Stock","der dritte Stock"],"tip":"بعد in der تأخذ النهاية ‎-en: in der ersten Etage, in der zweiten Etage.","qz":[["1. = der ___",["einste","erste","eins"],1],["3. = der ___",["dreite","dritte","drittste"],1],["Das Sekretariat ist in der ___ Etage. (2.)",["zweite","zweiten","zweiter"],1]]},
{"u":7,"ar":"حروف الجر للمكان مع Dativ","de":"Lokale Präpositionen mit Dativ (wo?)","x":"للجواب عن السؤال wo? (أين؟) نستعمل حروف المكان مع Dativ.","tbl":[["","mask.","fem.","neutr.","Plural"],["Dativ","dem","der","dem","den"]],"ex":[["Das Handy liegt <mark>auf dem</mark> Tisch.","الهاتف على الطاولة."],["Die Lampe steht <mark>neben der</mark> Tür.","المصباح بجانب الباب."],["Ich arbeite <mark>im</mark> Büro.","أعمل في المكتب."]],"err":["Das Buch liegt auf den Tisch.","Das Buch liegt auf dem Tisch."],"tip":"in dem = <b>im</b>، an dem = <b>am</b>. المؤنث في Dativ يصبح <b>der</b>.","qz":[["Der Drucker steht ___ Fenster.",["neben das","neben dem","neben der"],1],["Die Kaffeemaschine steht in ___ Küche.",["die","der","dem"],1],["Der Computer ist ___ Büro.",["im","in","ins"],0]]},
{"u":8,"ar":"الماضي: hatte (و war)","de":"Präteritum von haben","x":"في الوحدة 6 تعلّمت war. الآن hatte (كان لدي). في الكلام نستعملهما بدلاً من Perfekt.","tbl":[["","sein","haben"],["ich","war","hatte"],["du","warst","hattest"],["er/sie/es","war","hatte"],["wir","waren","hatten"],["ihr","wart","hattet"],["sie/Sie","waren","hatten"]],"ex":[["Gestern <mark>hatte</mark> ich keine Zeit.","أمس لم يكن لدي وقت."],["Wir <mark>hatten</mark> viel Spaß.","استمتعنا كثيراً."]],"err":["Gestern ich hatte Geburtstag.","Gestern hatte ich Geburtstag."],"tip":"war و hatte معاً: Ich war krank und hatte Fieber (كنت مريضاً وكانت لدي حمّى).","qz":[["Am Wochenende ___ ich keine Zeit.",["habe","hatte","war"],1],["___ du gestern Geburtstag?",["Hattest","Hatte","Hattet"],0],["Wir ___ ein Problem.",["hatte","hatten","hattet"],1]]},
{"u":8,"ar":"فعل können","de":"Modalverb können","x":"können = يستطيع / يعرف كيف. الفعل المساعد في المكان الثاني والفعل الأساسي في المصدر آخر الجملة.","rule":"Ich | kann | gut | schwimmen.","tbl":[["ich","kann"],["du","kannst"],["er/sie","kann"],["wir","können"],["ihr","könnt"],["sie/Sie","können"]],"ex":[["Ich <mark>kann</mark> gut <mark>schwimmen</mark>.","أستطيع السباحة جيداً."],["<mark>Kannst</mark> du Gitarre <mark>spielen</mark>?","هل تعزف الغيتار؟"]],"err":["Ich kann spielen Gitarre.","Ich kann Gitarre spielen."],"tip":"مع ich و er/sie لا نضيف نهاية: ich kann, er kann.","qz":[["Er ___ sehr gut ___.",["kann / kochen","kannt / kochen","kann / kocht"],0],["___ ihr gut tanzen?",["Kannst","Könnt","Können"],1],["Ich kann heute nicht ___.",["komme","kommen","kommt"],1]]},
{"u":8,"ar":"الضمير man","de":"Pronomen man","x":"man = المرء أو الناس عموماً. يأتي معه الفعل مثل er/sie/es.","ex":[["In Tirol kann <mark>man</mark> gut wandern.","في تيرول يمكن للمرء التنزّه جيداً."],["Hier <mark>spricht man</mark> Deutsch.","هنا يتكلّمون الألمانية."]],"err":["Hier sprechen man Deutsch.","Hier spricht man Deutsch."],"tip":"لا تخلط: man (ضمير) ≠ der Mann (الرجل).","qz":[["In Innsbruck ___ man gut studieren.",["können","kann","kannst"],1],["Wie ___ man das auf Deutsch?",["sagen","sagt","sagst"],1],["Was ___ man in Leipzig machen?",["kann","können","kannst"],0]]},
{"u":9,"ar":"الأسماء المركّبة","de":"Komposita","x":"الألمانية تركّب الأسماء ببعضها. الكلمة الأخيرة هي الأساس وتحدّد الأداة.","rule":"wohnen + das Zimmer = das Wohnzimmer","ex":[["die Küche + <mark>der</mark> Tisch = <mark>der</mark> Küchentisch","طاولة المطبخ"],["das Bad + <mark>die</mark> Wanne = <mark>die</mark> Badewanne","حوض الاستحمام"]],"err":["die Küchentisch","der Küchentisch"],"tip":"الأداة دائماً من الكلمة الأخيرة.","qz":[["das Haus + die Tür = ___ Haustür",["das","die","der"],1],["schlafen + das Zimmer = ___ Schlafzimmer",["der","die","das"],2],["die Wohnung + der Schlüssel = ___ Wohnungsschlüssel",["der","die","das"],0]]},
{"u":9,"ar":"حروف الجر للمكان: أين؟","de":"Präpositionen mit Dativ: wo?","x":"للجواب عن wo? (أين؟) نستعمل in, an, auf, unter, über, vor, hinter, neben, zwischen مع Dativ.","rule":"in, an, auf, unter, über, vor, hinter, neben, zwischen + Dativ","ex":[["Die Katze liegt <mark>unter dem</mark> Sofa.","القطة تحت الأريكة."],["Das Regal steht <mark>zwischen der</mark> Tür und <mark>dem</mark> Fenster.","الرف بين الباب والنافذة."],["Das Bild hängt <mark>über dem</mark> Bett.","الصورة معلّقة فوق السرير."]],"err":["Die Lampe steht neben das Sofa.","Die Lampe steht neben dem Sofa."],"tip":"اسأل wo?: Auf dem Tisch. ستتعلّم حروف الجر مع Akkusativ (wohin?) في الوحدة 16.","qz":[["Die Katze sitzt unter ___ Tisch.",["den","dem","der"],1],["Der Teppich liegt vor ___ Sofa.",["dem","das","den"],0],["Das Bild hängt an ___ Wand.",["die","der","den"],1]]},
{"u":9,"ar":"الصفة بعد الفعل و zu","de":"Adjektive nach sein, zu + Adjektiv","x":"الصفة بعد sein لا تأخذ نهاية. sehr = جداً، zu = أكثر من اللازم، viel zu = أكثر بكثير من اللازم.","ex":[["Die Wohnung ist <mark>schön</mark>, aber <mark>zu teuer</mark>.","الشقة جميلة لكنها غالية أكثر من اللازم."],["Das Zimmer ist <mark>sehr</mark> hell.","الغرفة مضيئة جداً."]],"err":["Das Zimmer ist großes.","Das Zimmer ist groß."],"tip":"sehr = جداً (إيجابي أو محايد)، zu = أكثر من اللازم.","qz":[["Ich kann sie nicht mieten, sie ist ___ teuer.",["sehr","zu","so"],1],["Die Wohnung ist ___ schön, ich nehme sie!",["zu","sehr","zu viel"],1],["Die Küche ist ___.",["klein","kleine","kleinen"],0]]},
{"u":10,"ar":"الماضي التام مع haben","de":"Perfekt mit haben","x":"أشهر زمن ماضٍ في الكلام. haben في المكان الثاني، والتصريف الثالث (Partizip II) في آخر الجملة.","rule":"haben (Pos. 2) … ge-…-t (Ende)","ex":[["Ich <mark>habe</mark> Fotos <mark>gemacht</mark>.","التقطت صوراً."],["Wir <mark>haben</mark> zusammen <mark>gekocht</mark>.","طبخنا معاً."]],"err":["Ich habe gekauft ein Auto.","Ich habe ein Auto gekauft."],"tip":"الأفعال القياسية: ge + الجذر + t: spielen → gespielt، kaufen → gekauft.","qz":[["Gestern ___ ich Fußball gespielt.",["bin","habe","hatte"],1],["Was hast du am Wochenende ___? (machen)",["gemacht","machte","gemachen"],0],["Wir ___ viel gelacht.",["sind","haben","hat"],1]]},
{"u":10,"ar":"ضمائر الملكية في المفعول به","de":"Possessivartikel im Akkusativ","x":"مثل ein / einen: المذكر يأخذ ‎-en في Akkusativ، والباقي لا يتغيّر.","tbl":[["","mask.","fem.","neutr.","Plural"],["Akk.","meinen","meine","mein","meine"]],"ex":[["Ich besuche <mark>meinen</mark> Opa.","أزور جدي."],["Kennst du <mark>unseren</mark> Sohn?","هل تعرف ابننا؟"]],"err":["Ich liebe mein Vater.","Ich liebe meinen Vater."],"tip":"euer يفقد e عند إضافة نهاية: eure Eltern.","qz":[["Ich rufe ___ Vater an.",["mein","meinen","meinem"],1],["Kennst du ___ Schwester? (mein)",["meinen","meine","mein"],1],["Wir besuchen ___ Großeltern. (unser)",["unser","unsere","unseren"],1]]},

const TRK1={"en":{"Alphabet und Umlaute":{"t":"Letters and pronunciation","x":"German is mostly pronounced the way it is written. Learn the special letters ä, ö, ü, ß and the key letter combinations, and remember that all nouns start with a capital letter.","col":["like an open e","say e with your lips rounded","say i with your lips rounded","a strong s","“eye” / long “ee”","“sh” / a throaty or soft sound"],"ex":["How do you spell that?","Could you spell that, please?"],"tip":"ei sounds like “eye” and ie like “ee”: <b>Wein</b> (wine) ≠ <b>Wien</b> (Vienna)."},"Fragewörter":{"t":"Question words","x":"Question words come at the start of the sentence, followed directly by the verb.","col":["who?","what?","where?","where from?","where to?","how?","how much?"],"ex":["Who is that?","Where are you from?","What's your phone number?"],"tip":"To ask for a name, number or address, use <b>wie</b>, not was."},"Präsens: regelmäßige Verben":{"t":"Present tense conjugation","x":"Remove -en from the infinitive and add an ending for each pronoun.","ex":["I'm from Tunisia.","Where do you live?","She is learning German."],"tip":"If the stem ends in t or d, add e: du arbeit<b>e</b>st. If it ends in s, ß or z, du only takes -t: du heißt."},"W-Fragen und Ja/Nein-Fragen":{"t":"Questions and word order","x":"In statements and in questions with a question word, the verb is always in second position. In yes/no questions, the verb comes first.","ex":["I'm learning German.","What are you doing?","Do you speak English?"],"tip":"If the sentence starts with a time or place, the subject comes right after the verb: Heute <b>lerne ich</b>."},"du oder Sie":{"t":"Informal or formal: du or Sie","x":"Use du with friends, family, children and other students. Use Sie (always capitalised) with strangers, teachers and at work; it is conjugated like the plural.","ex":["What's your name? (informal)","What's your name? (formal)","Where are you from, Ms Weber?"],"tip":"In the speaking exam, use <b>Sie</b> with the examiner; you can use du with your partner."},"Artikel: der, die, das":{"t":"Articles and gender","x":"Every noun has a gender: masculine der, feminine die, neuter das. The plural is always die. Always learn a noun together with its article.","ex":["the pen, the board, the book","This is a table."],"tip":"Nouns ending in -ung, -heit, -keit are feminine, and nouns ending in -chen are neuter. Write each new noun in a colour that matches its gender."},"Plural":{"t":"Noun plurals","x":"The plural article is always die. There is no single rule for the endings, so learn each plural with the noun.","ex":["a lamp → two lamps","a book → three books"],"tip":"Most feminine nouns take -(e)n, and foreign words take -s. Dictionaries show the plural like this: Buch, ¨-er."},"Zahlen":{"t":"Numbers","x":"From 21 to 99 you say the units first, then the tens: einundzwanzig = “one-and-twenty”.","ex":["My number is …","That costs forty-five euros."],"tip":"Careful: dreißig is spelled with ß, not -zig, and sechzehn and siebzehn drop some letters."},"Das Verb sein":{"t":"The verb sein (to be)","x":"The most important verb in the language. It is irregular, so learn it by heart.","ex":["I'm a waiter.","This is my colleague.","Are you students?"],"tip":"No article with jobs and nationalities: Ich bin Lehrer. Er ist Tunesier."},"ein und kein":{"t":"Indefinite article and negation: ein and kein","x":"kein negates an indefinite noun and takes exactly the same endings as ein.","ex":["Is that a tea? – No, that's not a tea.","These aren't biscuits."],"tip":"ein has no plural, but kein does: keine."},"Possessivartikel: mein, dein":{"t":"Possessives mein and dein","x":"mein = my, dein = your. They take the same endings as ein / kein.","ex":["This is my café.","This is my boss.","Is that your phone?"],"tip":"With feminine and plural nouns, add -e: meine Tasse, meine Freunde."},"ich möchte":{"t":"Polite requests: ich möchte","x":"For ordering in cafés, restaurants and shops. möchte is in second position, followed by a noun, or with an infinitive at the end.","ex":["I'd like a coffee, please.","What would you like to drink?"],"tip":"ich möchte is more polite than ich will. Always use it in a café and in the exam."},"Akkusativ":{"t":"The direct object (Akkusativ)","x":"The direct object is in the accusative. Only the masculine changes: der→den, ein→einen, kein→keinen.","ex":["I'm eating a salad.","We don't need sugar.","There is an apple cake."],"tip":"es gibt, haben, brauchen, essen and nehmen all take the accusative."},"nicht oder kein":{"t":"Negation: nicht or kein","x":"kein negates an indefinite noun or a noun without an article. nicht negates a verb, an adjective or a definite noun.","ex":["I don't eat meat.","I don't like eating fish.","The soup isn't hot."],"tip":"Ask yourself: am I negating a noun without der/die/das? → kein. Otherwise → nicht."},"mögen und gern":{"t":"Likes: mögen and gern","x":"mögen + noun: to like something. gern + verb: to like doing something. gern comes after the verb.","ex":["I like pizza.","I like cooking.","He doesn't like eating vegetables."],"tip":"gern → lieber → am liebsten: Ich trinke <b>lieber</b> Tee (I prefer tea)."},"Verben mit Vokalwechsel":{"t":"Verbs with a vowel change","x":"Some verbs change their vowel with du and er/sie/es only.","ex":["What are you having?","She likes eating couscous."],"tip":"wir, ihr and sie don't change: wir nehmen, ihr esst."},"Uhrzeit und Zeitangaben":{"t":"Time and appointments","x":"am with days and parts of the day, um with clock times, von … bis for a period, im with months and seasons.","ex":["It's half past seven.","It's quarter past three.","It's quarter to ten."],"tip":"halb acht = 7:30, not 8:30, because it means “half an hour before eight”."},"Trennbare Verben":{"t":"Separable verbs","x":"Some verbs have a prefix that separates and goes to the end of the sentence: an, auf, aus, ein, mit, zu, fern…","ex":["I get up at 7.","When do you go shopping?","We watch TV in the evening."],"tip":"The prefixes be-, ver-, er-, ent-, ge- never separate: verstehen → ich verstehe."},"wann? wie lange? wie oft?":{"t":"Asking about time: wann, wie lange, wie oft","x":"wann asks when something happens, wie lange asks how long it lasts, and wie oft asks how often.","ex":["When are you free? – On Friday.","How long is the film? – Two hours.","How often do you go to the cinema?"],"tip":"The answer to wann has am/um; the answer to wie lange is a length of time (Stunden, Tage)."},"Possessivartikel":{"t":"Possessives (all forms)","x":"mein, dein, sein (his), ihr (her), unser, euer, ihr/Ihr. They all take the endings of ein.","ex":["This is our city.","Anna and her brother","Is this your car? (formal)"],"tip":"sein for a male owner, ihr for a female owner. Ihr with a capital = your (formal)."},"Präteritum von sein":{"t":"Past: war (sein)","x":"To talk about the past, sein uses the Präteritum: war (was), even in everyday speech.","ex":["Yesterday I was at the museum.","Have you been to Berlin before?"],"tip":"No ending with ich and er/sie: ich war, er war. Note: ihr wart."},"mit und zu + Dativ":{"t":"mit and zu + dative","x":"After mit (with, by) and zu (to), the noun is always in the dative: der and das become dem, die becomes der.","ex":["I'm going by bus.","How do I get to the central station?","You go left here to the stop."],"tip":"zu Fuß = on foot (no article)."},"Häufigkeitsadverbien":{"t":"Adverbs of frequency","x":"To say how often, from most to least.","ex":["I often play football.","He never goes to the theatre."],"tip":"They can start the sentence; then the verb comes next: <b>Manchmal lese</b> ich abends."},"Ordnungszahlen":{"t":"Ordinal numbers","x":"For floors and dates: from 1 to 19 add -te, from 20 add -ste. Irregular: erste, dritte, siebte.","ex":["The office is on the third floor.","Today is the first of April."],"tip":"After in der the ending is -en: in der ersten Etage, in der zweiten Etage."},"Lokale Präpositionen mit Dativ (wo?)":{"t":"Prepositions of place with the dative","x":"To answer wo? (where?), use prepositions of place with the dative.","ex":["The phone is on the table.","The lamp is next to the door.","I work in the office."],"tip":"in dem = <b>im</b>, an dem = <b>am</b>. Feminine in the dative becomes <b>der</b>."},"Präteritum von haben":{"t":"Past: hatte (and war)","x":"In Unit 6 you learned war. Now hatte (had). In speech we use both instead of the Perfekt.","ex":["Yesterday I didn't have time.","We had a lot of fun."],"tip":"war and hatte together: Ich war krank und hatte Fieber (I was ill and had a fever)."},"Modalverb können":{"t":"The verb können","x":"können = can / to know how to. The modal verb is in second position and the main verb goes to the end as an infinitive.","ex":["I can swim well.","Can you play the guitar?"],"tip":"No ending with ich and er/sie: ich kann, er kann."},"Pronomen man":{"t":"The pronoun man","x":"man = one, people in general. The verb takes the same form as with er/sie/es.","ex":["In Tyrol you can hike well.","German is spoken here."],"tip":"Don't mix up man (pronoun) and der Mann (the man)."},"Komposita":{"t":"Compound nouns","x":"German builds new nouns out of other words. The last word is the base and decides the article.","ex":["kitchen table","bathtub"],"tip":"The article always comes from the last word."},"Präpositionen mit Dativ: wo?":{"t":"Prepositions of place: where?","x":"To answer wo? (where?), use in, an, auf, unter, über, vor, hinter, neben, zwischen with the dative.","ex":["The cat is lying under the sofa.","The shelf is between the door and the window.","The picture is hanging above the bed."],"tip":"Ask wo?: Auf dem Tisch. You'll learn these prepositions with the accusative (wohin?) in Unit 16."},"Adjektive nach sein, zu + Adjektiv":{"t":"Adjectives after sein, and zu","x":"An adjective after sein takes no ending. sehr = very, zu = too, viel zu = much too.","ex":["The flat is nice but too expensive.","The room is very bright."],"tip":"sehr = very (positive or neutral), zu = too much."},"Perfekt mit haben":{"t":"Perfect tense with haben","x":"The most common past tense in speech. haben is in second position and the past participle (Partizip II) goes at the end.","ex":["I took photos.","We cooked together."],"tip":"Regular verbs: ge + stem + t: spielen → gespielt, kaufen → gekauft."},"Possessivartikel im Akkusativ":{"t":"Possessives in the accusative","x":"Like ein / einen: the masculine takes -en in the accusative; the others don't change.","ex":["I'm visiting my grandad.","Do you know our son?"],"tip":"euer drops its e when it takes an ending: eure Eltern."},"Berufe: -in, -innen":{"t":"Female job titles","x":"For the feminine form add -in, and -innen in the plural, sometimes with an umlaut.","ex":["teacher (m) → teacher (f) → teachers (f)","doctor (m) → doctor (f)"],"tip":"Kaufmann → Kauf<b>frau</b> (an exception)."},"Perfekt: regelmäßig und unregelmäßig":{"t":"Perfect tense: regular and irregular","x":"Irregular verbs end in -en and sometimes change their vowel. Separable verbs put ge in the middle. Verbs in -ieren and verbs with be-, ver- take no ge.","ex":["I wrote an e-mail.","She called the boss."],"tip":"Learn irregular verbs in threes: schreiben – schrieb – geschrieben."},"Fragewort welch-":{"t":"The question word welch-","x":"welch- = which? Used to ask about a choice. Its endings are like der/das/die.","ex":["Which salad do you like?","Which tomatoes are from Germany?"],"tip":"The answer often uses dies-: Welchen Salat? – Diesen hier."},"Zuerst, dann, danach, zum Schluss":{"t":"Steps: zuerst, dann, danach, zum Schluss","x":"To describe steps (in a recipe, for example). These words take first position, so the verb comes right after them.","ex":["First you have to cut the onions.","Then you boil the water.","Finally you make the sauce."],"tip":"Order: zuerst → dann → danach → zum Schluss."},"Modalverben müssen und dürfen":{"t":"Modal verbs: müssen and dürfen","x":"müssen = must, dürfen = to be allowed. The modal verb is in second position, the infinitive at the end.","ex":["First you have to cut the onions.","You can't park here."],"tip":"nicht müssen = don't have to (not “forbidden”): Du <b>musst nicht</b> kommen."},"Mengenangaben":{"t":"Quantities and packaging","x":"After a quantity, the noun follows directly, without an article.","ex":["a kilo of tomatoes","a bottle of water","200 grams of cheese"],"tip":"Wie viel + uncountable noun: Wie viel Milch? · Wie viele + plural: Wie viele Eier?"},"Perfekt mit sein":{"t":"Perfect tense with sein","x":"Verbs of movement from one place to another and verbs of change of state take sein instead of haben.","ex":["I went to the doctor.","We ran 5 km."],"tip":"bleiben and sein also take sein: Ich bin zu Hause geblieben."},"Modalverb sollen":{"t":"The verb sollen","x":"sollen passes on advice or an order from someone else (the doctor, the boss…), and is used to offer: “shall I…?”.","ex":["The doctor says I should sleep a lot.","Shall I open the window?"],"err0":"Der Arzt sagt, ich muss nicht rauchen. (meaning: not allowed)","tip":"müssen = necessity, sollen = someone else asks or advises, dürfen nicht = forbidden."},"Imperativ: du, ihr, Sie":{"t":"Imperative: du, ihr and Sie","x":"du: drop -st and the pronoun. ihr: the ihr form without the pronoun. Sie: the verb, then Sie.","ex":["Drink lots of water!","Do some exercise! (to a group)"],"tip":"a→ä doesn't happen in the imperative: du schläfst → <b>Schlaf</b> gut!"},"Adjektivendungen im Akkusativ":{"t":"Adjectives before a noun in the accusative","x":"An adjective before a noun takes an ending. After ein/kein/mein in the accusative: masculine -en, feminine -e, neuter -es.","ex":["I'm looking for a warm jumper.","She's wearing an elegant dress."],"tip":"Plural without an article: schwarz<b>e</b> Schuhe, grau<b>e</b> Hosen."},"Demonstrativ: dieser, diese, dieses":{"t":"The demonstrative dieser","x":"dieser = this (specific one). It takes the same endings as der/die/das.","ex":["What do you think of this skirt?","These shoes are comfortable."],"tip":"dieser ends like der: der → dies<b>er</b>, den → dies<b>en</b>."},"Komparativ":{"t":"Comparatives","x":"Adjective + -er + als. Many short adjectives take an umlaut. For equality: genauso … wie.","ex":["Summer is warmer than spring.","Vienna is just as beautiful as Berlin."],"tip":"Irregular ones to learn: gut → besser, viel → mehr, gern → lieber."},"es im Satz: das Wetter":{"t":"es and the weather","x":"To talk about the weather, es is the subject: es regnet, es schneit, es ist kalt. es comes after the verb if the sentence starts with another word.","ex":["It's raining in Rostock.","It's cold in Berlin.","Today it's 25 degrees."],"tip":"Wie ist das Wetter? – Es ist sonnig / Es regnet / Es schneit."},"Modalverb wollen":{"t":"The modal verb wollen","x":"wollen = to want (a wish or a plan). Like the other modal verbs: wollen in second position, infinitive at the end.","ex":["We want to go to the mountains.","Do you want to come along?"],"tip":"ich möchte (polite) ≠ ich will (strong wish or plan)."},"Präpositionen mit Akkusativ: wohin?":{"t":"Where to? in, an, auf, nach + accusative","x":"To answer wohin? (where to?): in, an, auf + accusative. nach with cities and countries without an article.","ex":["I'd like to go to the seaside.","We're going to the mountains.","Are you going to the party today?"],"tip":"an das = ans, in das = ins. Wo? → dative (in der Stadt). Wohin? → accusative (in die Stadt)."},"Personalpronomen im Akkusativ":{"t":"Personal pronouns in the accusative","x":"When a pronoun is the direct object, use its accusative form.","ex":["Will you call me?","Where's my key? Do you have it?","I'll call you (all) this evening."],"tip":"der Schlüssel → ihn, das Buch → es, die Tasche → sie (the pronoun follows the noun's gender)."}},"fr":{"Alphabet und Umlaute":{"t":"Lettres et prononciation","x":"L'allemand se prononce en général comme il s'écrit. Apprends les lettres spéciales ä, ö, ü, ß et les combinaisons importantes, et n'oublie pas que tous les noms prennent une majuscule.","col":["comme un « è » ouvert","comme « eu » dans « deux »","comme le « u » français","un s fort","« aï » / « i » long","« ch » / son guttural ou doux"],"ex":["Comment ça s'écrit ?","Pouvez-vous l'épeler, s'il vous plaît ?"],"tip":"ei se prononce « aï » et ie se prononce « i » : <b>Wein</b> (vin) ≠ <b>Wien</b> (Vienne)."},"Fragewörter":{"t":"Les mots interrogatifs","x":"Les mots interrogatifs se placent en début de phrase, suivis directement du verbe.","col":["qui ?","quoi ?","où ?","d'où ?","où (direction) ?","comment ?","combien ?"],"ex":["Qui est-ce ?","D'où viens-tu ?","Quel est ton numéro de téléphone ?"],"tip":"Pour demander le nom, le numéro ou l'adresse, on utilise <b>wie</b> et non was."},"Präsens: regelmäßige Verben":{"t":"Conjugaison au présent","x":"On enlève -en de l'infinitif et on ajoute une terminaison selon le pronom.","ex":["Je viens de Tunisie.","Où habites-tu ?","Elle apprend l'allemand."],"tip":"Si le radical se termine par t ou d, on ajoute e : du arbeit<b>e</b>st. S'il se termine par s, ß ou z, du prend seulement -t : du heißt."},"W-Fragen und Ja/Nein-Fragen":{"t":"Questions et ordre des mots","x":"Dans une phrase affirmative et dans une question avec un mot interrogatif, le verbe est toujours en deuxième position. Dans une question oui/non, le verbe vient en premier.","ex":["J'apprends l'allemand.","Que fais-tu ?","Parles-tu anglais ?"],"tip":"Si la phrase commence par le temps ou le lieu, le sujet vient juste après le verbe : Heute <b>lerne ich</b>."},"du oder Sie":{"t":"Tutoiement ou vouvoiement : du ou Sie","x":"du pour les amis, la famille, les enfants et entre étudiants. Sie (toujours avec majuscule) pour les inconnus, les professeurs et au travail ; il se conjugue comme le pluriel.","ex":["Comment tu t'appelles ? (familier)","Comment vous appelez-vous ? (poli)","D'où venez-vous, Madame Weber ?"],"tip":"À l'oral de l'examen, utilise <b>Sie</b> avec l'examinateur ; avec ton partenaire, du est possible."},"Artikel: der, die, das":{"t":"Articles et genre","x":"Chaque nom a un genre : masculin der, féminin die, neutre das. Le pluriel est toujours die. Apprends toujours un nom avec son article.","ex":["le stylo, le tableau, le livre","C'est une table."],"tip":"Les noms en -ung, -heit, -keit sont féminins, ceux en -chen sont neutres. Écris chaque nouveau nom d'une couleur différente selon son genre."},"Plural":{"t":"Le pluriel des noms","x":"L'article au pluriel est toujours die. Il n'y a pas une seule règle pour les terminaisons : apprends le pluriel avec le nom.","ex":["une lampe → deux lampes","un livre → trois livres"],"tip":"La plupart des noms féminins prennent -(e)n, les mots étrangers prennent -s. Dans le dictionnaire, le pluriel est noté ainsi : Buch, ¨-er."},"Zahlen":{"t":"Les nombres","x":"De 21 à 99, on dit d'abord l'unité puis la dizaine : einundzwanzig = « un-et-vingt ».","ex":["Mon numéro est …","Ça coûte quarante-cinq euros."],"tip":"Attention : dreißig s'écrit avec ß et non -zig, et sechzehn et siebzehn perdent des lettres."},"Das Verb sein":{"t":"Le verbe sein (être)","x":"Le verbe le plus important de la langue. Il est irrégulier, il faut l'apprendre par cœur.","ex":["Je suis serveur.","C'est mon collègue.","Vous êtes étudiants ?"],"tip":"Pas d'article avec les métiers et les nationalités : Ich bin Lehrer. Er ist Tunesier."},"ein und kein":{"t":"Article indéfini et négation : ein et kein","x":"kein nie un nom indéfini et se décline exactement comme ein.","ex":["C'est un thé ? – Non, ce n'est pas un thé.","Ce ne sont pas des biscuits."],"tip":"ein n'a pas de pluriel, mais kein oui : keine."},"Possessivartikel: mein, dein":{"t":"Les possessifs mein et dein","x":"mein = mon/ma, dein = ton/ta. Ils se déclinent comme ein / kein.","ex":["C'est mon café.","C'est ma cheffe.","C'est ton portable ?"],"tip":"Avec un nom féminin ou pluriel, on ajoute -e : meine Tasse, meine Freunde."},"ich möchte":{"t":"La demande polie : ich möchte","x":"Pour commander au café, au restaurant et dans les magasins. möchte est en deuxième position, suivi d'un nom, ou avec un infinitif à la fin.","ex":["Je voudrais un café, s'il vous plaît.","Que voulez-vous boire ?"],"tip":"ich möchte est plus poli que ich will. Utilise-le toujours au café et à l'examen."},"Akkusativ":{"t":"Le complément d'objet direct (Akkusativ)","x":"Le COD est à l'accusatif. Seul le masculin change : der→den, ein→einen, kein→keinen.","ex":["Je mange une salade.","Nous n'avons pas besoin de sucre.","Il y a un gâteau aux pommes."],"tip":"es gibt, haben, brauchen, essen et nehmen prennent tous l'accusatif."},"nicht oder kein":{"t":"La négation : nicht ou kein","x":"kein nie un nom indéfini ou un nom sans article. nicht nie un verbe, un adjectif ou un nom défini.","ex":["Je ne mange pas de viande.","Je n'aime pas manger de poisson.","La soupe n'est pas chaude."],"tip":"Demande-toi : est-ce que je nie un nom sans der/die/das ? → kein. Sinon → nicht."},"mögen und gern":{"t":"Les goûts : mögen et gern","x":"mögen + nom : aimer quelque chose. gern + verbe : aimer faire quelque chose. gern se place après le verbe.","ex":["J'aime la pizza.","J'aime cuisiner.","Il n'aime pas manger de légumes."],"tip":"gern → lieber → am liebsten : Ich trinke <b>lieber</b> Tee (je préfère le thé)."},"Verben mit Vokalwechsel":{"t":"Les verbes à changement de voyelle","x":"Certains verbes changent de voyelle uniquement avec du et er/sie/es.","ex":["Qu'est-ce que tu prends ?","Elle aime manger du couscous."],"tip":"wir, ihr et sie ne changent pas : wir nehmen, ihr esst."},"Uhrzeit und Zeitangaben":{"t":"L'heure et les rendez-vous","x":"am avec les jours et les moments de la journée, um avec l'heure, von … bis pour une durée, im avec les mois et les saisons.","ex":["Il est sept heures et demie.","Il est trois heures et quart.","Il est dix heures moins le quart."],"tip":"halb acht = 7h30 et non 8h30, car cela veut dire « une demi-heure avant huit heures »."},"Trennbare Verben":{"t":"Les verbes séparables","x":"Certains verbes ont un préfixe qui se sépare et va à la fin de la phrase : an, auf, aus, ein, mit, zu, fern…","ex":["Je me lève à 7 heures.","Quand fais-tu les courses ?","Le soir, nous regardons la télé."],"tip":"Les préfixes be-, ver-, er-, ent-, ge- ne se séparent jamais : verstehen → ich verstehe."},"wann? wie lange? wie oft?":{"t":"Questions de temps : wann, wie lange, wie oft","x":"wann demande quand, wie lange demande combien de temps, et wie oft demande combien de fois.","ex":["Quand as-tu le temps ? – Vendredi.","Combien de temps dure le film ? – Deux heures.","À quelle fréquence vas-tu au cinéma ?"],"tip":"La réponse à wann contient am/um ; la réponse à wie lange est une durée (Stunden, Tage)."},"Possessivartikel":{"t":"Les possessifs (toutes les formes)","x":"mein, dein, sein (son, à lui), ihr (son, à elle), unser, euer, ihr/Ihr. Ils prennent tous les terminaisons de ein.","ex":["C'est notre ville.","Anna et son frère","C'est votre voiture ?"],"tip":"sein si le possesseur est masculin, ihr s'il est féminin. Ihr avec majuscule = votre (poli)."},"Präteritum von sein":{"t":"Le passé : war (sein)","x":"Pour parler du passé, sein s'emploie au prétérit : war (était), même à l'oral.","ex":["Hier, j'étais au musée.","Tu es déjà allé à Berlin ?"],"tip":"Pas de terminaison avec ich et er/sie : ich war, er war. Attention : ihr wart."},"mit und zu + Dativ":{"t":"mit et zu + datif","x":"Après mit (avec, en) et zu (à, chez), le nom est toujours au datif : der et das deviennent dem, die devient der.","ex":["Je prends le bus.","Comment aller à la gare centrale ?","Ici, vous allez à gauche jusqu'à l'arrêt."],"tip":"zu Fuß = à pied (sans article)."},"Häufigkeitsadverbien":{"t":"Les adverbes de fréquence","x":"Pour dire combien de fois, du plus fréquent au moins fréquent.","ex":["Je joue souvent au foot.","Il ne va jamais au théâtre."],"tip":"Ils peuvent commencer la phrase ; le verbe vient alors juste après : <b>Manchmal lese</b> ich abends."},"Ordnungszahlen":{"t":"Les nombres ordinaux","x":"Pour les étages et les dates : de 1 à 19 on ajoute -te, à partir de 20 -ste. Irréguliers : erste, dritte, siebte.","ex":["Le bureau est au troisième étage.","Aujourd'hui, c'est le premier avril."],"tip":"Après in der, la terminaison est -en : in der ersten Etage, in der zweiten Etage."},"Lokale Präpositionen mit Dativ (wo?)":{"t":"Prépositions de lieu avec le datif","x":"Pour répondre à wo? (où ?), on utilise les prépositions de lieu avec le datif.","ex":["Le portable est sur la table.","La lampe est à côté de la porte.","Je travaille au bureau."],"tip":"in dem = <b>im</b>, an dem = <b>am</b>. Au datif, le féminin devient <b>der</b>."},"Präteritum von haben":{"t":"Le passé : hatte (et war)","x":"Dans l'unité 6, tu as appris war. Maintenant hatte (avait). À l'oral, on les utilise à la place du Perfekt.","ex":["Hier, je n'avais pas le temps.","On s'est bien amusés."],"tip":"war et hatte ensemble : Ich war krank und hatte Fieber (j'étais malade et j'avais de la fièvre)."},"Modalverb können":{"t":"Le verbe können","x":"können = pouvoir / savoir faire. Le modal est en deuxième position et le verbe principal va à la fin, à l'infinitif.","ex":["Je sais bien nager.","Tu sais jouer de la guitare ?"],"tip":"Pas de terminaison avec ich et er/sie : ich kann, er kann."},"Pronomen man":{"t":"Le pronom man","x":"man = on, les gens en général. Le verbe se conjugue comme avec er/sie/es.","ex":["Au Tyrol, on peut bien faire de la randonnée.","Ici, on parle allemand."],"tip":"Ne confonds pas man (pronom) et der Mann (l'homme)."},"Komposita":{"t":"Les noms composés","x":"L'allemand forme de nouveaux noms en assemblant des mots. Le dernier mot est la base et donne l'article.","ex":["la table de cuisine","la baignoire"],"tip":"L'article vient toujours du dernier mot."},"Präpositionen mit Dativ: wo?":{"t":"Prépositions de lieu : où ?","x":"Pour répondre à wo? (où ?), on utilise in, an, auf, unter, über, vor, hinter, neben, zwischen avec le datif.","ex":["Le chat est couché sous le canapé.","L'étagère est entre la porte et la fenêtre.","Le tableau est accroché au-dessus du lit."],"tip":"Demande wo? : Auf dem Tisch. Tu verras ces prépositions avec l'accusatif (wohin?) dans l'unité 16."},"Adjektive nach sein, zu + Adjektiv":{"t":"L'adjectif après sein, et zu","x":"Après sein, l'adjectif ne prend pas de terminaison. sehr = très, zu = trop, viel zu = beaucoup trop.","ex":["L'appartement est beau mais trop cher.","La chambre est très claire."],"tip":"sehr = très (positif ou neutre), zu = trop."},"Perfekt mit haben":{"t":"Le Perfekt avec haben","x":"Le passé le plus utilisé à l'oral. haben est en deuxième position et le participe passé (Partizip II) va à la fin.","ex":["J'ai pris des photos.","Nous avons cuisiné ensemble."],"tip":"Verbes réguliers : ge + radical + t : spielen → gespielt, kaufen → gekauft."},"Possessivartikel im Akkusativ":{"t":"Les possessifs à l'accusatif","x":"Comme ein / einen : le masculin prend -en à l'accusatif, le reste ne change pas.","ex":["Je rends visite à mon grand-père.","Tu connais notre fils ?"],"tip":"euer perd son e quand il prend une terminaison : eure Eltern."},"Berufe: -in, -innen":{"t":"Les métiers au féminin","x":"Pour le féminin, on ajoute -in, et -innen au pluriel, parfois avec un umlaut.","ex":["enseignant → enseignante → enseignantes","médecin (homme) → médecin (femme)"],"tip":"Kaufmann → Kauf<b>frau</b> (exception)."},"Perfekt: regelmäßig und unregelmäßig":{"t":"Le Perfekt : réguliers et irréguliers","x":"Les verbes irréguliers finissent en -en et changent parfois de voyelle. Les verbes séparables mettent ge au milieu. Les verbes en -ieren et avec be-, ver- n'ont pas de ge.","ex":["J'ai écrit un e-mail.","Elle a appelé le chef."],"tip":"Apprends les verbes irréguliers par trois : schreiben – schrieb – geschrieben."},"Fragewort welch-":{"t":"Le mot interrogatif welch-","x":"welch- = quel, quelle ? Pour demander un choix. Ses terminaisons sont comme der/das/die.","ex":["Quelle salade aimes-tu ?","Quelles tomates viennent d'Allemagne ?"],"tip":"La réponse utilise souvent dies- : Welchen Salat? – Diesen hier."},"Zuerst, dann, danach, zum Schluss":{"t":"Les étapes : zuerst, dann, danach, zum Schluss","x":"Pour décrire des étapes (une recette par exemple). Ces mots se placent en première position, donc le verbe vient juste après.","ex":["D'abord, tu dois couper les oignons.","Ensuite, tu fais bouillir l'eau.","Pour finir, tu prépares la sauce."],"tip":"Ordre : zuerst → dann → danach → zum Schluss."},"Modalverben müssen und dürfen":{"t":"Verbes de modalité : müssen et dürfen","x":"müssen = devoir, dürfen = avoir le droit. Le modal en deuxième position, l'infinitif à la fin.","ex":["D'abord, tu dois couper les oignons.","Il est interdit de se garer ici."],"tip":"nicht müssen = ne pas être obligé (et non « interdit ») : Du <b>musst nicht</b> kommen."},"Mengenangaben":{"t":"Les quantités et emballages","x":"Après une quantité, le nom suit directement, sans article.","ex":["un kilo de tomates","une bouteille d'eau","200 grammes de fromage"],"tip":"Wie viel + nom indénombrable : Wie viel Milch? · Wie viele + pluriel : Wie viele Eier?"},"Perfekt mit sein":{"t":"Le Perfekt avec sein","x":"Les verbes de déplacement d'un lieu à un autre et les verbes de changement d'état prennent sein au lieu de haben.","ex":["Je suis allé chez le médecin.","Nous avons couru 5 km."],"tip":"bleiben et sein prennent aussi sein : Ich bin zu Hause geblieben."},"Modalverb sollen":{"t":"Le verbe sollen","x":"sollen transmet un conseil ou un ordre venant d'une autre personne (le médecin, le chef…). On l'utilise aussi pour proposer quelque chose : « Est-ce que je… ? ».","ex":["Le médecin dit que je dois beaucoup dormir.","J'ouvre la fenêtre ?"],"err0":"Der Arzt sagt, ich muss nicht rauchen. (sens : interdit)","tip":"müssen = nécessité, sollen = quelqu'un d'autre demande ou conseille, dürfen nicht = interdit."},"Imperativ: du, ihr, Sie":{"t":"L'impératif : du, ihr et Sie","x":"du : on enlève -st et le pronom. ihr : la forme de ihr sans le pronom. Sie : le verbe, puis Sie.","ex":["Bois beaucoup d'eau !","Faites du sport !"],"tip":"Pas de a→ä à l'impératif : du schläfst → <b>Schlaf</b> gut!"},"Adjektivendungen im Akkusativ":{"t":"L'adjectif devant le nom à l'accusatif","x":"Devant un nom, l'adjectif prend une terminaison. Après ein/kein/mein à l'accusatif : masculin -en, féminin -e, neutre -es.","ex":["Je cherche un pull chaud.","Elle porte une robe élégante."],"tip":"Au pluriel sans article : schwarz<b>e</b> Schuhe, grau<b>e</b> Hosen."},"Demonstrativ: dieser, diese, dieses":{"t":"Le démonstratif dieser","x":"dieser = ce/cette (celui-ci). Il se décline comme der/die/das.","ex":["Comment tu trouves cette jupe ?","Ces chaussures sont confortables."],"tip":"dieser se termine comme der : der → dies<b>er</b>, den → dies<b>en</b>."},"Komparativ":{"t":"Le comparatif","x":"Adjectif + -er + als. Beaucoup d'adjectifs courts prennent un umlaut. Pour l'égalité : genauso … wie.","ex":["L'été est plus chaud que le printemps.","Vienne est aussi belle que Berlin."],"tip":"Irréguliers à retenir : gut → besser, viel → mehr, gern → lieber."},"es im Satz: das Wetter":{"t":"es et la météo","x":"Pour parler du temps, es est le sujet : es regnet, es schneit, es ist kalt. es vient après le verbe si la phrase commence par un autre mot.","ex":["Il pleut à Rostock.","Il fait froid à Berlin.","Aujourd'hui, il fait 25 degrés."],"tip":"Wie ist das Wetter? – Es ist sonnig / Es regnet / Es schneit."},"Modalverb wollen":{"t":"Le verbe de modalité wollen","x":"wollen = vouloir (un souhait ou un projet). Comme les autres modaux : wollen en deuxième position, l'infinitif à la fin.","ex":["Nous voulons aller à la montagne.","Tu veux venir avec nous ?"],"tip":"ich möchte (poli) ≠ ich will (envie forte ou projet)."},"Präpositionen mit Akkusativ: wohin?":{"t":"Vers où ? in, an, auf, nach + accusatif","x":"Pour répondre à wohin? (vers où ?) : in, an, auf + accusatif. nach avec les villes et les pays sans article.","ex":["Je voudrais aller à la mer.","Nous allons à la montagne.","Tu vas à la fête aujourd'hui ?"],"tip":"an das = ans, in das = ins. Wo? → datif (in der Stadt). Wohin? → accusatif (in die Stadt)."},"Personalpronomen im Akkusativ":{"t":"Les pronoms personnels à l'accusatif","x":"Quand le pronom est complément d'objet direct, on utilise sa forme à l'accusatif.","ex":["Tu m'appelles ?","Où est ma clé ? Tu l'as ?","Je vous appelle ce soir."],"tip":"der Schlüssel → ihn, das Buch → es, die Tasche → sie (le pronom suit le genre du nom)."}}};

{"u":1,"ar":"الجملة الفرعية مع dass","de":"Nebensätze mit dass","x":"<b>dass</b> تعني «أنّ». نستعملها بعد أفعال مثل hören و glauben و hoffen و wissen لننقل خبراً أو رأياً. في الجملة الفرعية يذهب الفعل المصرَّف إلى <b>آخر الجملة</b>، وقبل dass نضع دائماً فاصلة.","rule":"Hauptsatz<b>,</b> <b>dass</b> + … + <b>Verb am Ende</b>","ex":[["Ich habe gehört, <mark>dass</mark> du jetzt in Hamburg <mark>arbeitest</mark>.","سمعتُ أنّك تعمل الآن في هامبورغ."],["Ich hoffe, <mark>dass</mark> du zum Klassentreffen <mark>kommst</mark>.","آمل أن تأتي إلى لقاء زملاء الدراسة."],["Ich freue mich, <mark>dass</mark> du gekommen <mark>bist</mark>.","أنا سعيد لأنّك أتيت."]],"err":["Ich weiß, dass er kommt morgen.","Ich weiß, dass er morgen kommt."],"tip":"في الماضي التام يأتي الفعل المساعد في الآخر: …, dass er geheiratet <b>hat</b>.","qz":[["Ich glaube, dass sie heute ___.",["kommt nicht","nicht kommt","nicht kommen"],1],["Weißt du schon, dass Patrick ___?",["hat geheiratet","geheiratet hat","heiratet hat"],1],["Wo steht das Komma?",["Ich hoffe dass, du kommst.","Ich hoffe, dass du kommst.","Ich, hoffe dass du kommst."],1]]},
{"u":1,"ar":"الضمائر الانعكاسية في حالة النصب","de":"Reflexivpronomen im Akkusativ","x":"بعض الأفعال تحتاج ضميراً يعود على الفاعل نفسه: sich freuen، sich treffen، sich anmelden. الضمائر مثل ضمائر النصب العادية، إلا مع er/es/sie و sie/Sie فنقول <b>sich</b>.","tbl":[["","Akkusativ","reflexiv"],["ich","mich","mich"],["du","dich","dich"],["er/es/sie","ihn/es/sie","<b>sich</b>"],["wir","uns","uns"],["ihr","euch","euch"],["sie/Sie","sie/Sie","<b>sich</b>"]],"ex":[["Patrick <mark>freut sich</mark> auf das Klassentreffen.","باتريك فرحان بلقاء زملاء الدراسة."],["Treffen wir <mark>uns</mark> in Gotha?","هل نلتقي في غوتا؟"],["Mascha zieht <mark>sich</mark> an. – Die Mutter zieht <mark>sie</mark> an.","ماشا تلبس ملابسها. – الأمّ تُلبسها."]],"err":["Er hat ihn schon angemeldet. (= er selbst)","Er hat sich schon angemeldet."],"tip":"Er zieht <b>sich</b> an = يلبس هو نفسه. Er zieht <b>ihn</b> an = يُلبس شخصاً آخر.","qz":[["Freust du ___ auf die Ferien?",["dir","dich","sich"],1],["Wir haben ___ 10 Jahre nicht gesehen.",["sich","euch","uns"],2],["Die Kinder ziehen ___ an.",["sich","ihnen","sie selbst"],0]]},
{"u":1,"ar":"إضافة s إلى الأسماء (الملكية)","de":"Genitiv-s bei Namen","x":"لنقول «صديق باتريك» نضيف <b>s</b> إلى الاسم ونضعه قبل الشيء المملوك: Patricks Freund. لا نستعمل أداة تعريف ولا فاصلة عليا ’ . هذا يساوي: der Freund von Patrick.","rule":"<b>Name + s</b> + Nomen (ohne Artikel, ohne Apostroph)","ex":[["Katta und Basti sind <mark>Patricks</mark> Freunde.","كاتا وباستي صديقا باتريك."],["Ist das <mark>Lottes</mark> Motorroller?","هل هذا السكوتر الخاص بلوته؟"],["Ich habe <mark>Manus</mark> Handynummer nicht.","ليس لديّ رقم هاتف مانو."]],"err":["Das ist die Patrick's Freundin.","Das ist Patricks Freundin."],"tip":"إذا انتهى الاسم بـ s أو x أو z نكتب فاصلة عليا فقط: Max<b>’</b> Bruder.","qz":[["Das ist das Auto von Anna. = Das ist ___ Auto.",["Annas","Anna's","der Anna"],0],["Wie sagt man es richtig?",["die Lottes Wohnung","Lottes Wohnung","Lotte's Wohnung"],1],["___ Bruder wohnt in Berlin. (von Max)",["Maxs","Max'","Maxes"],1]]},
{"u":1,"ar":"الأداتان noch و schon","de":"Partikeln noch und schon","x":"<b>schon</b> تعني «سبق / من قبل / بالفعل» وترتبط بالزمن. <b>noch</b> تعني «ما زال» أو «أيضاً / مرّة أخرى». جواب schon بالنفي هو <b>noch nicht</b>، وعكس noch هو <b>nicht mehr</b>.","tbl":[["schon mal …?","هل سبق أن…؟"],["noch nicht","ليس بعد"],["schon oft","مرّات عديدة"],["noch einmal","مرّة أخرى"],["noch ein/eine …","… آخر / إضافي"],["nicht mehr","لم يعد"]],"ex":[["Warst du <mark>schon</mark> mal in Deutschland? – Nein, <mark>noch nicht</mark>.","هل سبق أن كنت في ألمانيا؟ – لا، ليس بعد."],["Ich habe <mark>noch</mark> eine Frage.","لديّ سؤال آخر."],["Wo ist Benni? – Er ist <mark>noch</mark> im Büro.","أين بيني؟ – ما زال في المكتب."]],"err":["Hast du schon gegessen? – Nein, schon nicht.","Hast du schon gegessen? – Nein, noch nicht."],"tip":"تعلّم هذه الكلمات دائماً داخل جُمل، لا وحدها.","qz":[["Hast du schon mal Tennis gespielt? – Ja, ___ oft.",["noch","schon","nicht"],1],["Musst du dich noch anmelden? – Nein, das habe ich ___ gemacht.",["noch","schon","noch nicht"],1],["Ich habe Durst. ___ ein Wasser, bitte!",["Schon","Noch","Nicht mehr"],1]]},
{"u":2,"ar":"الجملة الفرعية مع weil","de":"Nebensätze mit weil","x":"<b>weil</b> تعني «لأنّ» وتجيب عن السؤال <b>warum?</b>. الفعل المصرَّف يذهب إلى آخر الجملة، وقبل weil فاصلة.","rule":"Hauptsatz<b>,</b> <b>weil</b> + … + <b>Verb am Ende</b>","ex":[["Sascha fährt lieber mit dem Auto, <mark>weil</mark> die Fahrt mit dem Bus länger <mark>dauert</mark>.","ساشا يفضّل السفر بالسيارة لأنّ الرحلة بالحافلة تستغرق وقتاً أطول."],["Noah fährt mit dem Bus, <mark>weil</mark> das billiger <mark>ist</mark>.","نوح يسافر بالحافلة لأنّ ذلك أرخص."],["Warum lernst du Deutsch? – <mark>Weil</mark> ich in Österreich arbeiten <mark>möchte</mark>.","لماذا تتعلّم الألمانية؟ – لأنّني أريد العمل في النمسا."]],"err":["Ich nehme das Rad, weil es ist schneller.","Ich nehme das Rad, weil es schneller ist."],"tip":"مع فعل مساعد (Modalverb) يأتي الفعل المساعد في الآخر: …, weil ich arbeiten <b>möchte</b>.","qz":[["Ich komme nicht, weil ich krank ___.",["bin","habe","sein"],0],["Er bleibt zu Hause, weil ___.",["es regnet","regnet es","es regnen"],0],["Sie nimmt den Zug, weil sie nicht Auto fahren ___.",["kann","können","kannst"],0]]},
{"u":2,"ar":"صيغة التفضيل مع am","de":"Superlativ mit am","x":"لنقول «الأسرع / الأفضل» بعد الفعل نستعمل <b>am + صفة + sten</b>: am schnellsten. صفات قصيرة كثيرة تأخذ Umlaut (groß → am größten)، وبعد d / t / s / ß / z نضيف e: am ältesten. وهناك صيغ شاذّة يجب حفظها.","tbl":[["","Komparativ","Superlativ"],["billig","billiger","am billig<b>sten</b>"],["schnell","schneller","am schnell<b>sten</b>"],["groß","größer","am größ<b>ten</b>"],["alt","älter","am ält<b>esten</b>"],["gern","lieber","am <b>liebsten</b>"],["gut","besser","am <b>besten</b>"],["viel","mehr","am <b>meisten</b>"],["hoch","höher","am <b>höchsten</b>"]],"ex":[["Carina nimmt <mark>am liebsten</mark> das Fahrrad.","كارينا تفضّل الدراجة أكثر من كلّ شيء."],["Mit dem Fahrrad ist es <mark>am praktischsten</mark>.","بالدراجة هو الأكثر عملية."],["Der Zug ist schnell, aber das Flugzeug ist <mark>am schnellsten</mark>.","القطار سريع، لكنّ الطائرة هي الأسرع."]],"err":["Das Fahrrad ist am billigste.","Das Fahrrad ist am billigsten."],"tip":"احفظ الشواذ: gern – lieber – am liebsten · gut – besser – am besten · viel – mehr – am meisten.","qz":[["Ich trinke ___ Tee. (gern → Superlativ)",["am gernsten","am liebsten","am besten"],1],["Im Sommer ist es hier ___.",["am heißesten","am heißten","am heißsten"],0],["Wer läuft ___? (schnell)",["am schnellsten","am schneller","am schnellste"],0]]},
{"u":2,"ar":"الكلمات المركّبة: اسم + صفة","de":"Komposita: Nomen + Adjektiv","x":"بالألمانية نستطيع أن نجمع اسماً وصفة في كلمة واحدة. الكلمة الأخيرة هي الأساس، فالكلمة الجديدة <b>صفة</b> وتُكتب بحرف صغير: fahrradfreundlich = مناسبة للدرّاجات.","tbl":[["das Fahrrad + freundlich","fahrradfreundlich"],["die Umwelt + freundlich","umweltfreundlich"],["der Fußgänger + freundlich","fußgängerfreundlich"],["die Kinder + freundlich","kinderfreundlich"]],"ex":[["Münster ist eine <mark>fahrradfreundliche</mark> Stadt.","مونستر مدينة صديقة للدرّاجات."],["Das Fahrrad ist <mark>umweltfreundlich</mark>.","الدراجة صديقة للبيئة."],["Die Altstadt ist <mark>fußgängerfreundlich</mark>.","المدينة القديمة مناسبة للمشاة."]],"err":["Das ist eine Umweltfreundliche Stadt.","Das ist eine umweltfreundliche Stadt."],"tip":"إذا كانت الكلمة الأخيرة صفة، فالمركّب كلّه صفة ← حرف صغير.","qz":[["Ein Hotel, das gut für Kinder ist, ist …",["kinderfreundlich","Kinderfreundlich","freundlichkinder"],0],["Was ist das letzte Wort im Kompositum „umweltfreundlich“?",["Umwelt","freundlich","welt"],1],["Die Stadt hat viele Radwege. Sie ist …",["fahrradfreundlich","fahrradfreundlichkeit","Fahrradfreundlich"],0]]},
{"u":3,"ar":"الصفات بدون أداة (رفع / نصب)","de":"Adjektive ohne Artikel (Nom./Akk.)","x":"عندما لا توجد أداة قبل الاسم (كثيراً في الإعلانات)، تأخذ الصفة نهاية الأداة: der → <b>-er</b>، das → <b>-es</b>، die → <b>-e</b>. في النصب المذكّر: den → <b>-en</b>.","tbl":[["","der","das","die","Plural"],["Nominativ","groß<b>er</b> Balkon","groß<b>es</b> Sofa","groß<b>e</b> Terrasse","groß<b>e</b> Zimmer"],["Akkusativ","groß<b>en</b> Balkon","groß<b>es</b> Sofa","groß<b>e</b> Terrasse","groß<b>e</b> Zimmer"]],"ex":[["<mark>Schöne</mark> Wohnung sucht <mark>neue</mark> Mieter.","شقة جميلة تبحث عن مستأجرين جدد."],["Verkaufe <mark>schönes</mark> Auto.","أبيع سيارة جميلة."],["Wir suchen <mark>ruhigen</mark> Nachbarn.","نبحث عن جار هادئ."]],"err":["Verkaufe schöner Auto.","Verkaufe schönes Auto."],"tip":"قارن مع الأداة: d<b>er</b> → groß<b>er</b>, d<b>as</b> → groß<b>es</b>, d<b>en</b> → groß<b>en</b>.","qz":[["Verkaufe ___ Fahrrad. (alt)",["alter","altes","alten"],1],["Suche ___ Mitbewohner. (nett, Akk.)",["netter","nettes","netten"],2],["___ Kaffee schmeckt gut. (heiß)",["Heißer","Heißes","Heißen"],0]]},
{"u":3,"ar":"تحويل الفعل إلى اسم: das Grillen","de":"Nomen aus Verben: das Grillen","x":"نصنع اسماً من أي فعل بأخذ المصدر وكتابته بحرف كبير. الأداة دائماً <b>das</b>. نستعمل ذلك كثيراً في القوانين واللافتات (Hausordnung).","tbl":[["wohnen","<b>das</b> Wohnen"],["grillen","<b>das</b> Grillen"],["spielen","<b>das</b> Spielen"],["abstellen","<b>das</b> Abstellen"]],"ex":[["<mark>Das Grillen</mark> auf dem Balkon ist verboten.","الشواء على الشرفة ممنوع."],["<mark>Das Spielen</mark> im Treppenhaus ist nicht erlaubt.","اللعب في الدرج غير مسموح."],["<mark>Das Abstellen</mark> von Fahrrädern im Keller ist erlaubt.","ركن الدرّاجات في القبو مسموح."]],"err":["Die Grillen auf dem Balkon ist verboten.","Das Grillen auf dem Balkon ist verboten."],"tip":"المصدر كاسم = <b>das</b> + حرف كبير: das Lesen، das Kochen.","qz":[["___ Rauchen ist hier verboten.",["Der","Die","Das"],2],["Wie schreibt man es richtig?",["das schwimmen","das Schwimmen","Das schwimmen"],1],["Aus „lernen“ wird …",["die Lernung","das Lernen","der Lerner"],1]]},
{"u":3,"ar":"الأفعال الانعكاسية مع حرف جرّ","de":"Reflexive Verben mit Präposition","x":"كثير من الأفعال الانعكاسية تأتي مع حرف جرّ ثابت. احفظ الفعل + الضمير + حرف الجر معاً. مع هذه الأفعال يأتي بعد حرف الجر اسم في حالة <b>النصب</b>.","tbl":[["sich freuen <b>auf</b> + Akk.","يفرح بشيء قادم"],["sich freuen <b>über</b> + Akk.","يفرح بشيء حصل"],["sich ärgern <b>über</b> + Akk.","يغضب من"],["sich interessieren <b>für</b> + Akk.","يهتمّ بـ"],["sich erinnern <b>an</b> + Akk.","يتذكّر"],["sich informieren <b>über</b> + Akk.","يستعلم عن"]],"ex":[["Wir <mark>freuen uns auf</mark> das Wochenende.","نحن متشوّقون لعطلة نهاية الأسبوع."],["Ich <mark>ärgere mich über</mark> meine Nachbarn.","أغضب من جيراني."],["Sie <mark>interessiert sich für</mark> Literatur.","هي مهتمّة بالأدب."]],"err":["Ich interessiere mich an Musik.","Ich interessiere mich für Musik."],"tip":"freuen <b>auf</b> = لشيء في المستقبل، freuen <b>über</b> = لشيء حصل أو موجود الآن.","qz":[["Ich erinnere mich nicht ___ unsere Lehrer.",["für","an","über"],1],["Er ärgert sich ___ den Lärm.",["über","auf","an"],0],["Die Kinder freuen sich ___ die Ferien (nächste Woche).",["über","auf","für"],1]]},
{"u":3,"ar":"الفعل المساعد dürfen","de":"Modalverb dürfen","x":"<b>dürfen</b> = «مسموح لـ». <b>nicht dürfen</b> = «ممنوع». مثل باقي الأفعال المساعدة: ich و er بدون نهاية، والفعل الثاني يأتي في المصدر آخر الجملة.","tbl":[["","Präsens"],["ich","darf"],["du","darfst"],["er/es/sie","darf"],["wir","dürfen"],["ihr","dürft"],["sie/Sie","dürfen"]],"ex":[["Hier <mark>dürfen</mark> Sie nicht parken. Das ist verboten!","ممنوع أن تركن هنا. هذا محظور!"],["Wo <mark>darf</mark> man hier rauchen?","أين يُسمح بالتدخين هنا؟"],["Tut mir leid, das <mark>darf</mark> ich nicht essen.","آسف، لا يُسمح لي بأكل هذا."]],"err":["Du darfst hier nicht zu parken.","Du darfst hier nicht parken."],"tip":"nicht dürfen = verboten (ممنوع)، أمّا nicht müssen = ليس ضرورياً.","qz":[["Hier ___ man nicht rauchen.",["darf","dürft","darfst"],0],["___ ich das Fenster öffnen?",["Darf","Dürfe","Darft"],0],["Kinder ___ hier nicht spielen.",["darf","dürfen","dürft"],1]]},
{"u":4,"ar":"لماذا (لأيّ غرض)؟ – zum …","de":"Wozu? – Zum …","x":"نسأل عن الغرض بـ <b>Wozu?</b> ونجيب بـ <b>zum</b> + فعل محوَّل إلى اسم (بحرف كبير): zum Telefonieren = للاتصال. zum = zu + dem، لأنّ الاسم من فعل أداته das.","rule":"<b>zum</b> (= zu dem) + nominalisiertes Verb: zum Telefonieren","ex":[["<mark>Wozu</mark> hast du ein Handy? – <mark>Zum Telefonieren</mark>.","لماذا لديك هاتف؟ – للاتصال."],["Ich benutze das Tablet <mark>zum Lesen</mark>.","أستعمل الجهاز اللوحي للقراءة."],["Ich brauche das Handy meistens <mark>zum Schreiben</mark> von Nachrichten.","أحتاج الهاتف غالباً لكتابة الرسائل."]],"err":["Ich brauche das Handy zu telefonieren.","Ich brauche das Handy zum Telefonieren."],"tip":"zum + Verb كاسم: zum Kochen، zum Spielen، zum Fotografieren.","qz":[["Wozu brauchst du den Laptop? – ___ Arbeiten.",["Zur","Zum","Für"],1],["Ich benutze die App ___ Lernen.",["zum","zu","zur"],0],["Wie fragt man nach dem Zweck?",["Wozu?","Wann?","Woher?"],0]]},
{"u":4,"ar":"السؤال غير المباشر مع ob","de":"Indirekte Fragen mit ob","x":"عندما نحوّل سؤالاً جوابه «نعم/لا» إلى سؤال غير مباشر نستعمل <b>ob</b> (= هل). بعدها يذهب الفعل إلى آخر الجملة. هذا أكثر تهذيباً: Können Sie mir sagen, ob …?","rule":"Ja/Nein-Frage → <b>ob</b> + … + <b>Verb am Ende</b>","ex":[["Weißt du, <mark>ob</mark> wir am Montag einen Test <mark>schreiben</mark>?","هل تعرف إن كنّا سنكتب اختباراً يوم الاثنين؟"],["Können Sie mir sagen, <mark>ob</mark> der Kurs am Freitag <mark>stattfindet</mark>?","هل يمكنك أن تقول لي إن كانت الدورة ستُقام يوم الجمعة؟"],["Ich frage mich, <mark>ob</mark> du wirklich Zeit für ein Haustier <mark>hast</mark>.","أتساءل إن كان لديك حقاً وقت لحيوان أليف."]],"err":["Weißt du, ob kommt der Bus?","Weißt du, ob der Bus kommt?"],"tip":"ob = هل (السؤال نعم/لا)، dass = أنّ (خبر مؤكّد).","qz":[["Fährt der Bus zum Bahnhof? → Wissen Sie, ___?",["ob der Bus zum Bahnhof fährt","dass der Bus zum Bahnhof fährt","ob fährt der Bus zum Bahnhof"],0],["Ich weiß nicht, ___ er heute kommt.",["ob","dass","wenn"],0],["Kannst du mir sagen, ob das Handy ___?",["funktioniert","funktionieren","funktioniert es"],0]]},
