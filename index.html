Grillen (unité 3) : un verbe employé comme nom = das."},"Verben mit Dativ und Akkusativ":{"t":"Les verbes à datif et accusatif","x":"Des verbes comme <b>schenken, geben, zeigen, bringen, leihen, schicken, erklären, wünschen</b> ont une personne au datif (à qui ?) et une chose à l'accusatif (quoi ?). Ordre habituel : <b>datif avant accusatif</b>.","ex":["Markus offre souvent des fleurs à sa mère.","Mon père leur montre son nouveau portable.","Rapporte le journal à ton père !"],"tip":"La personne (datif) d'abord, puis la chose (accusatif) : Ich gebe <b>dir</b> <b>das Buch</b>."},"Genitiv: des und der":{"t":"Le génitif : des et der","x":"Le génitif exprime l'appartenance ou un lien entre deux noms (« l'idée de l'auteur »). Masculin et neutre : <b>des</b> + le nom prend <b>-s</b> ou -es. Féminin et pluriel : <b>der</b>. À l'oral, on dit souvent von + datif.","ex":["C'est l'idée de l'auteur.","Quel est le prix du portable ?","Un tiers des Allemands vit seul."],"tip":"des + -s au masculin et au neutre : des Vater<b>s</b>, des Kind<b>es</b>."},"Relativsätze mit Präposition + Dativ":{"t":"Les relatives avec préposition + datif","x":"Si la relative contient une préposition comme in ou mit, la préposition se place <b>devant</b> le pronom relatif. Après in/mit (datif) : masculin et neutre <b>dem</b>, féminin <b>der</b>, pluriel <b>denen</b> (pas den !).","ex":["Nous allons dans un village où vivent 582 personnes.","C'est le tracteur avec lequel il travaille aux champs.","Lisa et Tom ont deux voitures avec lesquelles ils vont en ville."],"tip":"Pronom relatif au datif pluriel = <b>denen</b>."},"Passiv im Präteritum":{"t":"Le passif au prétérit","x":"Pour dire que quelque chose <b>a été fait</b> dans le passé, on utilise <b>wurde / wurden</b> + participe II à la fin. wurde est aussi le prétérit de werden : Sie wurde 80 = elle a eu 80 ans.","ex":["Le portable a été allumé.","La batterie a été chargée.","Les maisons ont été construites en 1850."],"tip":"Présent : wird gebaut. Prétérit : <b>wurde</b> gebaut."},"Sätze verbinden mit denn":{"t":"Relier des phrases avec denn","x":"<b>denn</b> signifie « car », comme weil, mais il ne change pas l'ordre des mots : après denn viennent le sujet puis le verbe en <b>position 2</b>, comme dans une phrase normale. Il y a une virgule avant denn.","ex":["Erin aime son travail, car le salaire est bon.","Matteo n'aime pas son travail, car il s'ennuie souvent.","Je reste à la maison, car je suis malade."],"tip":"weil → verbe à la fin. denn → ordre normal : denn ich <b>bin</b> krank."},"nicht nur …, sondern auch …":{"t":"nicht nur …, sondern auch …","x":"On utilise <b>nicht nur …, sondern auch …</b> = « non seulement …, mais aussi … » pour insister sur une deuxième information. Il y a toujours une virgule avant sondern auch.","ex":["J'ai non seulement une moto, mais aussi une voiture.","Elle n'achète pas seulement des aliments, mais aussi des boissons.","Elle a étudié non seulement les lettres allemandes, mais aussi les maths."],"tip":"Ne dites pas aber auch, mais <b>sondern auch</b>."}}};

function testBox(title,sub,pool,max,cls,elId){
  const u=S();
  const box=document.createElement("section");box.className="plateau"+(cls?" "+cls:"");box.id=elId;
  const intro=()=>{box.innerHTML=`<div class="ph"><div><strong>${title}</strong><div class="sub">${sub}</div></div><button type="button" class="btn">${u.start}</button></div>`;
    box.querySelector(".btn").onclick=start};
  const start=()=>{
    const qs=shuffle(pool).slice(0,max);let i=0,right=0;const wrong=[];
    const step=()=>{
      if(i>=qs.length){
        const pct=Math.round(right/qs.length*100);
        box.innerHTML=`<div class="pq result"><div class="big">${right} / ${qs.length}</div><div>${pct>=80?u.r80:pct>=60?u.r60:u.rLow}</div>${wrong.length?`<div class="sub" style="color:var(--muted);font-size:.88rem">${uniq(wrong).join(" · ")}</div>`:""}<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button type="button" class="btn">${u.retry}</button><button type="button" class="btn ghost">${u.close}</button></div></div>`;
        const [a,b]=box.querySelectorAll("button");a.onclick=start;b.onclick=intro;return;
      }
      const q=qs[i];
      box.innerHTML=`<div class="pq"><div class="meta"><span>${title}</span><span>${i+1} / ${qs.length}</span></div><div class="src">${loc(q.t).title} · ${uLabel(q.t.u)}</div></div>`;
      const pq=box.querySelector(".pq");
      pq.appendChild(quizItem(q.q,i+1,ok=>{if(ok)right++;else wrong.push(loc(q.t).title);
        const nx=document.createElement("button");nx.type="button";nx.className="btn";nx.style.justifySelf="start";nx.textContent=i+1<qs.length?u.next:u.result;
        nx.onclick=()=>{i++;step()};pq.appendChild(nx);nx.focus({preventScroll:true})}));
    };
    step();
  };
  intro();return box;
}

    <div class="actrow"><button type="button" class="btn" id="wAll">der / die / das · ${LEVEL}</button><button type="button" class="btn ghost" id="wWeak" ${wk?"":"disabled"}>${wk?u.quickWeak(wk):u.tWeak+" (0)"}</button></div></div>`);
  UKEYS.forEach((k,ix)=>{const U=UNITS[ix],ns=NL.filter(x=>x.u===k);if(!ns.length)return;
    const n=ns.filter(x=>isM(x.id)).length;
    list.insertAdjacentHTML("beforeend",unitHead(U,`<span class="ucount">${n}/${ns.length}</span>`));
    const act=document.createElement("div");act.className="uact";
    act.innerHTML=`<button type="button" class="btn sm art-btn" data-m="art" aria-label="der / die / das"><span class="arts3 mini"><span class="a-der">der</span><span class="a-die">die</span><span class="a-das">das</span></span></button><button type="button" class="btn sm ghost" data-m="pick">${u.mPick}</button><button type="button" class="btn sm ghost" data-m="cards">${u.mCards}</button>`;
    act.querySelector('[data-m="art"]').onclick=()=>startSession(()=>buildArt(shuffle(ns.filter(x=>x.pl!=="PL"))),"der / die / das · "+uLabel(k));
    act.querySelector('[data-m="pick"]').onclick=()=>startSession(()=>buildPick(shuffle(ns)),u.mPick+" · "+uLabel(k));
    act.querySelector('[data-m="cards"]').onclick=()=>startSession(()=>buildCards(shuffle(ns)),u.mCards+" · "+uLabel(k));
    list.appendChild(act);
    list.insertAdjacentHTML("beforeend",`<ul class="words">${ns.map(wordRow).join("")}</ul>`);
  });
  m.appendChild(list);
  const upd=()=>{store.set("dgr-hide",hide);list.classList.toggle("hide-art",hide.art);list.classList.toggle("hide-tr",hide.tr);$("#tapHint").hidden=!(hide.art||hide.tr);list.querySelectorAll(".word.rev").forEach(x=>x.classList.remove("rev"))};
  $("#hArt").onchange=e=>{hide.art=e.target.checked;upd()};
  $("#hTr").onchange=e=>{hide.tr=e.target.checked;upd()};
  list.addEventListener("click",e=>{const w=e.target.closest(".word");if(w&&!e.target.closest(".spk"))w.classList.toggle("rev")});
  list.addEventListener("keydown",e=>{const w=e.target.closest(".word");if(w&&(e.key==="Enter"||e.key===" ")){e.preventDefault();w.classList.toggle("rev")}});
  $("#wAll").onclick=()=>startSession(()=>buildArt(shuffle(NL.filter(n=>n.pl!=="PL")).slice(0,25)),"der / die / das · "+LEVEL);
  if(wk)$("#wWeak").onclick=()=>startSession(()=>buildArt(shuffle(weakNouns()),true),u.tWeak);
}

/* ================= Question builders ================= */
const ARTS=["der","die","das"];
function buildArt(ns,includePl){
  return ns.filter(n=>includePl||n.pl!=="PL").map(n=>({kind:"mc",id:n.id,ask:()=>S().qArt,arts:true,
    prompt:()=>`<span class="qbig de">${n.w}</span>`,sub:()=>esc(n.m[lang]),
    opts:ARTS.map(a=>({h:a,cls:"art-"+a})),ans:ARTS.indexOf(n.a),
    reveal:()=>`<span class="de">${artHtml(n)}</span> · <span class="de">${plHtml(n)}</span>`,say:nounSay(n),miss:()=>`<span class="de">${artHtml(n)}</span>`}));
}
function otherNouns(n,k){const syn=synOf(n.w);const pool=NL.filter(x=>!syn.has(x.w)&&x.m[lang]!==n.m[lang]);const same=shuffle(pool.filter(x=>x.u===n.u)),rest=shuffle(pool.filter(x=>x.u!==n.u));return same.concat(rest).slice(0,k)}
function buildPick(ns){
  return ns.map(n=>{const wrongArt=pick(ARTS.filter(a=>a!==n.a));const others=otherNouns(n,2);
    const raw=shuffle([{h:`<span class="a-${n.a}">${n.a}</span> ${n.w}`,ok:1},{h:`<span class="a-${wrongArt}">${wrongArt}</span> ${n.w}`},...others.map(o=>({h:`<span class="a-${o.a}">${o.a}</span> ${o.w}`}))]);
    return{kind:"mc",id:n.id,ask:()=>S().qPick,prompt:()=>`<span class="qbig loc">${esc(n.m[lang])}</span>`,sub:()=>"",
      opts:raw.map(o=>({h:o.h,cls:"de"})),ans:raw.findIndex(o=>o.ok),reveal:()=>`<span class="de">${artHtml(n)}</span> · <span class="de">${plHtml(n)}</span>`,say:nounSay(n),miss:()=>`<span class="de">${artHtml(n)}</span>`}});
}
function buildCards(ns){
  return ns.map(n=>({kind:"card",id:n.id,front:()=>`<span class="qbig loc">${esc(n.m[lang])}</span>`,back:()=>`<span class="qbig de">${artHtml(n)}</span><span class="de qsub">${plHtml(n)}</span>`,say:nounSay(n),miss:()=>`<span class="de">${artHtml(n)}</span>`}));
}
function mcFrom(correct,distractors){const opts=shuffle(uniq([correct,...uniq(distractors).filter(x=>x!==correct).slice(0,2)]));return{opts:opts.map(h=>({h,cls:"de"})),ans:opts.indexOf(correct)}}
function partDistractors(v){const b=baseOf(v),s=stemOf(b),sp=v.sep&&v.inf.includes(" ")?v.sep+" ":v.sep;return shuffle(uniq([sp+"ge"+s+"t",sp+"ge"+b,sp+s+"t",sp+"ge"+s+"en",v.inf.replace(/^sich /,"")]).filter(x=>x!==v.part))}
function verbQs(v,pool){
  const qs=[],u=()=>S();const P3=v.impers?"es":"er";const vMiss=()=>`<span class="de">${v.inf}</span> · <span class="de">${P3} ${presF(v,2)}</span>`+(v.part?` · <span class="de">${P3} ${perfF(v,2)}</span>`:"");
  const base={id:v.id,say:v.inf,miss:vMiss};
  // Präsens: prefer an irregular person
  if(!v.impers){
  const irrP=[1,2].filter(i=>v.irrIdx[i]);const i=irrP.length&&Math.random()<.7?pick(irrP):pick([0,1,2,3,4,5]);
  const pc=presF(v,i),pd=[...(v.irrIdx[i]&&!SPECV.has(baseOf(v))?[v.reg[i]+(v.refl?" "+REFL[i]:"")+(v.sep?" "+v.sep:"")]:[]),...shuffle([0,1,2,3,4,5].map(j=>presF(v,j)))];
  qs.push({...base,kind:"mc",ask:()=>u().qPres,prompt:()=>`<span class="qline de">${QP[i]} <span class="gap">___</span></span>`,sub:()=>`<span class="de">(${v.inf})</span>`,...mcFrom(pc,pd),reveal:()=>`<span class="de">${QP[i]} ${pc}</span>`});}
  // Perfekt: auxiliary or participle
  const j=v.impers?2:pick([0,1,2,3,4,5]);const QPj=v.impers?"es":QP[j];
  if(!v.part){}
  else if(!v.impers&&!v.refl&&!AUXALT[v.inf]&&Math.random()<.5){const c=(v.aux==="s"?SEIN:HABEN)[j],w=(v.aux==="s"?HABEN:SEIN)[j];const o=shuffle([c,w]);
    qs.push({...base,kind:"mc",ask:()=>u().qAux,prompt:()=>`<span class="qline de">${QP[j]} <span class="gap">___</span> ${v.part}</span>`,sub:()=>`<span class="de">(${v.inf})</span>`,opts:o.map(h=>({h,cls:"de"})),ans:o.indexOf(c),reveal:()=>`<span class="de">${QP[j]} ${perfF(v,j)}</span>`});
  }else{const aux=(v.aux==="s"?SEIN:HABEN)[j]+(v.refl?" "+REFL[j]:"");
    qs.push({...base,kind:"mc",ask:()=>u().qPart,prompt:()=>`<span class="qline de">${QPj} ${aux} <span class="gap">___</span></span>`,sub:()=>`<span class="de">(${v.inf})</span>`,...mcFrom(v.part,partDistractors(v)),reveal:()=>`<span class="de">${QPj} ${perfF(v,j)}</span>`});}
  // Imperativ
  if(v.imp){const k=Math.random()<.65?0:1;const c=v.imp[k];const d=k===0?[cap(presF(v,1))+"!",v.imp[1]]:[v.imp[0],cap(presF(v,1))+"!"];
    qs.push({...base,kind:"mc",ask:()=>u().qImp,prompt:()=>`<span class="qline de">(${k===0?"du":"ihr"}) <span class="gap">___</span></span>`,sub:()=>`<span class="de">(${v.inf})</span>`,...mcFrom(c,d),reveal:()=>`<span class="de">${c}</span>`});}
  // Präteritum
  if(v.prt){const p=pick([0,2,3,5]);const c=prtF(v,p);
    qs.push({...base,kind:"mc",ask:()=>u().qPrt,prompt:()=>`<span class="qline de">${QP[p]} <span class="gap">___</span></span>`,sub:()=>`<span class="de">(${v.inf}, Präteritum)</span>`,...mcFrom(c,[...(v.prtIrr&&!SPECV.has(baseOf(v))?[prtCore(regPrt(v),p)+(v.refl?" "+REFL[p]:"")+(v.sep?" "+v.sep:"")]:[]),presF(v,p),...shuffle([0,1,2,3,4,5].map(x=>prtF(v,x)))]),reveal:()=>`<span class="de">${QP[p]} ${c}</span>`});}
  // Präposition (A2)
  if(v.prep){const ps=v.prep.split(" / ").map(x=>x.split("+")[0]);const c=ps[0];const b=baseOf(v);const ok=new Set([...ps,...(PREPOK[b]||[]),...(PREPOK[v.inf.replace(/^sich /,"")]||[])]);
    const o=shuffle([c,...shuffle(PREPS.filter(x=>!ok.has(x))).slice(0,2)]);const cs=v.prep.split(" / ")[0].includes("+D")?"Dat.":"Akk.";
    qs.push({...base,kind:"mc",ask:()=>u().qPrep,prompt:()=>`<span class="qline de">${v.inf} <span class="gap">___</span> + ${cs}</span>`,sub:()=>esc(v.m[lang]),opts:o.map(h=>({h,cls:"de"})),ans:o.indexOf(c),reveal:()=>`<span class="de">${v.inf} ${prepTxt(v.prep)}</span>`});}
  // Meaning (options are built in the current language when shown)
  const syn=synOf(baseOf(v));const others=shuffle((pool||VL).filter(x=>x.inf!==v.inf&&!syn.has(baseOf(x)))).slice(0,12);
  qs.push({...base,kind:"mc",ask:()=>u().qVm,prompt:()=>`<span class="qbig de">${v.inf}</span>`,sub:()=>"",dyn:true,
    build(){const ds=uniq(others.map(x=>x.m[lang]).filter(m=>m!==v.m[lang])).slice(0,3);const o=shuffle([v.m[lang],...ds]);this.opts=o.map(h=>({h:esc(h),cls:"loc"}));this.ans=o.indexOf(v.m[lang])},
    reveal:()=>`<span class="de">${v.inf}</span> = ${esc(v.m[lang])}`});
  return qs;
}
function buildVerbQs(vs,max,pool){return shuffle(vs.flatMap(v=>verbQs(v,pool&&pool!==vs?vs.concat(pool):vs))).slice(0,max)}

/* ================= Practice session ================= */
let SESSION=null;
function startSession(builder,title){
  const qs=builder();if(!qs.length)return;
  let pushed=!!(SESSION&&SESSION.pushed);
  if(!pushed){try{history.pushState({app:1,view,ov:1},"",location.href);pushed=true}catch(e){}}
  if(SESSION)clearTimeout(SESSION.timer);
  SESSION={builder,title,qs,i:0,right:0,total:qs.length,wrong:[],answered:false,flipped:false,requeued:new Set(),first:new Set(),pushed};
  SESSION.rerender=renderQ;
  const ov=$("#ov");ov.hidden=false;document.body.classList.add("noscroll");$(".wrap").setAttribute("aria-hidden","true");
  renderQ();setTimeout(()=>{const c=$("#ovIn");if(c)c.focus({preventScroll:true})},30);
}
function closeSession(viaHistory){const ov=$("#ov");const s=SESSION;if(s)clearTimeout(s.timer);ov.hidden=true;document.body.classList.remove("noscroll");$(".wrap").removeAttribute("aria-hidden");SESSION=null;try{speechSynthesis.cancel()}catch(e){}
  if(!viaHistory&&s&&s.pushed){try{history.back()}catch(e){}}
  const y=window.scrollY;renderAll();window.scrollTo(0,y)}
function headerHtml(){const s=SESSION,u=S();const n=Math.min(s.i+1,s.qs.length);
  return `<div class="ov-head"><button type="button" class="ov-x" id="ovClose" aria-label="${esc(u.pClose)}">✕</button><div class="ov-title">${esc(s.title)}</div><div class="ov-count">${s.i<s.qs.length?n+" / "+s.qs.length:""}</div></div><div class="prog ov-prog"><i style="width:${s.qs.length?Math.min(s.i,s.qs.length)/s.qs.length*100:0}%"></i></div>`}
function renderQ(){
  const s=SESSION;if(!s)return;const u=S(),box=$("#ovIn");
  if(s.i>=s.qs.length){renderEnd();return}
  const q=s.qs[s.i];
  if(q.kind==="card"){
    box.innerHTML=headerHtml()+`<div class="qask">${u.qCard}</div><button type="button" class="fc${s.flipped?" flipped":""}" id="fc">${s.flipped?q.back():q.front()}</button>
     <div class="qbtns" id="cardBtns">${s.flipped?`<button type="button" class="btn bigb bad" id="cNo">${u.notYet}</button><button type="button" class="btn bigb good" id="cYes">${u.knew}</button>`:`<button type="button" class="btn bigb" id="cFlip">${u.flip}</button>`}</div>
     ${s.flipped?`<div class="center">${spk(q.say)}</div>`:""}<p class="khint">${u.cardKeys}</p>`;
    const flip=()=>{if(!s.flipped){s.flipped=true;say(q.say);renderQ()}};
    $("#fc").onclick=flip;if($("#cFlip"))$("#cFlip").onclick=flip;
    if($("#cYes"))$("#cYes").onclick=()=>cardAnswer(true);
    if($("#cNo"))$("#cNo").onclick=()=>cardAnswer(false);
  }else{
    if(q.dyn&&(!q.opts||q.lang!==lang)){q.build();q.lang=lang}
    box.innerHTML=headerHtml()+`<div class="qcard"><div class="qask">${q.ask()}</div><div class="qprompt">${q.prompt()}</div>${q.sub()?`<div class="qsub">${q.sub()}</div>`:""}</div>
     <div class="qopts${q.arts?" arts":""}" id="qopts">${q.opts.map((o,k)=>`<button type="button" class="qo ${o.cls||""}" data-k="${k}"><span class="kn" aria-hidden="true">${k+1}</span><span class="qt">${o.h}</span></button>`).join("")}</div>
     <div class="qfb" id="qfb" aria-live="polite"></div><p class="khint">${u.keysHint}</p>`;
    box.querySelectorAll(".qo").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    if(s.answered)showFeedback(s.lastPick);
  }
  box.querySelector("#ovClose").onclick=()=>closeSession();
}
function answer(k){
  const s=SESSION;if(!s||s.answered)return;const q=s.qs[s.i];
  s.answered=true;s.lastPick=k;const ok=k===q.ans;
  const firstTry=!s.first.has(s.i);s.first.add(s.i);
  if(firstTry&&!q.retry){if(ok)s.right++;else s.wrong.push(q)}
  markItem(q.id,ok);
  if(!ok&&q.arts&&!s.requeued.has(q.id)){s.requeued.add(q.id);s.qs.push({...q,retry:true})}
  showFeedback(k);
  if(ok){say(q.say);const at=s.i;s.timer=setTimeout(()=>{if(SESSION===s&&s.i===at&&s.answered)next()},1100)}
}
function showFeedback(k){
  const s=SESSION,q=s.qs[s.i],u=S(),ok=k===q.ans;
  $("#ovIn").querySelectorAll(".qo").forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add("right");if(i===k&&!ok)b.classList.add("wrong")});
  $("#qfb").innerHTML=`<div class="fbline ${ok?"ok":"no"}">${ok?u.good:u.right} <span class="fbrev">${q.reveal()}</span> ${spk(q.say)}</div><button type="button" class="btn bigb" id="qNext">${s.i+1<s.qs.length?u.pNext:u.pResult}</button>`;
  $("#qNext").onclick=next;
}
function next(){const s=SESSION;if(!s)return;clearTimeout(s.timer);s.i++;s.answered=false;s.flipped=false;renderQ()}
function cardAnswer(ok){const s=SESSION,q=s.qs[s.i];const firstTry=!s.first.has(s.i);s.first.add(s.i);
  if(firstTry&&!q.retry){if(ok)s.right++;else s.wrong.push(q)}
  markItem(q.id,ok);if(!ok&&!s.requeued.has(q.id)){s.requeued.add(q.id);s.qs.push({...q,retry:true})}next()}
function renderEnd(){
  const s=SESSION,u=S(),box=$("#ovIn");const pct=s.total?Math.round(s.right/s.total*100):0;
  const ms=uniq(s.wrong.map(q=>q.miss()));
  box.innerHTML=headerHtml()+`<div class="qcard end"><div class="endscore de">${s.right} / ${s.total}</div><div class="endmsg">${pct===100?u.pPerfect:pct>=60?u.pGood:u.pLow}</div>
   ${ms.length?`<div class="qask">${u.pMist}</div><ul class="misslist">${ms.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<p class="khint">${u.masterRule}</p></div>
   <div class="qbtns col">${s.wrong.length?`<button type="button" class="btn bigb" id="eRedo">${u.pRedo}</button>`:""}<button type="button" class="btn bigb ${s.wrong.length?"ghost":""}" id="eAgain">${u.pAgain}</button><button type="button" class="btn bigb ghost" id="eClose">${u.pClose}</button></div>`;
  box.querySelector("#ovClose").onclick=()=>closeSession();$("#eClose").onclick=()=>closeSession();
  $("#eAgain").onclick=()=>startSession(s.builder,s.title);
  if($("#eRedo")){const w=s.wrong.map(q=>reshuffled(q));$("#eRedo").onclick=()=>startSession(()=>shuffle(w.map(reshuffled)),s.title)}
}
function reshuffled(q){const c={...q,retry:false};if(q.kind==="mc"&&!q.dyn&&!q.arts){const idx=shuffle(q.opts.map((_,i)=>i));c.opts=idx.map(i=>q.opts[i]);c.ans=idx.indexOf(q.ans)}if(q.dyn){c.opts=null}return c}
document.addEventListener("keydown",e=>{
  if(!SESSION||$("#ov").hidden)return;const s=SESSION,q=s.qs[s.i];
  if(e.key==="Escape"){e.preventDefault();closeSession();return}
  if(!q)return;
  if(q.kind==="card"){if(!s.flipped&&(e.key===" "||e.key==="Enter")){e.preventDefault();s.flipped=true;say(q.say);renderQ()}
    else if(s.flipped&&(e.key==="1"||e.key==="ArrowLeft"))cardAnswer(false);else if(s.flipped&&(e.key==="2"||e.key==="ArrowRight"))cardAnswer(true);return}
  if(!s.answered&&/^[1-4]$/.test(e.key)){const k=+e.key-1;if(k<q.opts.length){e.preventDefault();answer(k)}}
  else if(s.answered&&e.key==="Enter"){e.preventDefault();next()}
});

/* ================= Install hint (phone home screen) ================= */
const INST={ev:null,mode:null};
function isStandalone(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
function instAllowed(){
  const test=/[?&]installtest\b/.test(location.search);
  if(test)return true;
  if(location.protocol!=="https:"||isStandalone())return false;
  try{if(window.top!==window)return false}catch(e){return false}
  const until=store.get("dgr-inst-hide",0);if(until&&Date.now()<until)return false;
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
}
function instShow(mode){
  if(!instAllowed())return;INST.mode=INST.mode==="prompt"?"prompt":mode;
  let el=$("#inst");if(!el){el=document.createElement("div");el.id="inst";el.className="inst";el.setAttribute("role","dialog");document.body.appendChild(el)}
  const u=S();el.dir=u.dir;el.lang=lang;
  const how=INST.mode==="ios"?u.insIos:INST.mode==="menu"?u.insMenu:u.insD;
  el.innerHTML=`<img src="icon-192.png" alt="" class="inst-ic" onerror="this.remove()"><div class="inst-tx"><strong>${u.insT}</strong><span>${how}</span></div>
   <div class="inst-b">${INST.mode==="prompt"?`<button type="button" class="btn sm" id="instGo">${u.insBtn}</button>`:""}<button type="button" class="inst-x" id="instNo" aria-label="${esc(u.insClose)}">${INST.mode==="prompt"?u.insLater:"✕"}</button></div>`;
  el.hidden=false;requestAnimationFrame(()=>el.classList.add("on"));
  $("#instNo").onclick=()=>{store.set("dgr-inst-hide",Date.now()+14*864e5);instHide()};
  const g=$("#instGo");if(g)g.onclick=async()=>{const e=INST.ev;if(!e)return;instHide();try{e.prompt();const r=await e.userChoice;if(r&&r.outcome==="dismissed")store.set("dgr-inst-hide",Date.now()+14*864e5)}catch(err){}INST.ev=null};
}
function instHide(){const el=$("#inst");if(el){el.classList.remove("on");el.hidden=true}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INST.ev=e;INST.mode="prompt";setTimeout(()=>instShow("prompt"),1500)});
window.addEventListener("appinstalled",()=>{store.set("dgr-inst-hide",Date.now()+3650*864e5);instHide()});
setTimeout(()=>{if(INST.mode)return;const ua=navigator.userAgent;
  if(/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))instShow("ios");
  else if(/Android/i.test(ua)||/[?&]installtest\b/.test(location.search))instShow("menu")},4000);

setLevel(LEVEL);
renderAll();

</script>
