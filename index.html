<meta name="description" content="German A1 grammar following the Das Leben textbook, in Arabic, English and French.">

<title>دليل القواعد الألمانية</title>

<style>
/* Layout: one reading column; sticky unit rail; topics grouped under Das Leben A1 units; Plateau tests between unit blocks */
:root{
  --paper:#f3f4f1; --surface:#ffffff; --ink:#18233a; --muted:#5d6577; --line:#dcdfe3;
  --accent:#1f4fa3; --accent-soft:#e3eaf7; --ochre:#b7811a; --ochre-soft:#f6ecd6;
  --ok:#2e7d4f; --ok-soft:#e1f1e7; --bad:#b23a3a; --bad-soft:#f7e3e3;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-de:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --surface:#192030; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2a3346;
  --accent:#7ea6ec; --accent-soft:#1f2c47; --ochre:#e0b25a; --ochre-soft:#3a2f18;
  --ok:#6cc792; --ok-soft:#173326; --bad:#ec8a8a; --bad-soft:#3d1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --surface:#192030; --ink:#e7eaf0; --muted:#9aa3b5; --line:#2a3346;
  --accent:#7ea6ec; --accent-soft:#1f2c47; --ochre:#e0b25a; --ochre-soft:#3a2f18;
  --ok:#6cc792; --ok-soft:#173326; --bad:#ec8a8a; --bad-soft:#3d1d1d; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto}
header.top{padding-block:26px 12px;display:grid;gap:8px}
h1{font-family:var(--f-display);font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.25;margin:0;text-wrap:balance}
h1 .de{font-family:var(--f-de);font-weight:600;color:var(--accent);font-size:.62em;display:block;direction:ltr;text-align:right}
.lede{color:var(--muted);margin:0;max-width:60ch}
.toprow{display:flex;justify-content:flex-end;align-items:center}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{font:inherit;font-size:.82rem;font-weight:600;border:0;background:none;color:var(--muted);padding:4px 13px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.wrap[dir="ltr"] .row .t span,.wrap[dir="ltr"] h1 .de{text-align:left}
td.tx{font-family:var(--f-body);white-space:normal}
.stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-de);font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:3px 10px;cursor:pointer;text-decoration:none;direction:ltr;font-variant-numeric:tabular-nums}
.chip.full{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chip.pl{border-color:var(--ochre);color:var(--ochre)}
.search{width:100%;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.list{display:grid;gap:8px;margin-top:18px}
.unit{display:grid;gap:2px;margin:18px 0 4px}
.unit:first-child{margin-top:0}
.unit .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit .n{font-family:var(--f-de);font-weight:600;color:var(--paper);background:var(--ink);border-radius:6px;padding:0 8px;font-size:.85rem;direction:ltr}
.unit .ttl{font-family:var(--f-display);font-size:1.15rem}
.unit .de{font-family:var(--f-de);color:var(--muted);font-size:.9rem;direction:ltr}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.topic.done{border-inline-start:4px solid var(--ok)}
summary.row{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.row .t{flex:1;min-width:0;display:grid}
.row .t strong{font-weight:600}
.row .t span{font-family:var(--f-de);direction:ltr;text-align:right;color:var(--accent);font-size:.9rem}
.check{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--surface);font-size:.7rem}
.topic.done .check{background:var(--ok);border-color:var(--ok)}
.chev{flex:none;width:20px;height:20px;transition:transform .2s;color:var(--muted)}
.topic[open] .chev{transform:rotate(180deg)}
.body{padding:0 14px 16px;display:grid;gap:12px}
.body p{margin:0}
.h{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:-6px}
.rule{background:var(--ochre-soft);border-radius:8px;padding:8px 12px;font-family:var(--f-de);direction:ltr;text-align:left;font-weight:600}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-family:var(--f-de);direction:ltr;min-width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
th{background:var(--accent-soft);font-weight:600}
td.ar{font-family:var(--f-body);direction:rtl;text-align:right;white-space:normal}
.ex{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ex li{border-inline-start:3px solid var(--accent);padding-inline-start:10px;display:grid}
.de-t{font-family:var(--f-de);direction:ltr;text-align:left;font-size:1.02rem}
.de-t mark{background:none;color:var(--accent);font-weight:600}
.ex .ar{color:var(--muted);font-size:.9rem}
.err{display:grid;gap:4px;border-radius:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
.err .w,.err .r{display:flex;gap:8px;align-items:baseline}
.err .w .de-t{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.err .sym{flex:none;font-weight:700;width:1em;text-align:center}
.err .w .sym{color:var(--bad)} .err .r .sym{color:var(--ok)}
.tip{font-size:.92rem;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.tip b{color:var(--accent)}
.quiz{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:14px}
.qi{display:grid;gap:6px}
.qi .q{font-family:var(--f-de);direction:ltr;text-align:left;font-size:1.02rem}
.qi .q .num{color:var(--ochre);font-weight:600;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.opt{font-family:var(--f-de);font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qscore{font-size:.88rem;font-weight:600}
.mark{justify-self:start;font:inherit;font-size:.88rem;border:1px solid var(--ok);color:var(--ok);background:none;border-radius:8px;padding:4px 12px;cursor:pointer}
.topic.done .mark{background:var(--ok);color:var(--surface)}
.plateau{margin:14px 0 6px;border:1.5px dashed var(--ochre);border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:var(--ochre-soft)}
.plateau .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.plateau strong{font-family:var(--f-de);direction:ltr}
.plateau .sub{font-size:.88rem;color:var(--muted)}
.btn{font:inherit;font-size:.9rem;background:var(--ochre);color:var(--surface);border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ochre);border:1px solid var(--ochre)}
.pq{display:grid;gap:10px;background:var(--surface);border-radius:10px;padding:12px}
.pq .meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pq .src{font-size:.8rem;color:var(--muted)}
.result{text-align:center;display:grid;gap:6px;justify-items:center}
.result .big{font-family:var(--f-de);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.final{border-color:var(--accent);background:var(--accent-soft)}
.final .btn{background:var(--accent)}
.final .btn.ghost{background:none;color:var(--accent);border-color:var(--accent)}
footer{color:var(--muted);font-size:.82rem;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

/* ---------- Rule translations (same order as T) ---------- */
const TR={en:[
{t:"Letters and pronunciation",x:"German is mostly pronounced the way it is written. Learn the special letters ä, ö, ü, ß and the key letter combinations, and remember that all nouns start with a capital letter.",col:["like an open e","say e with your lips rounded","say i with your lips rounded","a strong s","“eye” / long “ee”","“sh” / a throaty or soft sound"],ex:["How do you spell that?","Could you spell that, please?"],tip:"ei sounds like “eye” and ie like “ee”: <b>Wein</b> (wine) ≠ <b>Wien</b> (Vienna)."},
{t:"Articles and gender",x:"Every noun has a gender: masculine der, feminine die, neuter das. The plural is always die. Always learn a noun together with its article.",ex:["the pen, the board, the book","This is a table."],tip:"Nouns ending in -ung, -heit, -keit are feminine, and nouns ending in -chen are neuter. Write each new noun in a colour that matches its gender."},
{t:"Present tense conjugation",x:"Remove -en from the infinitive and add an ending for each pronoun.",ex:["I'm from Tunisia.","Where do you live?","She is learning German."],tip:"If the stem ends in t or d, add e: du arbeit<b>e</b>st. If it ends in s, ß or z, du only takes -t: du heißt."},
{t:"Questions and word order",x:"In statements and in questions with a question word, the verb is always in second position. In yes/no questions, the verb comes first.",ex:["I'm learning German.","What are you doing?","Do you speak English?"],tip:"If the sentence starts with a time or place, the subject comes right after the verb: Heute <b>lerne ich</b>."},
{t:"Informal or formal: du or Sie",x:"Use du with friends, family, children and other students. Use Sie (always capitalised) with strangers, teachers and at work; it is conjugated like the plural.",ex:["What's your name? (informal)","What's your name? (formal)","Where are you from, Ms Weber?"],tip:"In the speaking exam, use <b>Sie</b> with the examiner; you can use du with your partner."},
{t:"Noun plurals",x:"The plural article is always die. There is no single rule for the endings, so learn each plural with the noun.",ex:["a lamp → two lamps","a book → three books"],tip:"Most feminine nouns take -(e)n, and foreign words take -s. Dictionaries show the plural like this: Buch, ¨-er."},
{t:"Numbers",x:"From 21 to 99 you say the units first, then the tens: einundzwanzig = “one-and-twenty”.",ex:["My number is …","That costs forty-five euros."],tip:"Careful: dreißig is spelled with ß, not -zig, and sechzehn and siebzehn drop some letters."},
{t:"Question words",x:"Question words come at the start of the sentence, followed directly by the verb.",col:["who?","what?","where?","where from?","where to?","how?","how much?"],ex:["Who is that?","Where are you from?","What's your phone number?"],tip:"To ask for a name, number or address, use <b>wie</b>, not was."},
{t:"The verb sein (to be)",x:"The most important verb in the language. It is irregular, so learn it by heart.",ex:["I'm a waiter.","This is my colleague.","Are you students?"],tip:"No article with jobs and nationalities: Ich bin Lehrer. Er ist Tunesier."},
{t:"Indefinite article and negation: ein and kein",x:"kein negates an indefinite noun and takes exactly the same endings as ein.",ex:["Is that a tea? – No, that's not a tea.","These aren't biscuits."],tip:"ein has no plural, but kein does: keine."},
{t:"Possessives mein and dein",x:"mein = my, dein = your. They take the same endings as ein / kein.",ex:["This is my café.","This is my boss.","Is that your phone?"],tip:"With feminine and plural nouns, add -e: meine Tasse, meine Freunde."},
{t:"Polite requests: ich möchte",x:"For ordering in cafés, restaurants and shops. möchte is in second position, followed by a noun, or with an infinitive at the end.",ex:["I'd like a coffee, please.","What would you like to drink?"],tip:"ich möchte is more polite than ich will. Always use it in a café and in the exam."},
{t:"The direct object (Akkusativ)",x:"The direct object is in the accusative. Only the masculine changes: der→den, ein→einen, kein→keinen.",ex:["I'm eating a salad.","We don't need sugar.","There is an apple cake."],tip:"es gibt, haben, brauchen, essen and nehmen all take the accusative."},
{t:"Negation: nicht or kein",x:"kein negates an indefinite noun or a noun without an article. nicht negates a verb, an adjective or a definite noun.",ex:["I don't eat meat.","I don't like eating fish.","The soup isn't hot."],tip:"Ask yourself: am I negating a noun without der/die/das? → kein. Otherwise → nicht."},
{t:"Likes: mögen and gern",x:"mögen + noun: to like something. gern + verb: to like doing something. gern comes after the verb.",ex:["I like pizza.","I like cooking.","He doesn't like eating vegetables."],tip:"gern → lieber → am liebsten: Ich trinke <b>lieber</b> Tee (I prefer tea)."},
{t:"Verbs with a vowel change",x:"Some verbs change their vowel with du and er/sie/es only.",ex:["What are you having?","She likes eating couscous."],tip:"wir, ihr and sie don't change: wir nehmen, ihr esst."},
{t:"Time and appointments",x:"am with days and parts of the day, um with clock times, von … bis for a period, im with months and seasons.",ex:["It's half past seven.","It's quarter past three.","It's quarter to ten."],tip:"halb acht = 7:30, not 8:30, because it means “half an hour before eight”."},
{t:"Separable verbs",x:"Some verbs have a prefix that separates and goes to the end of the sentence: an, auf, aus, ein, mit, zu, fern…",ex:["I get up at 7.","When do you go shopping?","We watch TV in the evening."],tip:"The prefixes be-, ver-, er-, ent-, ge- never separate: verstehen → ich verstehe."},
{t:"Asking about time: wann, wie lange, wie oft",x:"wann asks when something happens, wie lange asks how long it lasts, and wie oft asks how often.",ex:["When are you free? – On Friday.","How long is the film? – Two hours.","How often do you go to the cinema?"],tip:"The answer to wann has am/um; the answer to wie lange is a length of time (Stunden, Tage)."},
{t:"Possessives (all forms)",x:"mein, dein, sein (his), ihr (her), unser, euer, ihr/Ihr. They all take the endings of ein.",ex:["This is our city.","Anna and her brother","Is this your car? (formal)"],tip:"sein for a male owner, ihr for a female owner. Ihr with a capital = your (formal)."},
{t:"Formal imperative",x:"For polite instructions or directions: verb first, then Sie.",ex:["Go straight ahead.","Turn right at the traffic lights.","Take the underground."],tip:"Add bitte to make it softer: Warten Sie <b>bitte</b> hier."},
{t:"Prepositions of place with the dative",x:"To answer wo? (where?), use prepositions of place with the dative.",ex:["The phone is on the table.","The lamp is next to the door.","I work in the office."],tip:"in dem = <b>im</b>, an dem = <b>am</b>. Feminine in the dative becomes <b>der</b>."},
{t:"Past: war and hatte",x:"To talk about the past we use war (was) and hatte (had), even in everyday speech.",ex:["Yesterday I was at the cinema.","We had a lot of fun."],tip:"No ending with ich and er/sie: ich war, er war."},
{t:"The verb können",x:"können = can / to know how to. The modal verb is in second position and the main verb goes to the end as an infinitive.",ex:["I can swim well.","Can you play the guitar?"],tip:"No ending with ich and er/sie: ich kann, er kann."},
{t:"Adverbs of frequency",x:"To say how often, from most to least.",ex:["I often play football.","He never goes to the theatre."],tip:"They can start the sentence; then the verb comes next: <b>Manchmal lese</b> ich abends."},
{t:"Compound nouns",x:"German builds new nouns out of other words. The last word is the base and decides the article.",ex:["kitchen table","bathtub"],tip:"The article always comes from the last word."},
{t:"Place prepositions: where? and where to?",x:"Nine prepositions take the dative for position (wo?) and the accusative for movement towards a place (wohin?).",ex:["I put the sofa against the wall.","The sofa is against the wall."],tip:"Movement verbs stellen, legen → accusative. Position verbs stehen, liegen → dative."},
{t:"Adjectives after sein, and zu",x:"An adjective after sein takes no ending. zu + adjective = too (a negative meaning).",ex:["The flat is nice but too expensive.","The room is very bright."],tip:"sehr = very (positive or neutral), zu = too much."},
{t:"Perfect tense with haben",x:"The most common past tense in speech. haben is in second position and the past participle (Partizip II) goes at the end.",ex:["I took photos.","We cooked together."],tip:"Regular verbs: ge + stem + t: spielen → gespielt, kaufen → gekauft."},
{t:"Possessives in the accusative",x:"Like ein / einen: the masculine takes -en in the accusative; the others don't change.",ex:["I'm visiting my grandad.","Do you know our son?"],tip:"euer drops its e when it takes an ending: eure Eltern."},
{t:"Perfect tense: regular and irregular",x:"Irregular verbs end in -en and sometimes change their vowel. Separable verbs put ge in the middle. Verbs in -ieren and verbs with be-, ver- take no ge.",ex:["I wrote an e-mail.","She called the boss."],tip:"Learn irregular verbs in threes: schreiben – schrieb – geschrieben."},
{t:"Female job titles",x:"For the feminine form add -in, and -innen in the plural, sometimes with an umlaut.",ex:["teacher (m) → teacher (f) → teachers (f)","doctor (m) → doctor (f)"],tip:"Kaufmann → Kauf<b>frau</b> (an exception)."},
{t:"Modal verbs: müssen, wollen, dürfen",x:"müssen = must, wollen = to want, dürfen = to be allowed. Same word order: modal verb second, infinitive last.",ex:["What do I have to do first?","You can't park here."],tip:"nicht müssen = don't have to (not “forbidden”): Du <b>musst nicht</b> kommen."},
{t:"Quantities and packaging",x:"After a quantity, the noun follows directly, without an article.",ex:["a kilo of tomatoes","a bottle of water","200 grams of cheese"],tip:"Wie viel + uncountable noun: Wie viel Milch? · Wie viele + plural: Wie viele Eier?"},
{t:"Perfect tense with sein",x:"Verbs of movement from one place to another and verbs of change of state take sein instead of haben.",ex:["I went to the doctor.","We ran 5 km."],tip:"bleiben and sein also take sein: Ich bin zu Hause geblieben."},
{t:"Imperative: du, ihr and Sie",x:"du: drop -st and the pronoun. ihr: the ihr form without the pronoun. Sie: the verb, then Sie.",ex:["Drink lots of water!","Do some exercise! (to a group)"],tip:"a→ä doesn't happen in the imperative: du schläfst → <b>Schlaf</b> gut!"},
{t:"The verb sollen",x:"sollen passes on advice or an order from someone else (the doctor, the boss…), and is used to offer: “shall I…?”.",ex:["The doctor says I should sleep a lot.","Shall I open the window?"],err0:"Der Arzt sagt, ich muss nicht rauchen. (meaning: not allowed)",tip:"müssen = necessity, sollen = someone else asks or advises, dürfen nicht = forbidden."},
{t:"Adjectives before a noun in the accusative",x:"An adjective before a noun takes an ending. After ein/kein/mein in the accusative: masculine -en, feminine -e, neuter -es.",ex:["I'm looking for a warm jumper.","She's wearing an elegant dress."],tip:"After den/die/das the adjective takes: den neu<b>en</b>, die neu<b>e</b>, das neu<b>e</b>."},
{t:"The demonstrative dieser",x:"dieser = this (specific one). It takes the same endings as der/die/das.",ex:["What do you think of this skirt?","These shoes are comfortable."],tip:"dieser ends like der: der → dies<b>er</b>, den → dies<b>en</b>."},
{t:"Comparatives",x:"Adjective + -er + als. Many short adjectives take an umlaut. For equality: so … wie.",ex:["Summer is warmer than spring.","Tunis isn't as cold as Berlin."],tip:"Irregular ones to learn: gut → besser, viel → mehr, gern → lieber."},
{t:"The verb werden (to become)",x:"werden = to become. It is often used for the weather and the future.",ex:["Tomorrow it'll be warm.","In autumn the days get shorter."],tip:"du wirst and er wird are irregular."},
{t:"Where to? Prepositions of direction",x:"nach with cities and countries that have no article. in + accusative with countries and places that have an article. an + accusative for the sea and the beach. zu + dative for people and institutions.",ex:["We're going to the seaside.","I'm flying to Switzerland."],tip:"Wo? → in Wien / zu Hause. Wohin? → nach Wien / nach Hause."}
],fr:[
{t:"Lettres et prononciation",x:"L'allemand se prononce en général comme il s'écrit. Apprends les lettres spéciales ä, ö, ü, ß et les combinaisons importantes, et n'oublie pas que tous les noms prennent une majuscule.",col:["comme un « è » ouvert","comme « eu » dans « deux »","comme le « u » français","un s fort","« aï » / « i » long","« ch » / son guttural ou doux"],ex:["Comment ça s'écrit ?","Pouvez-vous l'épeler, s'il vous plaît ?"],tip:"ei se prononce « aï » et ie se prononce « i » : <b>Wein</b> (vin) ≠ <b>Wien</b> (Vienne)."},
{t:"Articles et genre",x:"Chaque nom a un genre : masculin der, féminin die, neutre das. Le pluriel est toujours die. Apprends toujours un nom avec son article.",ex:["le stylo, le tableau, le livre","C'est une table."],tip:"Les noms en -ung, -heit, -keit sont féminins, ceux en -chen sont neutres. Écris chaque nouveau nom d'une couleur différente selon son genre."},
{t:"Conjugaison au présent",x:"On enlève -en de l'infinitif et on ajoute une terminaison selon le pronom.",ex:["Je viens de Tunisie.","Où habites-tu ?","Elle apprend l'allemand."],tip:"Si le radical se termine par t ou d, on ajoute e : du arbeit<b>e</b>st. S'il se termine par s, ß ou z, du prend seulement -t : du heißt."},
{t:"Questions et ordre des mots",x:"Dans une phrase affirmative et dans une question avec un mot interrogatif, le verbe est toujours en deuxième position. Dans une question oui/non, le verbe vient en premier.",ex:["J'apprends l'allemand.","Que fais-tu ?","Parles-tu anglais ?"],tip:"Si la phrase commence par le temps ou le lieu, le sujet vient juste après le verbe : Heute <b>lerne ich</b>."},
{t:"Tutoiement ou vouvoiement : du ou Sie",x:"du pour les amis, la famille, les enfants et entre étudiants. Sie (toujours avec majuscule) pour les inconnus, les professeurs et au travail ; il se conjugue comme le pluriel.",ex:["Comment tu t'appelles ? (familier)","Comment vous appelez-vous ? (poli)","D'où venez-vous, Madame Weber ?"],tip:"À l'oral de l'examen, utilise <b>Sie</b> avec l'examinateur ; avec ton partenaire, du est possible."},
{t:"Le pluriel des noms",x:"L'article au pluriel est toujours die. Il n'y a pas une seule règle pour les terminaisons : apprends le pluriel avec le nom.",ex:["une lampe → deux lampes","un livre → trois livres"],tip:"La plupart des noms féminins prennent -(e)n, les mots étrangers prennent -s. Dans le dictionnaire, le pluriel est noté ainsi : Buch, ¨-er."},
{t:"Les nombres",x:"De 21 à 99, on dit d'abord l'unité puis la dizaine : einundzwanzig = « un-et-vingt ».",ex:["Mon numéro est …","Ça coûte quarante-cinq euros."],tip:"Attention : dreißig s'écrit avec ß et non -zig, et sechzehn et siebzehn perdent des lettres."},
{t:"Les mots interrogatifs",x:"Les mots interrogatifs se placent en début de phrase, suivis directement du verbe.",col:["qui ?","quoi ?","où ?","d'où ?","où (direction) ?","comment ?","combien ?"],ex:["Qui est-ce ?","D'où viens-tu ?","Quel est ton numéro de téléphone ?"],tip:"Pour demander le nom, le numéro ou l'adresse, on utilise <b>wie</b> et non was."},
{t:"Le verbe sein (être)",x:"Le verbe le plus important de la langue. Il est irrégulier, il faut l'apprendre par cœur.",ex:["Je suis serveur.","C'est mon collègue.","Vous êtes étudiants ?"],tip:"Pas d'article avec les métiers et les nationalités : Ich bin Lehrer. Er ist Tunesier."},
{t:"Article indéfini et négation : ein et kein",x:"kein nie un nom indéfini et se décline exactement comme ein.",ex:["C'est un thé ? – Non, ce n'est pas un thé.","Ce ne sont pas des biscuits."],tip:"ein n'a pas de pluriel, mais kein oui : keine."},
{t:"Les possessifs mein et dein",x:"mein = mon/ma, dein = ton/ta. Ils se déclinent comme ein / kein.",ex:["C'est mon café.","C'est ma cheffe.","C'est ton portable ?"],tip:"Avec un nom féminin ou pluriel, on ajoute -e : meine Tasse, meine Freunde."},
{t:"La demande polie : ich möchte",x:"Pour commander au café, au restaurant et dans les magasins. möchte est en deuxième position, suivi d'un nom, ou avec un infinitif à la fin.",ex:["Je voudrais un café, s'il vous plaît.","Que voulez-vous boire ?"],tip:"ich möchte est plus poli que ich will. Utilise-le toujours au café et à l'examen."},
{t:"Le complément d'objet direct (Akkusativ)",x:"Le COD est à l'accusatif. Seul le masculin change : der→den, ein→einen, kein→keinen.",ex:["Je mange une salade.","Nous n'avons pas besoin de sucre.","Il y a un gâteau aux pommes."],tip:"es gibt, haben, brauchen, essen et nehmen prennent tous l'accusatif."},
{t:"La négation : nicht ou kein",x:"kein nie un nom indéfini ou un nom sans article. nicht nie un verbe, un adjectif ou un nom défini.",ex:["Je ne mange pas de viande.","Je n'aime pas manger de poisson.","La soupe n'est pas chaude."],tip:"Demande-toi : est-ce que je nie un nom sans der/die/das ? → kein. Sinon → nicht."},
{t:"Les goûts : mögen et gern",x:"mögen + nom : aimer quelque chose. gern + verbe : aimer faire quelque chose. gern se place après le verbe.",ex:["J'aime la pizza.","J'aime cuisiner.","Il n'aime pas manger de légumes."],tip:"gern → lieber → am liebsten : Ich trinke <b>lieber</b> Tee (je préfère le thé)."},
{t:"Les verbes à changement de voyelle",x:"Certains verbes changent de voyelle uniquement avec du et er/sie/es.",ex:["Qu'est-ce que tu prends ?","Elle aime manger du couscous."],tip:"wir, ihr et sie ne changent pas : wir nehmen, ihr esst."},
{t:"L'heure et les rendez-vous",x:"am avec les jours et les moments de la journée, um avec l'heure, von … bis pour une durée, im avec les mois et les saisons.",ex:["Il est sept heures et demie.","Il est trois heures et quart.","Il est dix heures moins le quart."],tip:"halb acht = 7h30 et non 8h30, car cela veut dire « une demi-heure avant huit heures »."},
{t:"Les verbes séparables",x:"Certains verbes ont un préfixe qui se sépare et va à la fin de la phrase : an, auf, aus, ein, mit, zu, fern…",ex:["Je me lève à 7 heures.","Quand fais-tu les courses ?","Le soir, nous regardons la télé."],tip:"Les préfixes be-, ver-, er-, ent-, ge- ne se séparent jamais : verstehen → ich verstehe."},
{t:"Questions de temps : wann, wie lange, wie oft",x:"wann demande quand, wie lange demande combien de temps, et wie oft demande combien de fois.",ex:["Quand as-tu le temps ? – Vendredi.","Combien de temps dure le film ? – Deux heures.","À quelle fréquence vas-tu au cinéma ?"],tip:"La réponse à wann contient am/um ; la réponse à wie lange est une durée (Stunden, Tage)."},
{t:"Les possessifs (toutes les formes)",x:"mein, dein, sein (son, à lui), ihr (son, à elle), unser, euer, ihr/Ihr. Ils prennent tous les terminaisons de ein.",ex:["C'est notre ville.","Anna et son frère","C'est votre voiture ?"],tip:"sein si le possesseur est masculin, ihr s'il est féminin. Ihr avec majuscule = votre (poli)."},
{t:"L'impératif poli",x:"Pour donner des consignes ou indiquer le chemin poliment : le verbe d'abord, puis Sie.",ex:["Allez tout droit.","Tournez à droite au feu.","Prenez le métro."],tip:"Ajoute bitte pour être plus aimable : Warten Sie <b>bitte</b> hier."},
{t:"Prépositions de lieu avec le datif",x:"Pour répondre à wo? (où ?), on utilise les prépositions de lieu avec le datif.",ex:["Le portable est sur la table.","La lampe est à côté de la porte.","Je travaille au bureau."],tip:"in dem = <b>im</b>, an dem = <b>am</b>. Au datif, le féminin devient <b>der</b>."},
{t:"Le passé : war et hatte",x:"Pour parler du passé, on utilise war (était) et hatte (avait), même à l'oral.",ex:["Hier, j'étais au cinéma.","On s'est bien amusés."],tip:"Pas de terminaison avec ich et er/sie : ich war, er war."},
{t:"Le verbe können",x:"können = pouvoir / savoir faire. Le modal est en deuxième position et le verbe principal va à la fin, à l'infinitif.",ex:["Je sais bien nager.","Tu sais jouer de la guitare ?"],tip:"Pas de terminaison avec ich et er/sie : ich kann, er kann."},
{t:"Les adverbes de fréquence",x:"Pour dire combien de fois, du plus fréquent au moins fréquent.",ex:["Je joue souvent au foot.","Il ne va jamais au théâtre."],tip:"Ils peuvent commencer la phrase ; le verbe vient alors juste après : <b>Manchmal lese</b> ich abends."},
{t:"Les noms composés",x:"L'allemand forme de nouveaux noms en assemblant des mots. Le dernier mot est la base et donne l'article.",ex:["la table de cuisine","la baignoire"],tip:"L'article vient toujours du dernier mot."},
{t:"Prépositions de lieu : où ? et vers où ?",x:"Neuf prépositions prennent le datif pour la position (wo?) et l'accusatif pour le mouvement vers un lieu (wohin?).",ex:["Je mets le canapé contre le mur.","Le canapé est contre le mur."],tip:"Verbes de mouvement stellen, legen → accusatif. Verbes de position stehen, liegen → datif."},
{t:"L'adjectif après sein, et zu",x:"Après sein, l'adjectif ne prend pas de terminaison. zu + adjectif = trop (sens négatif).",ex:["L'appartement est beau mais trop cher.","La chambre est très claire."],tip:"sehr = très (positif ou neutre), zu = trop."},
{t:"Le Perfekt avec haben",x:"Le passé le plus utilisé à l'oral. haben est en deuxième position et le participe passé (Partizip II) va à la fin.",ex:["J'ai pris des photos.","Nous avons cuisiné ensemble."],tip:"Verbes réguliers : ge + radical + t : spielen → gespielt, kaufen → gekauft."},
{t:"Les possessifs à l'accusatif",x:"Comme ein / einen : le masculin prend -en à l'accusatif, le reste ne change pas.",ex:["Je rends visite à mon grand-père.","Tu connais notre fils ?"],tip:"euer perd son e quand il prend une terminaison : eure Eltern."},
{t:"Le Perfekt : réguliers et irréguliers",x:"Les verbes irréguliers finissent en -en et changent parfois de voyelle. Les verbes séparables mettent ge au milieu. Les verbes en -ieren et avec be-, ver- n'ont pas de ge.",ex:["J'ai écrit un e-mail.","Elle a appelé le chef."],tip:"Apprends les verbes irréguliers par trois : schreiben – schrieb – geschrieben."},
{t:"Les métiers au féminin",x:"Pour le féminin, on ajoute -in, et -innen au pluriel, parfois avec un umlaut.",ex:["enseignant → enseignante → enseignantes","médecin (homme) → médecin (femme)"],tip:"Kaufmann → Kauf<b>frau</b> (exception)."},
{t:"Les verbes de modalité : müssen, wollen, dürfen",x:"müssen = devoir, wollen = vouloir, dürfen = avoir le droit. Même ordre : le modal en deuxième position, l'infinitif à la fin.",ex:["Qu'est-ce que je dois faire d'abord ?","Il est interdit de se garer ici."],tip:"nicht müssen = ne pas être obligé (et non « interdit ») : Du <b>musst nicht</b> kommen."},
{t:"Les quantités et emballages",x:"Après une quantité, le nom suit directement, sans article.",ex:["un kilo de tomates","une bouteille d'eau","200 grammes de fromage"],tip:"Wie viel + nom indénombrable : Wie viel Milch? · Wie viele + pluriel : Wie viele Eier?"},
{t:"Le Perfekt avec sein",x:"Les verbes de déplacement d'un lieu à un autre et les verbes de changement d'état prennent sein au lieu de haben.",ex:["Je suis allé chez le médecin.","Nous avons couru 5 km."],tip:"bleiben et sein prennent aussi sein : Ich bin zu Hause geblieben."},
{t:"L'impératif : du, ihr et Sie",x:"du : on enlève -st et le pronom. ihr : la forme de ihr sans le pronom. Sie : le verbe, puis Sie.",ex:["Bois beaucoup d'eau !","Faites du sport !"],tip:"Pas de a→ä à l'impératif : du schläfst → <b>Schlaf</b> gut!"},
{t:"Le verbe sollen",x:"sollen transmet un conseil ou un ordre venant d'une autre personne (le médecin, le chef…). On l'utilise aussi pour proposer quelque chose : « Est-ce que je… ? ».",ex:["Le médecin dit que je dois beaucoup dormir.","J'ouvre la fenêtre ?"],err0:"Der Arzt sagt, ich muss nicht rauchen. (sens : interdit)",tip:"müssen = nécessité, sollen = quelqu'un d'autre demande ou conseille, dürfen nicht = interdit."},
{t:"L'adjectif devant le nom à l'accusatif",x:"Devant un nom, l'adjectif prend une terminaison. Après ein/kein/mein à l'accusatif : masculin -en, féminin -e, neutre -es.",ex:["Je cherche un pull chaud.","Elle porte une robe élégante."],tip:"Après den/die/das, l'adjectif prend : den neu<b>en</b>, die neu<b>e</b>, das neu<b>e</b>."},
{t:"Le démonstratif dieser",x:"dieser = ce/cette (celui-ci). Il se décline comme der/die/das.",ex:["Comment tu trouves cette jupe ?","Ces chaussures sont confortables."],tip:"dieser se termine comme der : der → dies<b>er</b>, den → dies<b>en</b>."},
{t:"Le comparatif",x:"Adjectif + -er + als. Beaucoup d'adjectifs courts prennent un umlaut. Pour l'égalité : so … wie.",ex:["L'été est plus chaud que le printemps.","Il ne fait pas aussi froid à Tunis qu'à Berlin."],tip:"Irréguliers à retenir : gut → besser, viel → mehr, gern → lieber."},
{t:"Le verbe werden (devenir)",x:"werden = devenir. Il est très utilisé pour la météo et le futur.",ex:["Demain, il va faire chaud.","En automne, les jours raccourcissent."],tip:"du wirst et er wird sont irréguliers."},
{t:"Vers où ? Prépositions de direction",x:"nach avec les villes et les pays sans article. in + accusatif avec les pays et les lieux qui ont un article. an + accusatif pour la mer et la plage. zu + datif pour les personnes et les institutions.",ex:["Nous allons à la mer.","Je prends l'avion pour la Suisse."],tip:"Wo? → in Wien / zu Hause. Wohin? → nach Wien / nach Hause."}
]};

/* ---------- Language state ---------- */
let lang="ar";try{const s=localStorage.getItem("dgr-lang");if(UI[s])lang=s}catch(e){}
const S=()=>UI[lang];
function loc(t){
  if(lang==="ar")return{title:t.ar,x:t.x,tip:t.tip,ex:t.ex.map(e=>e[1]),err0:t.err&&t.err[0],col:null};
  const r=TR[lang][t.i];return{title:r.t,x:r.x,tip:r.tip,ex:r.ex,err0:r.err0||(t.err&&t.err[0]),col:r.col||null};
}
const unitTitle=U=>lang==="ar"?U[3]:UNIT_TR[lang][U[0]];
function applyLang(){
  const u=S(),w=document.querySelector(".wrap");
  w.dir=u.dir;w.lang=lang;document.documentElement.lang=lang;document.documentElement.dir=u.dir;
  document.title=u.doc;
  document.getElementById("h1t").textContent=u.h1;
  document.getElementById("lede").textContent=u.lede;
  document.getElementById("foot").textContent=u.foot;
  document.getElementById("q").placeholder=u.search;
  document.getElementById("chips").setAttribute("aria-label",u.nav);
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false"));
}
document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;try{localStorage.setItem("dgr-lang",lang)}catch(e){}
  applyLang();render();
});

const KEY="dgr-a1-done";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const id=t=>t.u+"|"+t.de;
const uLabel=u=>u==="S"?"Start":"E"+u;
const qv=()=>document.getElementById("q").value.trim().toLowerCase();
const PLATEAUS={1:["S",1,2,3,4],2:[5,6,7,8],3:[9,10,11,12],4:[13,14,15,16]};

function jump(target){if(qv()){document.getElementById("q").value="";render()}document.getElementById(target).scrollIntoView({behavior:"smooth"})}
function stats(){
  const n=T.filter(t=>done[id(t)]).length;
  document.getElementById("statsTxt").innerHTML=S().learned(n,T.length);
  document.getElementById("pg").style.width=(n/T.length*100)+"%";
  const c=document.getElementById("chips");c.innerHTML="";
  const chip=(cls,href,txt)=>{const a=document.createElement("a");a.className=cls;a.href="#"+href;a.textContent=txt;a.onclick=e=>{e.preventDefault();jump(href)};c.appendChild(a)};
  UNITS.forEach(U=>{
    const its=T.filter(t=>t.u===U[0]),full=its.length&&its.every(t=>done[id(t)]);
    chip("chip"+(full?" full":""),"u-"+U[0],uLabel(U[0]));
    if(U[4])chip("chip pl","p-"+U[4],"P"+U[4]);
  });
  chip("chip pl","final","A1 ✓");
}

function quizItem(q,i,onAns){
  const w=document.createElement("div");w.className="qi";
  w.innerHTML=`<div class="q"><span class="num">${i}.</span>${q[0]}</div><div class="opts">${q[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
  w.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q[2];
    w.querySelectorAll(".opt").forEach(x=>{x.disabled=true});
    b.classList.add(ok?"right":"wrong");
    if(!ok)w.querySelector(`.opt[data-k="${q[2]}"]`).classList.add("right");
    onAns&&onAns(ok);
  });
  return w;
}

function topicEl(t,showU){
  const u=S(),L=loc(t);
  const d=document.createElement("details");d.className="topic"+(done[id(t)]?" done":"");
  let h=`<summary class="row"><span class="check" aria-hidden="true">✓</span><span class="t"><strong>${L.title}</strong><span>${t.de}${showU?" · "+uLabel(t.u):""}</span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary><div class="body"><p>${L.x}</p>`;
  if(t.rule)h+=`<div class="rule">${t.rule}</div>`;
  if(t.tbl){const hasHd=t.tbl[0][0]==="";h+=`<div class="tbl"><table>`;
    t.tbl.forEach((r,i)=>{h+="<tr>"+r.map((c,j)=>{
      if((i===0&&hasHd)||j===0)return `<th>${c}</th>`;
      if(/[؀-ۿ]/.test(c))return lang==="ar"?`<td class="ar">${c}</td>`:`<td class="tx">${L.col?L.col[i]:c}</td>`;
      return `<td>${c}</td>`}).join("")+"</tr>"});
    h+=`</table></div>`}
  h+=`<div class="h">${u.ex}</div><ul class="ex">`+t.ex.map((e,k)=>`<li><span class="de-t">${e[0]}</span><span class="ar">${L.ex[k]}</span></li>`).join("")+`</ul>`;
  if(t.err)h+=`<div class="h">${u.err}</div><div class="err"><div class="w"><span class="sym">✗</span><span class="de-t">${L.err0}</span></div><div class="r"><span class="sym">✓</span><span class="de-t">${t.err[1]}</span></div></div>`;
  if(L.tip)h+=`<div class="tip"><b>${u.tip}</b>${L.tip}</div>`;
  h+=`<div class="quiz"><div class="h">${u.quiz}</div></div><div class="qscore" aria-live="polite"></div>`;
  h+=`<button class="mark">${done[id(t)]?u.marked:u.mark}</button></div>`;
  d.innerHTML=h;
  const qz=d.querySelector(".quiz"),sc=d.querySelector(".qscore");let ans=0,right=0;
  t.qz.forEach((q,i)=>qz.appendChild(quizItem(q,i+1,ok=>{ans++;if(ok)right++;
    if(ans===t.qz.length){const all=right===t.qz.length;sc.textContent=all?u.perfect(right):u.partial(right,t.qz.length);sc.style.color=all?"var(--ok)":"var(--ochre)"}})));
  d.querySelector(".mark").onclick=()=>{
    if(done[id(t)])delete done[id(t)];else done[id(t)]=1;save();
    const n=topicEl(t,showU);n.open=d.open;d.replaceWith(n);stats();
  };
  return d;
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function testBox(title,sub,pool,max,cls,elId){
  const u=S();
  const box=document.createElement("section");box.className="plateau"+(cls?" "+cls:"");box.id=elId;
  const intro=()=>{box.innerHTML=`<div class="ph"><div><strong>${title}</strong><div class="sub">${sub}</div></div><button class="btn">${u.start}</button></div>`;
    box.querySelector(".btn").onclick=start};
  const start=()=>{
    const qs=shuffle(pool).slice(0,max);let i=0,right=0;const wrong=[];
    const step=()=>{
      if(i>=qs.length){
        const pct=Math.round(right/qs.length*100);
        box.innerHTML=`<div class="pq result"><div class="big">${right} / ${qs.length}</div><div>${pct>=80?u.r80:pct>=60?u.r60:u.rLow}</div>${wrong.length?`<div class="sub" style="color:var(--muted);font-size:.88rem">${[...new Set(wrong)].join(" · ")}</div>`:""}<div style="display:flex;gap:8px"><button class="btn">${u.retry}</button><button class="btn ghost">${u.close}</button></div></div>`;
        const [a,b]=box.querySelectorAll("button");a.onclick=start;b.onclick=intro;return;
      }
      const q=qs[i];
      box.innerHTML=`<div class="pq"><div class="meta"><span>${title}</span><span>${i+1} / ${qs.length}</span></div><div class="src">${loc(q.t).title} · ${uLabel(q.t.u)}</div></div>`;
      const pq=box.querySelector(".pq");
      pq.appendChild(quizItem(q.q,i+1,ok=>{if(ok)right++;else wrong.push(loc(q.t).title);
        const nx=document.createElement("button");nx.className="btn";nx.style.justifySelf="start";nx.textContent=i+1<qs.length?u.next:u.result;
        nx.onclick=()=>{i++;step()};pq.appendChild(nx);nx.focus({preventScroll:true})}));
    };
    step();
  };
  intro();return box;
}
const poolFor=units=>T.filter(t=>units.includes(t.u)).flatMap(t=>t.qz.map(q=>({q,t})));

function render(){
  stats();const u=S();
  const m=document.getElementById("main");m.innerHTML="";
  const q=qv();const list=document.createElement("div");list.className="list";
  if(q){
    const r=T.filter(t=>{const L=loc(t);return (L.title+" "+t.de+" "+L.x+" "+t.ar).toLowerCase().includes(q)});
    const h=document.createElement("div");h.className="unit";h.innerHTML=`<div class="top"><span class="ttl">${u.results}</span><span class="de">${r.length}</span></div>`;list.appendChild(h);
    r.forEach(t=>list.appendChild(topicEl(t,true)));
    if(!r.length)list.insertAdjacentHTML("beforeend",`<p class="empty">${u.empty}</p>`);
    m.appendChild(list);return;
  }
  UNITS.forEach(U=>{
    const h=document.createElement("div");h.className="unit";h.id="u-"+U[0];
    h.innerHTML=`<div class="top"><span class="n">${U[1]}</span><span class="ttl">${unitTitle(U)}</span></div><span class="de">${U[2]}</span>`;
    list.appendChild(h);
    T.filter(t=>t.u===U[0]).forEach(t=>list.appendChild(topicEl(t,false)));
    if(U[4]){const P=PLATEAUS[U[4]];list.appendChild(testBox("Plateau "+U[4],u.plSub(P.map(uLabel).join(u.sep)),poolFor(P),12,"","p-"+U[4]))}
  });
  list.appendChild(testBox("A1 Abschlusstest",u.finSub,poolFor(UNITS.map(x=>x[0])),25,"final","final"));
  m.appendChild(list);
}
document.getElementById("q").addEventListener("input",render);
applyLang();
render();
</script>
